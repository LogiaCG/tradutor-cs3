name: Build instalador Windows

# Roda automaticamente a cada push na main, ou manualmente pela aba Actions
# (botão "Run workflow"). Necessário porque a sandbox onde este projeto foi
# gerado não tem Rust instalado e não tem acesso à internet liberado para
# crates.io/npm — o runner do GitHub tem os dois, então é ele quem compila.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências (Tauri CLI)
        run: npm install

      - name: Build do instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Tradutor CS3 v__VERSION__"
          releaseBody: "Build automático do instalador Windows (NSIS). Baixe o .exe nos assets deste release."
          releaseDraft: true
          prerelease: false
