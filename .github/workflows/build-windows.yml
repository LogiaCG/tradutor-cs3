name: Build instalador Windows

# Roda automaticamente a cada push na main, ou manualmente pela aba Actions
# (botão "Run workflow"). Necessário porque a sandbox onde este projeto foi
# gerado não tem Rust instalado e não tem acesso à internet liberado para
# crates.io/npm — o runner do GitHub tem os dois, então é ele quem compila.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar dependências (Tauri CLI)
        run: npm install

      # Build direto pela CLI (em vez do tauri-apps/tauri-action) porque a
      # action tenta criar um GitHub Release automaticamente, e isso exige o
      # GITHUB_TOKEN com permissão de escrita — permissão que depende de uma
      # configuração no repositório (Settings > Actions > General > Workflow
      # permissions) e não só do bloco `permissions:` do workflow. Foi
      # exatamente isso que causou "Resource not accessible by integration"
      # nas duas primeiras tentativas. Buildando direto e publicando como
      # artefato do run, o token padrão (só leitura) já é suficiente — sem
      # depender de nenhuma configuração extra no GitHub.
      - name: Build do instalador
        run: npm run tauri build

      - name: Publicar o instalador como artefato deste run
        uses: actions/upload-artifact@v4
        with:
          name: tradutor-cs3-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
