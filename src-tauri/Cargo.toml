[package]
name = "tradutor-cs3"
version = "0.1.0"
description = "Tradutor CS3 - ferramenta de tradução assistida por IA para Trails of Cold Steel III"
authors = ["Matheus"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fase 2: escolher a pasta do SenScriptsDecompiler e o arquivo .dat pra abrir
# precisa de um seletor NATIVO (que devolve caminho real de disco) — o
# <input type=file> do navegador não serve pra isso, só devolve um Blob sem
# caminho utilizável por um processo externo.
tauri-plugin-dialog = "2"
