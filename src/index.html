            lines.push("-".repeat(72));
            lines.push(`${term}  →  ${translation || "(mantém igual — não traduzir)"}`);
            lines.push(`  (encontrado ${count}x nos arquivos abertos nesta sessão)`);
          }
          lines.push("-".repeat(72));
        }

        downloadTextFile(lines.join("\n"), "glossario_termos_TLoH.txt");
      };

      // Escrita de fato do .xlsx traduzido — sem checagem de QA. Só é chamada
      // diretamente quando o QA já passou, ou pelo botão "Exportar mesmo
      // assim" depois que a pessoa decidiu conscientemente ignorar os avisos.
      // options.onlyVerified: só escreve célula onde a linha foi aprovada
      //   (o resto do arquivo sai como estava, em inglês)
      // Monta o workbook traduzido em memória (grava as células, mas NÃO baixa
      // ainda) — reaproveitado tanto pelo download de UM arquivo quanto pelo
      // empacotamento em .zip de vários arquivos de uma vez só.
      const buildTranslatedWorkbook = (doc, onlyVerified) => {
        const originalData = originalDataMapRef.current.get(doc.id);
        if (!originalData) return null;
        const wb = XLSX.read(originalData, { type: "array" });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        for (const e of doc.entries) {
          if (doc.ignored[e.ref]) continue;
          if (onlyVerified && !doc.verified[e.ref]) continue; // deixa como estava (original) se ainda não foi aprovado
          const text = doc.translations[e.ref];
          if (text && text.trim().length > 0) {
            ws[e.ref] = { ...(ws[e.ref] || {}), t: "s", v: text };
          }
        }
        const suffix = onlyVerified ? "_traduzido_verificado" : "_traduzido";
        const filename = `${safeForFilename(doc.project)}_${baseName(doc.fileName)}${suffix}.xlsx`;
        const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        return { filename, bytes };
      };

      const doExportTranslated = (doc, options = {}) => {
        const built = buildTranslatedWorkbook(doc, !!options.onlyVerified);
        if (!built) return;
        const blob = new Blob([built.bytes], { type: "application/octet-stream" });
        saveBlobToDisk(
          blob,
          built.filename,
          "Planilha Excel",
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          [".xlsx"]
        );
      };

      // "Baixar todos" é onde o "Salvar como" clássico do navegador vira um
      // problema de verdade: sem pasta fixa escolhida, CADA arquivo dispara
      // sua PRÓPRIA caixa de diálogo — com 10+ arquivos isso é 10+ cliques
      // manuais em sequência, e vários navegadores travam/avisam depois de
      // alguns downloads automáticos seguidos. A correção: sem pasta fixa,
      // empacota tudo num .zip só e baixa isso — 1 clique, 1 diálogo,
      // funciona em qualquer navegador. Com pasta fixa escolhida (File
      // System Access API), continua gravando direto nela sem diálogo
      // nenhum — já era o caminho mais rápido, não tem motivo pra mudar.
      const doExportAllTranslated = async (options = {}) => {
        const onlyVerified = !!options.onlyVerified;
        const targets = docs.filter((d) => originalDataMapRef.current.has(d.id));
        if (targets.length === 0) return;

        setExportAllProgress({ done: 0, total: targets.length });
        const reportProgress = (done, total) => setExportAllProgress({ done, total });
        try {
          if (savedDirHandle || !window.JSZip) {
            // pasta fixa já escolhida (grava direto, sem diálogo) OU JSZip
            // não carregou (sem internet?) — cai pro caminho de antes, um
            // arquivo de cada vez, com uma pequena pausa entre gravações.
            await withExportProgress(
              targets,
              (doc) => doExportTranslated(doc, { onlyVerified }),
              reportProgress,
              350
            );
            return;
          }

          const zip = new window.JSZip();
          await withExportProgress(
            targets,
            (doc) => {
              const built = buildTranslatedWorkbook(doc, onlyVerified);
              if (built) zip.file(built.filename, built.bytes);
            },
            reportProgress
          );
          const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
          const suffix = onlyVerified ? "_traduzidos_verificados" : "_traduzidos";
          const zipName = `${safeForFilename(activeProject || "projeto")}${suffix}_${targets.length}arquivos.zip`;
          await saveBlobToDisk(zipBlob, zipName, "Arquivo ZIP", "application/zip", [".zip"]);
        } finally {
          setExportAllProgress(null);
        }
      };

      // QA BLOQUEANTE: diferente do antigo window.confirm (fácil de clicar
      // "OK" sem ler), quando há problema CRÍTICO a exportação é interrompida
      // de verdade — abre a aba "Verificar qualidade" com a lista completa e
      // só libera de novo através de uma ação explícita ("Exportar mesmo
      // assim", renderizado ali dentro quando pendingExport está preenchido).
      // options.skipQaCheck: usado internamente por doExportAllTranslated via
      // exportAllTranslated (o aviso agregado já cobre isso) — não é mais
      // necessário no caminho normal porque doExportTranslated não checa QA.
      const exportTranslated = (doc, options = {}) => {
        const items = runQualityCheck([doc], properNouns);
        const critical = items.filter((it) => it.issues.some((i) => i.severity === "critical"));
        if (critical.length > 0) {
          setQaResults({ scope: "export", multiDoc: false, generatedAt: Date.now(), items });
          setActivePanel("qa");
          setPendingExport({ kind: "one", doc, options });
          notify(
            `Exportação de "${doc.fileName}" BLOQUEADA: ${critical.length} linha(s) têm código do jogo ausente/alterado na tradução — isso PODE QUEBRAR O JOGO.\n\n` +
            `Abri a aba "Verificar qualidade" com a lista completa. Corrija as linhas ou, se tiver certeza que quer exportar assim mesmo, use o botão "Exportar mesmo assim" no topo daquela aba.`
          , "info");
          return;
        }
        doExportTranslated(doc, options);
      };

      const exportAllTranslated = async (options = {}) => {
        const items = runQualityCheck(docs, properNouns);
        const critical = items.filter((it) => it.issues.some((i) => i.severity === "critical"));
        if (critical.length > 0) {
          const affectedFiles = new Set(critical.map((it) => it.fileName)).size;
          setQaResults({ scope: "export-all", multiDoc: true, generatedAt: Date.now(), items });
          setActivePanel("qa");
          setPendingExport({ kind: "all", options });
          notify(
            `Exportação BLOQUEADA: ${critical.length} linha(s) em ${affectedFiles} arquivo(s) têm código do jogo ausente/alterado na tradução — isso PODE QUEBRAR O JOGO.\n\n` +
            `Abri a aba "Verificar qualidade" (todos os arquivos) com a lista completa. Corrija as linhas ou, se tiver certeza, use o botão "Exportar mesmo assim" no topo daquela aba.`
          , "info");
          return;
        }
        await doExportAllTranslated(options);
      };

      // Libera a exportação que ficou esperando decisão depois de um bloqueio
      // de QA — chamada só pelo botão "Exportar mesmo assim".
      const forcePendingExport = () => {
        if (!pendingExport) return;
        if (pendingExport.kind === "one") doExportTranslated(pendingExport.doc, pendingExport.options);
        else if (pendingExport.kind === "all") doExportAllTranslated(pendingExport.options);
        setPendingExport(null);
      };

      const cancelPendingExport = () => setPendingExport(null);

      // ---------------------------------------------------------------------------
      // Colaboração multiusuário: exporta só o ESTADO do trabalho (tradução,
      // ignorado, verificado, memória, glossário) num .json — bem menor que
      // reenviar o .xlsx inteiro, e dá pra outra pessoa importar em cima dos
      // arquivos que ELA já tem abertos (não precisa ser os mesmos bytes,
      // só o mesmo projeto+nome de arquivo).
      // ---------------------------------------------------------------------------
      const exportProjectState = (scope) => {
        const scopedDocs = scope === "file" ? (activeDoc ? [activeDoc] : []) : docs;
        if (scopedDocs.length === 0) {
          notify("Não há arquivo carregado pra exportar.", "info");
          return;
        }
        const payload = {
          app: "TLoH Trails of Cold Steel Tradutor",
          kind: "project-state-export",
          version: 1,
          exportedAt: new Date().toISOString(),
          docs: scopedDocs.map((d) => ({
            project: d.project,
            fileName: d.fileName,
            translations: d.translations,
            ignored: d.ignored,
            verified: d.verified,
            autoTranslated: d.autoTranslated,
            translationFailed: d.translationFailed,
            coherenceReview: d.coherenceReview,
            fromMemory: d.fromMemory,
          })),
          translationMemory,
          properNouns,
        };
        const label = scope === "file" && activeDoc ? safeForFilename(`${activeDoc.project}_${baseName(activeDoc.fileName)}`) : safeForFilename(activeProject || "todos");
        downloadTextFile(JSON.stringify(payload, null, 2), `estado_${label}_TLoH.json`);
      };

      // Mescla um export de outra pessoa no que já está aberto aqui. Regra:
      //  - linha que aqui está vazia -> recebe a tradução importada direto
      //  - linha igual dos dois lados -> só funde os selos (verificado etc.)
      //  - linha DIFERENTE nos dois lados -> vira conflito, não sobrescreve
      //    sozinho; fica numa lista pra você decidir uma por uma
      //  - memória e glossário: só ACRESCENTA termo novo, nunca troca um que
      //    já existe aqui (evita um import malfeito bagunçar o que já tinha)
      const importProjectState = async (file) => {
        let data;
        try {
          const text = await file.text();
          data = JSON.parse(text);
        } catch (e) {
          notify("Não consegui ler esse arquivo — confira se é um .json exportado por este app.", "info");
          return;
        }
        if (!data || !Array.isArray(data.docs)) {
          notify('Esse arquivo não parece ser um export de estado deste app (faltando "docs").', "info");
          return;
        }

        const matchedDocIds = data.docs
          .map((importedDoc) => {
            const local = docsRef.current.find((d) => d.project === importedDoc.project && d.fileName === importedDoc.fileName);
            return local ? local.id : null;
          })
          .filter(Boolean);
        if (matchedDocIds.length > 0) {
          pushUndoSnapshot(`Importar estado (${data.docs.length} arquivo(s))`, matchedDocIds);
        }

        let filledCount = 0;
        let mergedFlagsCount = 0;
        let notOpenCount = 0;
        const conflicts = [];

        for (const importedDoc of data.docs) {
          const localDoc = docsRef.current.find((d) => d.project === importedDoc.project && d.fileName === importedDoc.fileName);
          if (!localDoc) {
            notOpenCount += Object.keys(importedDoc.translations || {}).length;
            continue; // essa pessoa tem um arquivo que você não abriu ainda
          }

          updateDoc(localDoc.id, (d) => {
            const translations = { ...d.translations };
            const ignored = { ...d.ignored };
            const verified = { ...d.verified };

            for (const [ref, importedTextRaw] of Object.entries(importedDoc.translations || {})) {
              const impText = (importedTextRaw || "").trim();
              if (!impText) continue;
              const localText = (translations[ref] || "").trim();

              if (!localText) {
                translations[ref] = importedTextRaw;
                if (importedDoc.verified && importedDoc.verified[ref]) verified[ref] = true;
                if (importedDoc.ignored && importedDoc.ignored[ref]) ignored[ref] = true;
                filledCount += 1;
              } else if (localText === impText) {
                if (importedDoc.verified && importedDoc.verified[ref] && !verified[ref]) {
                  verified[ref] = true;
                  mergedFlagsCount += 1;
                }
              } else {
                const entry = localDoc.entries.find((e) => e.ref === ref);
                conflicts.push({
                  docId: localDoc.id,
                  project: localDoc.project,
                  fileName: localDoc.fileName,
                  ref,
                  original: entry ? entry.original : "",
                  local: localText,
                  imported: impText,
                  importedVerified: !!(importedDoc.verified && importedDoc.verified[ref]),
                });
              }
            }

            const next = { ...d, translations, ignored, verified };
            scheduleSave(next);
            return next;
          });
        }

        let memoryAdded = 0;
        if (data.translationMemory && typeof data.translationMemory === "object") {
          setTranslationMemory((prev) => {
            const next = { ...prev };
            for (const [key, val] of Object.entries(data.translationMemory)) {
              if (!next[key] && val && val.translation) {
                next[key] = val;
                memoryAdded += 1;
              }
            }
            return next;
          });
        }

        let termsAdded = 0;
        if (Array.isArray(data.properNouns)) {
          setProperNouns((prev) => {
            const existing = new Set(prev.map((p) => (p.term || "").toLowerCase()));
            const additions = data.properNouns.filter((p) => p.term && !existing.has(p.term.toLowerCase()));
            termsAdded = additions.length;
            return additions.length > 0 ? [...prev, ...additions] : prev;
          });
        }

        setImportSummary({
          filledCount,
          mergedFlagsCount,
          notOpenCount,
          memoryAdded,
          termsAdded,
          conflicts,
          importedAt: Date.now(),
        });
        setActivePanel("collab");
      };

      // usada pelos botões da lista de conflitos: "manter minha" só remove o
      // conflito da lista (não mexe em nada); "usar importada" substitui o
      // texto local pelo importado (sem aprovar sozinho — fica pendente de
      // revisão igual qualquer tradução nova)
      const resolveConflict = (conflict, choice) => {
        if (choice === "imported") {
          updateDoc(conflict.docId, (d) => {
            const translations = { ...d.translations, [conflict.ref]: conflict.imported };
            const verified = { ...d.verified };
            delete verified[conflict.ref]; // precisa ser revisada de novo por quem está aqui
            const next = { ...d, translations, verified };
            scheduleSave(next);
            return next;
          });
        }
        setImportSummary((prev) => {
          if (!prev) return prev;
          return { ...prev, conflicts: prev.conflicts.filter((c) => !(c.docId === conflict.docId && c.ref === conflict.ref)) };
        });
      };

      const exportBatchReport = (doc) => {
        if (!doc.lastBatch || doc.lastBatch.length === 0) return;
        const rows = [["Célula", "Location", "Tipo", "Texto Original", "Tradução Automática"]];
        const byRef = new Map(doc.entries.map((e) => [e.ref, e]));
        for (const ref of doc.lastBatch) {
          const e = byRef.get(ref);
          if (!e) continue;
          const tipo = "dialog";
          rows.push([e.ref, e.location, tipo, e.original, doc.translations[e.ref] || ""]);
        }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 70 }, { wch: 70 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Alterações do Lote");
        downloadWorkbook(wb, `${safeForFilename(doc.project)}_${baseName(doc.fileName)}_alteracoes_lote.xlsx`);
      };

      // --- tradução automática em lote (arquivo atual / filtro atual / todos) --
      // Junta os candidatos pendentes (textos em inglês sem tradução, no
      // escopo escolhido) e agrupa por texto IDÊNTICO — mesma lógica usada
      // tanto pelo lote síncrono (runBatchTranslate) quanto pelo envio pra
      // Batch API assíncrona (submitBatchApiJob), então os dois caminhos
      // sempre concordam sobre "o que falta traduzir".
      const collectPendingGroups = () => {
        let candidates = []; // {docId, ref, original}

        if (batchScope === "filter") {
          if (!activeDoc) return { candidates: [], orderedGroups: [], totalLines: 0, uniqueCount: 0 };
          for (const e of filtered) {
            if (activeDoc.ignored[e.ref]) continue;
            if ((activeDoc.translations[e.ref] || "").trim()) continue;
            if (e.lang === "pt") continue;
            candidates.push({ docId: activeDoc.id, ref: e.ref, original: e.original });
          }
        } else {
          const scopedDocs = batchScope === "all" ? docs : docs.filter((d) => d.id === activeId);
          for (const doc of scopedDocs) {
            for (const e of doc.entries) {
              if (doc.ignored[e.ref]) continue;
              if ((doc.translations[e.ref] || "").trim()) continue;
              if (e.lang === "pt") continue; // já está em português, não mexe
              candidates.push({ docId: doc.id, ref: e.ref, original: e.original });
            }
          }
        }

        // Agrupa por texto original IDÊNTICO: traduz uma vez só por grupo e
        // aplica pra todas as linhas iguais (mesmo princípio da propagação
        // manual, só que em lote). Isso corta MUITO o número de chamadas à
        // API — um arquivo com bastante repetição pode ter 2000 linhas
        // pendentes mas só 300 textos únicos. Também ordena os grupos do
        // mais repetido pro menos repetido: se você cancelar no meio, o
        // que já rodou cobriu o máximo de linhas possível.
        const groups = new Map(); // key -> { original, members: [{docId, ref}] }
        for (const c of candidates) {
          const key = memoryKey(c.original);
          if (!groups.has(key)) groups.set(key, { original: c.original, members: [] });
          groups.get(key).members.push({ docId: c.docId, ref: c.ref });
        }
        const orderedGroups = Array.from(groups.values()).sort((a, b) => b.members.length - a.members.length);
        return { candidates, orderedGroups, totalLines: candidates.length, uniqueCount: orderedGroups.length };
      };

      // --- revisor de coerência (IA) -------------------------------------------
      // Junta as linhas JÁ TRADUZIDAS do escopo escolhido (mesmo seletor
      // "escopo" usado pro lote de tradução automática, reaproveitado de
      // propósito — dois escopos separados na mesma barra confundiriam mais
      // do que ajudariam) que ainda precisam de revisão: têm tradução não
      // vazia, NÃO são translationFailed (aquilo é o texto ORIGINAL mantido
      // de propósito por engano de tradução — perguntar pro modelo "isso
      // quer dizer a mesma coisa que o original" sempre daria nota máxima
      // por definição, já que é o MESMO texto, e isso não informa nada), e
      // ou nunca foram revisadas ou a tradução mudou desde a última revisão
      // (ver reviewTextHash) — sem essa checagem, clicar "Revisar
      // coerência" de novo re-pagaria por toda linha já revisada, mesmo sem
      // nada ter mudado nela.
      const collectReviewableEntries = () => {
        const candidates = []; // {docId, ref, original, translation}
        const pushFromDoc = (doc, entriesList) => {
          for (const e of entriesList) {
            if (doc.ignored[e.ref]) continue;
            const translation = doc.translations[e.ref];
            if (!translation || !translation.trim()) continue;
            if (doc.translationFailed && doc.translationFailed[e.ref]) continue;
            const hash = reviewTextHash(translation);
            const existing = doc.coherenceReview && doc.coherenceReview[e.ref];
            if (existing && existing.textHash === hash) continue; // já revisada, sem mudança desde então
            candidates.push({ docId: doc.id, ref: e.ref, original: e.original, translation });
          }
        };

        if (batchScope === "filter") {
          if (activeDoc) pushFromDoc(activeDoc, filtered);
        } else {
          const scopedDocs = batchScope === "all" ? docs : docs.filter((d) => d.id === activeId);
          for (const doc of scopedDocs) pushFromDoc(doc, doc.entries);
        }
        return { candidates, totalLines: candidates.length };
      };

      const runCoherenceReview = async () => {
        if (settings.engine !== "llm") {
          notify('O revisor de coerência usa o mesmo motor de IA já configurado — troque o "Motor" pra "IA (Anthropic/OpenAI/Google/Ollama)" nas configurações antes de revisar.', "info");
          return;
        }
        if (!settings.llmApiKey || !settings.llmApiKey.trim()) {
          notify("Chave de API não configurada — adicione ela nas configurações do motor LLM antes de revisar.", "info");
          return;
        }
        const { candidates } = collectReviewableEntries();
        if (candidates.length === 0) {
          notify("Não há linhas pendentes de revisão de coerência no escopo selecionado (sem tradução, ou já revisadas sem mudança desde então).", "info");
          return;
        }

        const scopeLabel = batchScope === "filter" ? "apenas o filtro/busca atual" : batchScope === "all" ? "todos os arquivos carregados" : "o arquivo atual";
        if (!window.confirm(
          `Isso vai avaliar a coerência de ${candidates.length} linha(s) já traduzida(s) usando a IA (${llmProviderLabel(settings.llmProvider)}) — ` +
          `consome créditos da sua chave de API, à parte do custo da tradução em si.

` +
          `Escopo: ${scopeLabel}. Linhas já revisadas cuja tradução não mudou são puladas automaticamente. Continuar?`
        )) return;

        cancelReviewRef.current = false;
        setReviewTotal(candidates.length);
        setReviewDone(0);
        setReviewFailed(0);
        setLastReviewErrorSample(null);
        setReviewRunning(true);

        let doneCount = 0;
        let failedCount = 0;
        let sampleError = null;

        const chunkSize = llmBatchSizeFor(settings);
        const chunks = [];
        for (let i = 0; i < candidates.length; i += chunkSize) {
          chunks.push(candidates.slice(i, i + chunkSize));
        }
        let chunkCursor = 0;
        const pacing = llmPacingFor(settings);
        const rateGate = createRateLimitGate();

        // Sem retry embutido de propósito (diferente de translateBatchWithRetry):
        // um chunk que falha não mexe em NADA já salvo (revisão não é
        // destrutiva, ao contrário de tradução), e collectReviewableEntries já
        // torna o botão idempotente — clicar "Revisar coerência" de novo só
        // cobre o que ainda ficou sem nota, sem re-pagar pelo que já deu certo.
        const applyChunkResult = (chunk, reviews) => {
          for (let i = 0; i < chunk.length; i++) {
            const c = chunk[i];
            if (!reviews) { failedCount += 1; continue; }
            const r = reviews[i];
            updateDoc(c.docId, (d) => {
              const coherenceReview = {
                ...d.coherenceReview,
                [c.ref]: { nota: r.nota, explicacao: r.explicacao, textHash: reviewTextHash(c.translation), revisadoEm: Date.now() },
              };
              const next = { ...d, coherenceReview };
              scheduleSave(next);
              return next;
            });
            doneCount += 1;
          }
          setReviewDone(doneCount);
          setReviewFailed(failedCount);
          if (sampleError) setLastReviewErrorSample(sampleError);
        };

        const worker = async (workerIdx) => {
          await sleep(workerIdx * pacing.staggerMs);
          while (chunkCursor < chunks.length) {
            if (cancelReviewRef.current) return;
            await waitForRateLimitGate(rateGate);
            if (cancelReviewRef.current) return;
            const chunk = chunks[chunkCursor++];
            let reviews = null;
            try {
              reviews = await reviewCoherenceBatchViaLLM(settings, chunk.map((c) => ({ original: c.original, traducao: c.translation })));
            } catch (e) {
              if (e && e.status === 429) noteRateLimited(rateGate, e.retryAfterMs);
              sampleError = e && e.message ? e.message : String(e);
              console.error("Falha ao revisar coerência do lote", e);
              reviews = null;
            }
            if (cancelReviewRef.current) return;
            applyChunkResult(chunk, reviews);
            await sleep(pacing.paceMs);
          }
        };

        await Promise.all(Array.from({ length: pacing.concurrency }, (_, i) => worker(i)));

        setReviewRunning(false);
        // já reflete as notas novas na lista de QA sem precisar clicar
        // "Verificar qualidade" nenhuma vez a mais
        if (qaResults) runQaScan(qaResults.scope);

        if (failedCount > 0) {
          notify(
            `${failedCount} de ${candidates.length} linha(s) não puderam ser revisadas (erro de rede/API) — o resto foi avaliado normalmente. ` +
            `Último erro: ${sampleError || "desconhecido"}. Clique em "Revisar coerência" de novo pra tentar só o que faltou.`,
            "info"
          );
        } else {
          notify(`Revisão de coerência concluída: ${doneCount} linha(s) avaliada(s). Veja "Verificar qualidade" pra ver as que ficaram com nota baixa.`, "ok");
        }
      };

      const cancelCoherenceReview = () => {
        cancelReviewRef.current = true;
      };

      const runBatchTranslate = async () => {
        const { candidates, orderedGroups, totalLines, uniqueCount } = collectPendingGroups();

        if (candidates.length === 0) {
          notify("Não há textos em inglês pendentes para traduzir automaticamente no escopo selecionado.", "info");
          return;
        }

        const scopeLabel = batchScope === "filter" ? "apenas o filtro/busca atual" : batchScope === "all" ? "todos os arquivos carregados" : "o arquivo atual";
        const engineLabel =
          settings.engine === "mymemory"
            ? "o serviço gratuito MyMemory pela internet (en→pt-BR)"
            : settings.engine === "llm"
            ? `a IA (${llmProviderLabel(settings.llmProvider)}) — isso consome créditos pagos da sua chave de API`
            : `o LibreTranslate rodando no seu computador (${settings.ltEndpoint})`;
        const batchNote =
          settings.engine === "llm"
            ? ` As linhas são agrupadas em lotes de até ${llmBatchSizeFor(settings)} por requisição, pra gastar menos chamadas de API.`
            : "";
        const proceed = window.confirm(
          `Isso vai traduzir ${uniqueCount} texto(s) único(s) usando ${engineLabel}, cobrindo ${totalLines} linha(s) no total` +
          `${totalLines > uniqueCount ? ` (${totalLines - uniqueCount} são repetições que ganham a mesma tradução automaticamente)` : ""}.\n\n` +
          `Escopo: ${scopeLabel}. Começa pelos textos mais repetidos primeiro.${batchNote}\n` +
          `Os códigos do jogo (#E[1]#M_0#B_0 etc.) são preservados automaticamente. É só um rascunho — sempre revise. Continuar?`
        );
        if (!proceed) return;

        pushUndoSnapshot(
          `Lote de tradução (${uniqueCount} texto(s))`,
          [...new Set(orderedGroups.flatMap((g) => g.members.map((m) => m.docId)))]
        );

        cancelBatchRef.current = false;
        setBatchTotal(uniqueCount);
        setBatchDone(0);
        setBatchFailed(0);
        setLastErrorSample(null);
        setBatchRunning(true);

        const perDocNewRefs = new Map(); // docId -> [refs]
        let doneCount = 0;
        let failedCount = 0;
        let sampleError = null;

        // Aplica o resultado (ou null, se falhou de vez) de UM grupo a todas
        // as linhas duplicadas dele, e atualiza os contadores de progresso.
        // Compartilhado pelos dois caminhos abaixo (lote LLM e item a item)
        // pra manter o comportamento de progresso/contagem idêntico nos dois.
        const applyGroupResult = (group, translated) => {
          if (translated == null) {
            // O motor falhou (ou o retorno não passou na validação) mesmo
            // depois de esgotar as tentativas. Deixar a linha em branco é
            // PIOR do que manter o texto original: em branco o jogo não
            // mostra nada; com o original mantido, ao menos aparece a fala
            // em inglês enquanto a linha espera ser retraduzida.
            // `translationFailed` é o que diferencia isso de uma tradução
            // de verdade — vira um problema CRÍTICO no QA (ver
            // checkEntryIssues), o que já a inclui em "Apagar críticos e
            // refazer" pra reenviar ao próximo lote depois de revisada.
            failedCount += 1;
            for (const m of group.members) {
              updateDoc(m.docId, (d) => {
                const next = {
                  ...d,
                  translations: { ...d.translations, [m.ref]: group.original },
                  autoTranslated: { ...d.autoTranslated, [m.ref]: false },
                  translationFailed: { ...d.translationFailed, [m.ref]: true },
                  coherenceReview: (() => { const c = { ...d.coherenceReview }; delete c[m.ref]; return c; })(),
                };
                scheduleSave(next);
                return next;
              });
              if (!perDocNewRefs.has(m.docId)) perDocNewRefs.set(m.docId, []);
              perDocNewRefs.get(m.docId).push(m.ref);
            }
          } else {
            for (const m of group.members) {
              updateDoc(m.docId, (d) => {
                // Se esta linha já tinha sido marcada como falha antes (e
                // agora, no reenvio, o motor conseguiu traduzir), a flag
                // precisa sumir — senão o QA continuaria acusando um
                // problema que já foi resolvido.
                const translationFailed = { ...d.translationFailed };
                delete translationFailed[m.ref];
                // tradução NOVA: a nota de coerência antiga (se havia) era
                // sobre um texto que não existe mais
                const coherenceReview = { ...d.coherenceReview };
                delete coherenceReview[m.ref];
                const next = {
                  ...d,
                  translations: { ...d.translations, [m.ref]: translated },
                  autoTranslated: { ...d.autoTranslated, [m.ref]: true },
                  translationFailed,
                  coherenceReview,
                };
                scheduleSave(next);
                return next;
              });
              if (!perDocNewRefs.has(m.docId)) perDocNewRefs.set(m.docId, []);
              perDocNewRefs.get(m.docId).push(m.ref);
            }
            // NÃO chama learnTranslation aqui — isto é rascunho de máquina,
            // ainda não revisado por ninguém. Só entra na memória quando
            // uma pessoa aprovar a linha (toggleVerified) ou usar
            // "Importar verificados dos arquivos".
          }
          doneCount += 1;
          setBatchDone(doneCount);
          setBatchFailed(failedCount);
          if (sampleError) setLastErrorSample(sampleError);
        };

        if (settings.engine === "llm") {
          // Motor de IA: agrupa vários textos ÚNICOS numa mesma requisição
          // (translateBatchViaLLM) em vez de 1 chamada por texto — corta
          // bastante o número de requisições e o custo/latência total de
          // lotes grandes. Se um lote inteiro falhar (rede, JSON malformado,
          // rate limit persistente mesmo após o retry embutido em
          // translateBatchWithRetry), cai pro caminho antigo — 1 texto por
          // chamada, com o mesmo backoff — só pros itens daquele lote
          // específico, pra não perder o lote todo por causa de um problema
          // pontual.
          const chunkSize = llmBatchSizeFor(settings);
          const chunks = [];
          for (let i = 0; i < orderedGroups.length; i += chunkSize) {
            chunks.push(orderedGroups.slice(i, i + chunkSize));
          }
          let chunkCursor = 0;
          // pacing agora recebe o settings inteiro (não só o provedor): a
          // calibragem certa depende também de a chamada ir pra API oficial
          // ou pra um servidor local.
          const pacing = llmPacingFor(settings);
          // freio compartilhado: um 429 em QUALQUER worker segura todos
          // (auditoria #2 M3)
          const rateGate = createRateLimitGate();

          const chunkWorker = async (workerIdx) => {
            await sleep(workerIdx * pacing.staggerMs); // evita disparar tudo de uma vez
            while (chunkCursor < chunks.length) {
              if (cancelBatchRef.current) return;
              await waitForRateLimitGate(rateGate);
              if (cancelBatchRef.current) return; // pode ter sido cancelado durante a espera
              const chunk = chunks[chunkCursor++];
              let translations = null;
              try {
                translations = await translateBatchWithRetry(chunk.map((g) => g.original), settings, properNouns, translationMemory, 2, workerIdx);
              } catch (e) {
                if (e && e.status === 429) noteRateLimited(rateGate, e.retryAfterMs);
                sampleError = (e && e.message ? e.message : String(e)) + " — traduzindo linha a linha nesse lote";
                console.error("Falha no lote, caindo pro fallback item a item", e);
                translations = null;
              }

              if (translations) {
                for (let i = 0; i < chunk.length; i++) {
                  if (cancelBatchRef.current) return;
                  applyGroupResult(chunk[i], translations[i]);
                }
              } else {
                // fallback item a item só pro lote que falhou
                for (const group of chunk) {
                  if (cancelBatchRef.current) return;
                  await waitForRateLimitGate(rateGate);
                  if (cancelBatchRef.current) return;
                  try {
                    const translated = await translateText(group.original, settings, properNouns, translationMemory);
                    applyGroupResult(group, translated);
                  } catch (e2) {
                    if (e2 && e2.status === 429) noteRateLimited(rateGate, e2.retryAfterMs);
                    sampleError = e2 && e2.message ? e2.message : String(e2);
                    console.error("Falha ao traduzir (fallback item a item)", group.original, e2);
                    applyGroupResult(group, null);
                  }
                  await sleep(pacing.itemPaceMs);
                }
              }
              await sleep(pacing.paceMs);
            }
          };

          await Promise.all(Array.from({ length: pacing.concurrency }, (_, i) => chunkWorker(i)));
        } else {
          // Motores estatísticos (MyMemory/LibreTranslate) só aceitam um
          // texto por requisição — mantém o loop item a item de antes, um
          // worker por "slot" de concorrência.
          let cursor = 0;
          // Local (LibreTranslate) roda no seu hardware, sem limite de taxa externo — pode paralelizar mais.
          const CONCURRENCY = settings.engine === "mymemory" ? 2 : 4;
          const STAGGER_MS = settings.engine === "mymemory" ? 250 : 60;
          const PACE_MS = settings.engine === "mymemory" ? 600 : 30;

          const worker = async (workerIdx) => {
            await sleep(workerIdx * STAGGER_MS); // evita disparar tudo de uma vez
            while (cursor < orderedGroups.length) {
              if (cancelBatchRef.current) return;
              const group = orderedGroups[cursor++];
              try {
                const translated = await translateText(group.original, settings, properNouns, translationMemory);
                applyGroupResult(group, translated);
              } catch (e) {
                sampleError = e && e.message ? e.message : String(e);
                console.error("Falha ao traduzir", group.original, e);
                applyGroupResult(group, null);
              } finally {
                await sleep(PACE_MS);
              }
            }
          };

          await Promise.all(Array.from({ length: CONCURRENCY }, (_, i) => worker(i)));
        }

        for (const [docId, refs] of perDocNewRefs.entries()) {
          updateDoc(docId, (d) => ({ ...d, lastBatch: refs }));
        }

        setBatchRunning(false);
        if (failedCount > 0 && failedCount === uniqueCount) {
          notify(
            `Nenhum dos ${uniqueCount} texto(s) pôde ser traduzido automaticamente.\n\n` +
            `Último erro: ${sampleError || "desconhecido"}\n\n` +
            (settings.engine === "mymemory"
              ? `Motivos comuns: sem internet no momento, o MyMemory atingiu o limite diário de uso, ou o navegador bloqueou a requisição.`
              : settings.engine === "llm" && settings.llmProvider === "google"
              ? `Motivos comuns: limite de requisições por minuto ou cota diária do Google AI Studio atingido, chave inválida, ou sem internet. Veja seus limites em aistudio.google.com/rate-limit — no tier gratuito costuma valer a pena traduzir em lotes menores ou trocar pro modelo "gemini-2.5-flash-lite" (cota geralmente maior). Use "Testar conexão" nas configurações para diagnosticar.`
              : settings.engine === "llm"
              ? `Motivos comuns: chave de API inválida ou sem crédito, limite de requisições atingido, ou sem internet no momento. Use "Testar conexão" nas configurações para diagnosticar.`
              : `Motivos comuns: o LibreTranslate não está rodando no seu computador, a URL nas configurações está errada, ou o modelo en→pt ainda não foi baixado. Use "Testar conexão" nas configurações para diagnosticar.`) +
            ` O texto original foi mantido em cada linha (não ficou em branco) e está marcado pra revisão — rode "Verificar qualidade" pra ver a lista e "Apagar críticos e refazer" pra reenviar ao próximo lote.`
          , "err");
        } else if (failedCount > 0) {
          // Falha PARCIAL: sem isto o usuário só veria "X falha(s)" na barra
          // de progresso, sem saber que essas linhas já receberam o texto
          // original (não ficaram em branco) e onde ir revisar.
          notify(
            `${failedCount} de ${uniqueCount} texto(s) não puderam ser traduzidos e mantiveram o texto original — ` +
            `rode "Verificar qualidade" pra ver essas linhas e "Apagar críticos e refazer" pra reenviar ao próximo lote.`,
            "info"
          );
        }
      };

      // ---------------------------------------------------------------------------
      // Message Batches API da Anthropic — alternativa assíncrona ao lote
      // "ao vivo" de cima: custa ~50% menos e não compete com o limite de
      // taxa síncrono, mas o resultado pode demorar minutos a até 24h. Só
      // suportada com provider "anthropic" por enquanto — a Batch API da
      // OpenAI exige um fluxo de upload de arquivo (multipart + polling de
      // arquivo de saída) mais burocrático, fica pra uma próxima versão.
      // NÃO TESTADA em produção nesta sessão: implementação seguiu a
      // documentação pública da API, mas não havia rede/chave disponível
      // aqui pra rodar de ponta a ponta — teste com um lote pequeno antes de
      // confiar nela pra um lote grande.
      // ---------------------------------------------------------------------------
      const submitBatchApiJob = async () => {
        if (settings.engine !== "llm") {
          notify('A Batch API só está disponível com o motor "IA (Anthropic/OpenAI)" selecionado nas configurações.', "info");
          return;
        }
        if (settings.llmProvider !== "anthropic") {
          notify("Por enquanto só a Batch API da Anthropic está implementada aqui — troque o provedor pra Anthropic nas configurações, ou use o lote normal (ao vivo) pra OpenAI.", "info");
          return;
        }
        if (!settings.llmApiKey || !settings.llmApiKey.trim()) {
          notify("Chave de API não configurada — adicione ela nas configurações do motor LLM.", "info");
          return;
        }
        const { candidates, orderedGroups, totalLines, uniqueCount } = collectPendingGroups();
        if (candidates.length === 0) {
          notify("Não há textos em inglês pendentes para traduzir automaticamente no escopo selecionado.", "info");
          return;
        }
        if (!window.confirm(
          `Isso vai enviar ${uniqueCount} texto(s) único(s) (${totalLines} linha(s) no total) pra Batch API da Anthropic — ` +
          `processamento assíncrono, mais barato, mas pode levar de minutos a até 24h pra ficar pronto. ` +
          `Volte aqui depois e use "Verificar lotes pendentes" pra buscar o resultado. Continuar?`
        )) return;

        const systemPrompt = buildLlmBatchSystemPrompt(properNouns);
        // auditoria #2 B4: mesma fonte de verdade do lote síncrono. Hoje dá
        // no mesmo pra Anthropic, mas eram dois lugares decidindo tamanho de
        // lote — e o dia em que um mudasse, o outro ficaria pra trás.
        const batchChunkSize = llmBatchSizeFor(settings);
        const chunks = [];
        for (let i = 0; i < orderedGroups.length; i += batchChunkSize) {
          chunks.push(orderedGroups.slice(i, i + batchChunkSize));
        }

        const requests = [];
        const chunkMeta = [];
        chunks.forEach((chunk, i) => {
          const customId = `chunk-${i}`;
          const protectedList = chunk.map((g) => protectCodes(g.original.replace(/\r\n|\r|\n/g, " ")));
          requests.push({
            custom_id: customId,
            params: {
              model: settings.llmModel || "claude-sonnet-5",
              max_tokens: Math.min(8192, 400 + chunk.length * 300),
              system: buildAnthropicSystemBlocks(systemPrompt),
              messages: [{ role: "user", content: JSON.stringify({ items: protectedList.map((p) => p.protectedText) }) }],
            },
          });
          chunkMeta.push({
            customId,
            groups: chunk.map((g, gi) => ({ original: g.original, members: g.members, codeTokens: protectedList[gi].tokens })),
          });
        });

        let res;
        try {
          res = await fetch("https://api.anthropic.com/v1/messages/batches", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": settings.llmApiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({ requests }),
          });
        } catch (e) {
          notify("Falha de rede ao enviar o lote pra Batch API: " + (e && e.message ? e.message : String(e)), "err");
          return;
        }
        if (!res.ok) {
          let detail = "";
          try { const errBody = await res.json(); detail = (errBody && errBody.error && errBody.error.message) || ""; } catch (e) {}
          notify(`Falha ao criar o lote na Batch API (HTTP ${res.status}). ${detail}`, "err");
          return;
        }
        const data = await res.json();
        const job = {
          id: data.id,
          createdAt: Date.now(),
          status: data.processing_status || "in_progress",
          itemCount: uniqueCount,
          lineCount: totalLines,
          chunkMeta,
        };
        const nextJobs = [...pendingBatchJobs, job];
        setPendingBatchJobs(nextJobs);
        storageSetAndForget("cs3_batch_jobs", JSON.stringify(nextJobs));
        notify(
          `Lote enviado! ID: ${data.id}\n\n` +
          `Isso é assíncrono — pode levar de minutos a até 24h. Feche a aba se quiser, o lote fica na fila do lado da Anthropic. ` +
          `Volte aqui e clique em "Verificar lotes pendentes" mais tarde pra buscar o resultado e aplicar as traduções.`
        , "info");
      };

      // Verifica todos os lotes pendentes da Batch API: os que já terminaram
      // têm o resultado baixado e aplicado nos arquivos (igual ao lote ao
      // vivo); os que ainda estão processando continuam na lista pra checar
      // de novo depois.
      const checkBatchApiJobs = async () => {
        if (pendingBatchJobs.length === 0) {
          notify("Não há lotes pendentes da Batch API.", "info");
          return;
        }
        if (!settings.llmApiKey || !settings.llmApiKey.trim()) {
          notify("Chave de API não configurada — adicione ela nas configurações do motor LLM pra poder verificar os lotes.", "info");
          return;
        }
        setCheckingBatchJobs(true);
        const authHeaders = {
          "x-api-key": settings.llmApiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        };
        const stillPending = [];
        let appliedTotal = 0;
        let finishedTotal = 0;
        for (const job of pendingBatchJobs) {
          try {
            const statusRes = await fetch(`https://api.anthropic.com/v1/messages/batches/${job.id}`, { headers: authHeaders });
            if (!statusRes.ok) { stillPending.push(job); continue; }
            const statusData = await statusRes.json();
            if (statusData.processing_status !== "ended") {
              stillPending.push({ ...job, status: statusData.processing_status });
              continue;
            }
            const resultsUrl = statusData.results_url;
            if (!resultsUrl) { stillPending.push(job); continue; }
            const resultsRes = await fetch(resultsUrl, { headers: authHeaders });
            const text = await resultsRes.text();
            const byCustomId = new Map();
            for (const line of text.split("\n")) {
              if (!line.trim()) continue;
              try {
                const row = JSON.parse(line);
                byCustomId.set(row.custom_id, row);
              } catch (e) {}
            }
            // Marca TODOS os grupos deste chunk como falha: original mantido
            // (nunca em branco) + flag pro QA cobrar revisão e reenvio.
            const markChunkFailed = (groups) => {
              for (const g of groups) {
                for (const m of g.members) {
                  updateDoc(m.docId, (d) => {
                    const next = {
                      ...d,
                      translations: { ...d.translations, [m.ref]: g.original },
                      autoTranslated: { ...d.autoTranslated, [m.ref]: false },
                      translationFailed: { ...d.translationFailed, [m.ref]: true },
                      coherenceReview: (() => { const c = { ...d.coherenceReview }; delete c[m.ref]; return c; })(),
                    };
                    scheduleSave(next);
                    return next;
                  });
                }
              }
            };

            for (const meta of job.chunkMeta) {
              const row = byCustomId.get(meta.customId);
              if (!row || !row.result || row.result.type !== "succeeded") { markChunkFailed(meta.groups); continue; }
              const msg = row.result.message;
              const rawText = msg && extractAnthropicText(msg.content);
              if (typeof rawText !== "string" || !rawText.trim()) { markChunkFailed(meta.groups); continue; }
              let translations;
              try { translations = parseBatchTranslationResponse(rawText, meta.groups.length); } catch (e) { markChunkFailed(meta.groups); continue; }
              meta.groups.forEach((g, i) => {
                const restored = restoreCodes(translations[i], g.codeTokens);
                const lineCount = g.original.split(/\r\n|\r|\n/).length;
                const finalText = lineCount > 1 ? wrapToLineCount(restored, lineCount) : restored;
                for (const m of g.members) {
                  updateDoc(m.docId, (d) => {
                    const translationFailed = { ...d.translationFailed };
                    delete translationFailed[m.ref];
                    const coherenceReview = { ...d.coherenceReview };
                    delete coherenceReview[m.ref];
                    const next = {
                      ...d,
                      translations: { ...d.translations, [m.ref]: finalText },
                      autoTranslated: { ...d.autoTranslated, [m.ref]: true },
                      translationFailed,
                      coherenceReview,
                    };
                    scheduleSave(next);
                    return next;
                  });
                }
                appliedTotal += g.members.length;
              });
            }
            finishedTotal += 1;
          } catch (e) {
            console.error("Falha ao checar lote da Batch API", job.id, e);
            stillPending.push(job);
          }
        }
        setPendingBatchJobs(stillPending);
        storageSetAndForget("cs3_batch_jobs", JSON.stringify(stillPending));
        setCheckingBatchJobs(false);
        notify(
          `Verificação concluída.\n${finishedTotal} lote(s) terminado(s), ${appliedTotal} linha(s) traduzida(s) aplicada(s).\n` +
          `${stillPending.length} lote(s) ainda pendente(s) (volte mais tarde pra checar de novo).`
        , "ok");
      };

      const cancelBatchTranslate = () => {
        cancelBatchRef.current = true;
      };

      // apaga a tradução de tudo que NÃO está verificado (verificados nunca
      // são tocados), pra depois rodar a tradução automática de novo só
      // nessas linhas.
      const clearNonVerified = () => {
        const targets = []; // {docId, ref}
        const collect = (doc, entries) => {
          for (const e of entries) {
            if (doc.ignored[e.ref]) continue;
            if (doc.verified[e.ref]) continue; // protegido, nunca apaga
            if (!(doc.translations[e.ref] || "").trim()) continue; // já vazio
            targets.push({ docId: doc.id, ref: e.ref });
          }
        };

        if (batchScope === "filter") {
          if (!activeDoc) return;
          collect(activeDoc, filtered);
        } else {
          const scopedDocs = batchScope === "all" ? docs : docs.filter((d) => d.id === activeId);
          for (const doc of scopedDocs) collect(doc, doc.entries);
        }

        if (targets.length === 0) {
          notify("Não há traduções não verificadas para limpar no escopo selecionado (o que já está verificado nunca é apagado).", "info");
          return;
        }

        const proceed = window.confirm(
          `Isso vai APAGAR a tradução de ${targets.length} linha(s) que ainda não foram verificadas — as que já estão verificadas ficam intactas.\n\n` +
          `Dá pra desfazer com Ctrl+Z logo em seguida, se precisar. Continuar?`
        );
        if (!proceed) return;

        pushUndoSnapshot(`Limpar ${targets.length} não verificado(s)`, [...new Set(targets.map((t) => t.docId))]);

        const perDoc = new Map();
        for (const t of targets) {
          if (!perDoc.has(t.docId)) perDoc.set(t.docId, []);
          perDoc.get(t.docId).push(t.ref);
        }
        for (const [docId, refs] of perDoc.entries()) {
          updateDoc(docId, (d) => {
            const translations = { ...d.translations };
            const autoTranslated = { ...d.autoTranslated };
            const translationFailed = { ...d.translationFailed };
            const coherenceReview = { ...d.coherenceReview };
            const fromMemory = { ...d.fromMemory };
            for (const ref of refs) {
              delete translations[ref];
              delete autoTranslated[ref];
              delete translationFailed[ref];
              delete coherenceReview[ref];
              delete fromMemory[ref];
            }
            const next = { ...d, translations, autoTranslated, translationFailed, coherenceReview, fromMemory };
            scheduleSave(next);
            return next;
          });
        }
      };

      // --- cálculos do arquivo ativo -------------------------------------------
      // Agora só existe um tipo de entrada na UI: tudo que veio do OP Code 39.
      // Não tem mais separação "diálogo" vs "texto/UI" — isso foi removido.
      // Quantas linhas PENDENTES têm o original já em português. Alimenta o
      // botão "Ignorar já em português" — que só aparece quando há o que
      // ignorar, pra não virar mais um botão morto na barra.
      const ptPendingCount = useMemo(() => {
        const scopedDocs = batchScope === "all" ? docs : docs.filter((d) => d.id === activeId);
        let n = 0;
        for (const doc of scopedDocs) {
          for (const e of doc.entries) {
            if (doc.ignored[e.ref]) continue;
            if ((doc.translations[e.ref] || "").trim()) continue;
            if (e.lang === "pt") n += 1;
          }
        }
        return n;
      }, [docs, activeId, batchScope]);

      const stats = useMemo(() => {
        if (!activeDoc) return { total: 0, done: 0, ignored: 0, pending: 0, en: 0, verified: 0 };
        let done = 0, ign = 0, en = 0, verifiedCount = 0;
        for (const e of activeDoc.entries) {
          if (e.lang === "en") en += 1;
          if (activeDoc.ignored[e.ref]) {
            ign += 1;
            continue;
          }
          const isDone = (activeDoc.translations[e.ref] || "").trim().length > 0;
          if (activeDoc.verified[e.ref]) {
            verifiedCount += 1;
          } else if (isDone) {
            done += 1; // traduzido mas ainda não verificado
          }
        }
        const pending = activeDoc.entries.length - done - ign - verifiedCount;
        return { total: activeDoc.entries.length, done, ignored: ign, pending, en, verified: verifiedCount };
      }, [activeDoc]);

      // igual ao "stats" acima, mas somando TODOS os arquivos abertos na
      // sessão — dá visão do progresso geral sem precisar abrir um por um.
      const globalStats = useMemo(() => {
        let total = 0, done = 0, ign = 0, verifiedCount = 0;
        for (const d of docs) {
          for (const e of d.entries) {
            total += 1;
            if (d.ignored[e.ref]) { ign += 1; continue; }
            const isDone = (d.translations[e.ref] || "").trim().length > 0;
            if (d.verified[e.ref]) verifiedCount += 1;
            else if (isDone) done += 1;
          }
        }
        const pending = total - done - ign - verifiedCount;
        return { total, done, ignored: ign, pending, verified: verifiedCount, files: docs.length };
      }, [docs]);

      // conta quantas vezes cada texto original aparece no total, somando
      // TODOS os arquivos carregados (não só o ativo) — usado só pelo filtro
      // "Repetidos 3x+ (não verif.)". Só calcula quando esse filtro está
      // realmente selecionado — antes rodava em TODOS os arquivos a cada
      // tecla digitada, não importa qual filtro estivesse ativo.
      const originalOccurrenceCounts = useMemo(() => {
        if (filter !== "dup-unverified") return null;
        const counts = {};
        for (const d of docs) {
          for (const e of d.entries) {
            if (d.ignored[e.ref]) continue;
            const key = memoryKey(e.original);
            counts[key] = (counts[key] || 0) + 1;
          }
        }
        return counts;
      }, [docs, filter]);

      const filtered = useMemo(() => {
        if (!deferredActiveDoc) return [];
        const q = search.trim().toLowerCase();
        return deferredActiveDoc.entries.filter((e) => entryMatchesFilter(deferredActiveDoc, e, filter, q, originalOccurrenceCounts));
      }, [deferredActiveDoc, filter, search, originalOccurrenceCounts]);

      // Escopo da busca: "file" (só o arquivo aberto, comportamento de
      // sempre) ou "project" (vasculha TODOS os arquivos carregados). Só
      // entra em ação quando tem texto digitado — senão não faz sentido
      // (a tela já mostra o arquivo ativo inteiro).
      const [projectSearch, setProjectSearch] = useState(false);
      const PROJECT_SEARCH_LIMIT = 300;
      const projectSearchResults = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!projectSearch || !q) return null;
        const results = [];
        let truncated = false;
        outer:
        for (const doc of deferredDocs) {
          for (const e of doc.entries) {
            if (!entryMatchesFilter(doc, e, filter, q, originalOccurrenceCounts)) continue;
            if (results.length >= PROJECT_SEARCH_LIMIT) { truncated = true; break outer; }
            results.push({ doc, entry: e });
          }
        }
        return { results, truncated };
      }, [projectSearch, deferredDocs, filter, search, originalOccurrenceCounts]);

      // Paginação dos resultados de busca no projeto inteiro (auditoria
      // 3.3) — antes renderizava até 300 cartões de uma vez só, sem
      // paginação nenhuma, inconsistente com o resto do app (que sempre
      // pagina a 20-100 itens).
      const [projectSearchPage, setProjectSearchPage] = useState(1);
      useEffect(() => {
        setProjectSearchPage(1);
      }, [filter, search, pageSize, projectSearch]);
      const projectSearchTotalPages = projectSearchResults
        ? Math.max(1, Math.ceil(projectSearchResults.results.length / pageSize))
        : 1;
      const projectSearchSafePage = Math.min(projectSearchPage, projectSearchTotalPages);
      const projectSearchVisible = projectSearchResults
        ? projectSearchResults.results.slice((projectSearchSafePage - 1) * pageSize, projectSearchSafePage * pageSize)
        : [];

      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      const safePage = Math.min(page, totalPages);
      const visible = filtered.slice((safePage - 1) * pageSize, safePage * pageSize);

      // se a lista encolher (ex: filtro mais restritivo, ou item marcado como
      // traduzido) e a página atual deixar de existir, volta pra última válida
      useEffect(() => {
        if (page > totalPages) setPage(totalPages);
      }, [totalPages, page]);

      // botão "próximo pendente": acha a primeira linha sem tradução (na
      // ordem do arquivo), troca o filtro pra "Pendentes" e pula direto pra
      // a página/cartão certo, sem precisar ficar rolando manualmente.
      const jumpToNextPending = () => {
        if (!activeDoc) return;
        const next = activeDoc.entries.find((e) => !activeDoc.ignored[e.ref] && !(activeDoc.translations[e.ref] || "").trim());
        if (!next) {
          notify("Nenhuma linha pendente neste arquivo. 🎉", "err");
          return;
        }
        setFilter("pending");
        setSearch("");
        setJumpTarget(next.ref);
      };

      // roda a checagem de qualidade sob demanda: 'file' só o arquivo aberto,
      // 'all' todos os arquivos carregados na sessão
      const runQaScan = (scope) => {
        const scopedDocs = scope === "all" ? docs : docs.filter((d) => d.id === activeId);
        const items = runQualityCheck(scopedDocs, properNouns);
        setQaResults({ scope, multiDoc: scope === "all", generatedAt: Date.now(), items });
        setActivePanel("qa");
      };

      // Ignora UM aviso específico (severidade "warning") de UMA linha —
      // nunca crítico, isso é travado tanto aqui (early return) quanto de
      // novo dentro de runQualityCheck, em dobro de propósito: um item
      // crítico é código de jogo ausente/alterado, ignorar isso poderia
      // deixar passar algo que quebra o jogo sem ninguém perceber.
      // Persiste em doc.qaIgnored (sobrevive a reload) e já atualiza a lista
      // visível na hora, sem esperar re-render assíncrono do estado de docs.
      const handleIgnoreQaIssue = useCallback((item, issue) => {
        if (issue.severity === "critical") return;
        updateDoc(item.docId, (d) => {
          const qaIgnored = { ...(d.qaIgnored || {}) };
          const forRef = { ...(qaIgnored[item.ref] || {}) };
          forRef[issue.type] = true;
          qaIgnored[item.ref] = forRef;
          const next = { ...d, qaIgnored };
          scheduleSave(next);
          return next;
        });
        setQaResults((prev) => {
          if (!prev) return prev;
          const items = prev.items
            .map((it) => {
              if (it.docId !== item.docId || it.ref !== item.ref) return it;
              const remaining = it.issues.filter((i) => i !== issue);
              return remaining.length > 0 ? { ...it, issues: remaining } : null;
            })
            .filter(Boolean);
          return { ...prev, items };
        });
      }, [updateDoc, scheduleSave]);

      // restaura (desfaz) todos os avisos ignorados nos arquivos do escopo
      // escolhido. Persiste via updateDoc (assíncrono) E recalcula o
      // resultado na hora contra uma cópia local já "limpa" — sem isso, o
      // scan reapareceria com os avisos ainda escondidos até o próximo
      // re-render, já que `docs` no React só reflete a mudança depois que o
      // handler termina de rodar.
      const clearQaIgnored = (scope) => {
        const scopedDocs = scope === "all" ? docs : docs.filter((d) => d.id === activeId);
        const hasAny = scopedDocs.some((d) => d.qaIgnored && Object.values(d.qaIgnored).some((forRef) => Object.keys(forRef).length > 0));
        if (!hasAny) {
          notify("Não há avisos ignorados pra restaurar neste escopo.", "info");
          return;
        }
        for (const d of scopedDocs) {
          updateDoc(d.id, (doc) => {
            const next = { ...doc, qaIgnored: {} };
            scheduleSave(next);
            return next;
          });
        }
        const clearedDocs = scopedDocs.map((d) => ({ ...d, qaIgnored: {} }));
        const items = runQualityCheck(clearedDocs, properNouns);
        setQaResults({ scope, multiDoc: scope === "all", generatedAt: Date.now(), items });
        setActivePanel("qa");
      };

      // troca de arquivo se precisar, ajusta filtro/busca pra não esconder a
      // linha, e rola até o cartão certo — mesmo mecanismo do "próximo pendente"
      const jumpToQaItem = (item) => {
        setActivePanel(null);
        if (item.docId !== activeId) setActiveId(item.docId);
        setFilter("all");
        setSearch("");
        setJumpTarget(item.ref);
      };

      // Aprova em lote todas as linhas JÁ TRADUZIDAS do arquivo atual que
      // ainda não estão verificadas — mesmo efeito de clicar "aprovar" em
      // cada cartão, um por um, só que de uma vez. Duas proteções contra
      // aprovar algo ruim sem querer:
      //  1) linha vazia (sem tradução ainda) não entra — não tem o que
      //     aprovar.
      //  2) linha com problema CRÍTICO de QA (código do jogo ausente ou
      //     alterado) fica de fora, sempre — aprovar isso alimentaria a
      //     memória de tradução com um erro que quebra o jogo, e esse erro
      //     se propagaria pra toda linha duplicada/parecida que reusar a
      //     memória depois. Mesma trava que já existe na exportação
      //     bloqueante e no "ignorar" de QA (nunca vale pra crítico).
      // Cada linha aprovada alimenta a memória de tradução (learnTranslation),
      // igual já acontece ao aprovar uma linha manualmente — e a ação inteira
      // vira UM passo só no "Desfazer".
      const approveAllInFile = (docId) => {
        const doc = docsRef.current.find((d) => d.id === docId);
        if (!doc) return;

        const { toApprove, skippedCritical, alreadyVerified, stillEmpty } = selectBulkApprovableEntries(doc, properNouns);

        if (toApprove.length === 0) {
          notify(
            skippedCritical > 0
              ? `Nenhuma linha pôde ser aprovada: ${skippedCritical} têm código do jogo ausente/alterado (crítico) — corrija antes de aprovar.`
              : alreadyVerified > 0 && stillEmpty === 0
              ? "Todas as linhas traduzidas deste arquivo já estão aprovadas."
              : "Não há linhas traduzidas pendentes de aprovação neste arquivo."
          , "err");
          return;
        }

        const proceed = window.confirm(
          `Aprovar ${toApprove.length} linha(s) traduzida(s) de "${doc.fileName}" de uma vez?\n\n` +
          (skippedCritical > 0 ? `${skippedCritical} linha(s) ficam de fora por ter código do jogo ausente/alterado (crítico) — aprove essas manualmente depois de corrigir.\n\n` : "") +
          `Isso marca como "verificado" e alimenta a memória de tradução com essas linhas. Dá pra desfazer com o botão "Desfazer".`
        );
        if (!proceed) return;

        pushUndoSnapshot(`Aprovar em lote (${toApprove.length})`, [docId]);

        updateDoc(docId, (d) => {
          const verified = { ...d.verified };
          for (const item of toApprove) verified[item.ref] = true;
          const next = { ...d, verified };
          scheduleSave(next);
          return next;
        });

        for (const item of toApprove) {
          learnTranslation(item.original, item.text);
        }

        notify(
          `${toApprove.length} linha(s) aprovada(s).` +
          (skippedCritical > 0 ? ` ${skippedCritical} ficaram de fora (código crítico ausente/alterado).` : "")
        , "info");
      };

      // corrige de uma vez todos os avisos de "contagem de linha diferente"
      // do resultado de QA atual, reaproveitando o wrapToLineCount que já
      // existe no botão "ajustar linhas" de cada cartão — só que em massa
      const bulkFixLineMismatches = () => {
        if (!qaResults) return;
        const targets = qaResults.items.filter((it) => it.issues.some((i) => i.type === "line-mismatch"));
        if (targets.length === 0) {
          notify("Nenhum problema de contagem de linha pra corrigir no resultado atual.", "err");
          return;
        }
        if (!window.confirm(`Isso vai reformatar automaticamente ${targets.length} tradução(ões) pra bater com o número de linhas do original. Continuar?`)) return;

        pushUndoSnapshot(`Ajuste em massa de linhas (${targets.length})`, [...new Set(targets.map((t) => t.docId))]);
        for (const item of targets) {
          const doc = docsRef.current.find((d) => d.id === item.docId);
          const entry = doc && doc.entries.find((e) => e.ref === item.ref);
          if (!doc || !entry) continue;
          const wrapped = wrapToLineCount(doc.translations[item.ref] || "", entry.lineCount);
          setTranslation(item.docId, item.ref, wrapped);
        }
        // reflete a correção na lista de QA na hora, sem precisar reabrir
        runQaScan(qaResults.scope);
      };

      // Reinsere os códigos do jogo que sumiram de UMA tradução. Só age se
      // repairMissingCodes conseguir devolver todos com segurança — se
      // sobrar código no meio da fala, ele recusa e a gente avisa em vez de
      // "corrigir" errado.
      // Lê o estado ATUAL do documento em vez do snapshot do scan de QA
      // (auditoria #2 B1) — é o que mantém o botão coerente com a realidade
      // depois de uma edição manual.
      const canRepairQaItem = (item) => {
        const doc = docsRef.current.find((d) => d.id === item.docId);
        const entry = doc && doc.entries.find((e) => e.ref === item.ref);
        if (!doc || !entry) return false;
        return canRepairMissingCodes(entry.original, doc.translations[item.ref] || "");
      };

      const repairQaItemCodes = (item) => {
        const doc = docsRef.current.find((d) => d.id === item.docId);
        const entry = doc && doc.entries.find((e) => e.ref === item.ref);
        if (!doc || !entry) return;
        const current = doc.translations[item.ref] || "";
        const result = repairMissingCodes(entry.original, current);
        if (!result.fixed || !result.changed) {
          notify(
            "Não dá pra reinserir com segurança nesta linha: " +
            (result.unfixable.length > 0 ? `${result.unfixable.join(" ")} ` : "") +
            "aparece(m) no meio da fala, e não dá pra saber em que ponto do texto traduzido o código deveria entrar. " +
            "Melhor apagar a tradução e traduzir de novo."
          , "info");
          return;
        }
        pushUndoSnapshot(`Reinserir código do jogo (${item.ref})`, [item.docId]);
        setTranslation(item.docId, item.ref, result.text, { keepVerified: true });
        runQaScan(qaResults ? qaResults.scope : "file");
      };

      // Apaga a tradução de UMA linha: ela volta pro estado "pendente" e
      // entra de novo no próximo lote de tradução automática.
      const clearQaItemTranslation = (item) => {
        const doc = docsRef.current.find((d) => d.id === item.docId);
        if (!doc) return;
        if (!window.confirm(
          `Apagar a tradução da linha ${item.ref}? Ela volta a ficar pendente e entra de novo no próximo lote de tradução automática.`
        )) return;
        pushUndoSnapshot(`Apagar tradução (${item.ref})`, [item.docId]);
        setTranslation(item.docId, item.ref, "");
        runQaScan(qaResults ? qaResults.scope : "file");
      };

      // Recalcula os issues de UMA linha do painel de QA, lendo o estado
      // MAIS RECENTE do documento (docsRef.current, não `docs` — o `docs`
      // do fechamento deste render ainda estaria com o valor de ANTES da
      // edição, já que setTranslation/updateDoc usam a forma funcional do
      // setState, que não muda a variável já capturada nesta função). Só
      // atualiza o item TOCADO, em vez de rodar runQaScan (que varre todo o
      // escopo de novo) — corrigir uma linha não deveria refazer o scan
      // inteiro.
      const patchQaItemFromLiveDoc = (docId, ref) => {
        const doc = docsRef.current.find((d) => d.id === docId);
        if (!doc) return;
        const entry = doc.entries.find((e) => e.ref === ref);
        if (!entry) return;
        const translation = doc.translations[ref];
        setQaResults((prev) => {
          if (!prev) return prev;
          const semTraducao = !translation || !translation.trim();
          if (semTraducao) {
            // linha ficou vazia: não há mais nada a checar, some da lista
            return { ...prev, items: prev.items.filter((it) => !(it.docId === docId && it.ref === ref)) };
          }
          let issues = checkEntryIssues(entry, translation, properNouns);
          if (doc.translationFailed && doc.translationFailed[ref]) {
            issues = [makeTranslationFailedIssue(), ...issues];
          }
          // Edição manual já limpa doc.coherenceReview[ref] dentro de
          // setTranslation (a nota antiga era sobre um texto que não existe
          // mais) — então normalmente não sobra revisão de coerência velha
          // aqui. Reflete mesmo assim, por robustez caso essa regra mude.
          const review = doc.coherenceReview && doc.coherenceReview[ref];
          if (review) {
            const coherenceIssue = makeCoherenceIssue(review);
            if (coherenceIssue) issues = [coherenceIssue, ...issues];
          }
          if (doc.verified[ref]) issues = issues.filter((iss) => iss.severity === "critical");
          const ignoredForRef = (doc.qaIgnored || {})[ref];
          if (ignoredForRef) issues = issues.filter((iss) => iss.severity === "critical" || !ignoredForRef[iss.type]);

          if (issues.length === 0) {
            // corrigido de vez: some da lista de problemas
            return { ...prev, items: prev.items.filter((it) => !(it.docId === docId && it.ref === ref)) };
          }
          const items = prev.items.map((it) =>
            it.docId === docId && it.ref === ref ? { ...it, translation, verified: !!doc.verified[ref], issues } : it
          );
          return { ...prev, items };
        });
      };

      // Edição inline no painel de QA (pedido do usuário: "deixe corrigir o
      // erro ali no QA mesmo"). Reaproveita handleTranslationBlur (mesma
      // checagem de duplicatas que o cartão normal já faz ao sair do
      // campo), e na sequência atualiza só o item tocado na lista de QA —
      // pra quem acabou de corrigir ver o problema sumir (ou a nota mudar)
      // sem precisar clicar em "Verificar" de novo.
      const qaTranslationBlur = (docId, ref) => {
        handleTranslationBlur(docId, ref);
        patchQaItemFromLiveDoc(docId, ref);
      };

      // Apaga de uma vez as traduções que NÃO estão em português — seja
      // inglês que passou sem traduzir, seja o modelo tendo respondido em
      // chinês/russo. Elas voltam pro estado pendente e entram de novo no
      // próximo lote, que é o conserto real: não adianta editar à mão uma
      // linha que o tradutor devolveu no idioma errado.
      const clearWrongLanguage = () => {
        if (!qaResults) return;
        const targets = qaResults.items.filter((it) =>
          it.issues.some((i) => i.type === "wrong-language")
        );
        if (targets.length === 0) {
          notify("Nenhuma tradução fora do português no resultado atual.", "info");
          return;
        }
        const verificadas = targets.filter((it) => {
          const doc = docsRef.current.find((d) => d.id === it.docId);
          return doc && doc.verified[it.ref];
        }).length;

        if (!window.confirm(
          `Apagar a tradução de ${targets.length} linha(s) que não estão em português?\n\n` +
          "Inclui tanto linha que ficou em inglês quanto resposta em outro idioma (chinês, russo...). " +
          "Todas voltam a ficar pendentes e entram de novo no próximo lote de tradução automática." +
          (verificadas > 0
            ? `\n\nATENÇÃO: ${verificadas} dela(s) está(ão) marcada(s) como VERIFICADA — se você aprovou de propósito (ex.: nome próprio que fica igual em inglês), cancele e use "ignorar" no aviso em vez disso.`
            : "")
        )) return;

        pushUndoSnapshot(`Apagar traduções fora do português (${targets.length})`, [...new Set(targets.map((t) => t.docId))]);
        let done = 0;
        for (const item of targets) {
          const doc = docsRef.current.find((d) => d.id === item.docId);
          if (!doc) continue;
          setTranslation(item.docId, item.ref, "");
          done += 1;
        }
        runQaScan(qaResults.scope);
        notify(`${done} tradução(ões) apagada(s) — já podem ser traduzidas de novo.`, "ok");
      };

      // Apaga a tradução de TODA linha com problema crítico — marcador de
      // proteção vazado, código de jogo inventado, código ausente, tradução
      // em outro idioma. Elas voltam pro estado pendente e entram de novo no
      // próximo lote.
      //
      // Por que apagar em vez de corrigir: essas linhas são resposta
      // Baixa o log de diagnóstico do QA (.json) pra colar numa IA. Ver o
      // comentário de buildQaDiagnostic sobre por que é amostra + contagem
      // em vez de despejo, e por que o ambiente vai junto.
      const exportQaDiagnostic = () => {
        if (!qaResults) {
          notify("Rode a verificação de qualidade antes de exportar o diagnóstico.", "info");
          return;
        }
        const scopedDocs = qaResults.scope === "all"
          ? docsRef.current
          : docsRef.current.filter((d) => d.id === activeId);
        const relatorio = buildQaDiagnostic(qaResults, settings, {
          totalArquivos: scopedDocs.length,
          totalLinhas: scopedDocs.reduce((n, d) => n + d.entries.length, 0),
          totalGlossario: properNouns.length,
        });

        const blob = new Blob([JSON.stringify(relatorio, null, 2)], { type: "application/json" });
        const nome = `diagnostico-qa-${safeForFilename(activeProject || "projeto")}-${tmxTimestamp()}.json`;
        saveBlobToDisk(blob, nome, "Log de diagnóstico do QA", "application/json", [".json"]);

        const tipos = Object.keys(relatorio.contagens.porTipo).length;
        notify(
          `Diagnóstico gerado: ${relatorio.contagens.linhasComProblema} linha(s), ${tipos} tipo(s) de problema. ` +
          "A chave de API não foi incluída — pode compartilhar o arquivo.",
          "ok"
        );
      };

      // corrompida do modelo, não tradução com um detalhe errado. Editar à
      // mão um texto que veio com marcador quebrado e código inventado dá
      // mais trabalho do que deixar o modelo tentar de novo — ainda mais
      // agora que a resposta passa por validação antes de ser gravada, o
      // que torna a repetição bem mais confiável do que foi da primeira vez.
      const clearCriticalIssues = () => {
        if (!qaResults) return;
        const targets = qaResults.items.filter((it) => it.issues.some((i) => i.severity === "critical"));
        if (targets.length === 0) {
          notify("Nenhum problema crítico no resultado atual.", "info");
          return;
        }

        // Alguns críticos de código ausente dá pra CONSERTAR sem perder a
        // tradução — seria desperdício apagar uma tradução boa só porque um
        // código caiu da ponta. Conta quantos são pra avisar antes.
        const reparaveis = targets.filter((it) => {
          const soFaltaCodigo = it.issues
            .filter((i) => i.severity === "critical")
            .every((i) => i.type === "missing-code");
          return soFaltaCodigo && canRepairQaItem(it);
        }).length;

        const porTipo = new Map();
        for (const it of targets) {
          for (const i of it.issues) {
            if (i.severity !== "critical") continue;
            porTipo.set(i.type, (porTipo.get(i.type) || 0) + 1);
          }
        }
        const ROTULOS = {
          "missing-code": "código do jogo ausente",
          "invented-code": "código inventado pelo modelo",
          "leaked-marker": "marcador de proteção vazado",
          "wrong-language": "tradução em outro idioma",
          "translation-failed": "motor de tradução falhou (original mantido)",
          "coherence-low": "coerência baixa (nota do revisor de IA)",
        };
        const resumo = [...porTipo.entries()]
          .map(([tipo, n]) => `  • ${n}x ${ROTULOS[tipo] || tipo}`)
          .join("\n");

        if (!window.confirm(
          `Apagar a tradução de ${targets.length} linha(s) com problema crítico?\n\n${resumo}\n\n` +
          "Elas voltam a ficar pendentes e entram de novo no próximo lote de tradução automática." +
          (reparaveis > 0
            ? `\n\nATENÇÃO: ${reparaveis} dela(s) só está(ão) com código faltando na ponta e pode(m) ser CONSERTADA(S) sem perder a tradução — cancele e use "Reinserir códigos ausentes" primeiro, depois volte aqui pro que sobrar.`
            : "")
        )) return;

        pushUndoSnapshot(`Apagar críticos (${targets.length})`, [...new Set(targets.map((t) => t.docId))]);
        let done = 0;
        for (const item of targets) {
          const doc = docsRef.current.find((d) => d.id === item.docId);
          if (!doc) continue;
          setTranslation(item.docId, item.ref, "");
          done += 1;
        }
        runQaScan(qaResults.scope);
        notify(`${done} linha(s) apagada(s) — já entram no próximo lote de tradução.`, "ok");
      };

      // Marca como IGNORADAS todas as linhas cujo ORIGINAL já está em
      // português. O lote automático já pulava essas linhas, mas elas
      // continuavam contando como "pendente" nas estatísticas e aparecendo
