      if (!res.ok) {
        let detail = "";
        try { const errBody = await res.json(); detail = (errBody && errBody.error && errBody.error.message) || ""; } catch (e) {}
        const err = new Error(
          res.status === 401
            ? "chave de API da OpenAI inválida ou não autorizada"
            : res.status === 429
            ? "limite de requisições/cota da OpenAI atingido"
            : `OpenAI HTTP ${res.status}${detail ? ": " + detail.slice(0, 150) : ""}`
        );
        err.status = res.status;
        err.retryable = res.status === 429 || res.status >= 500;
        err.retryAfterMs = parseRetryAfterMs(res);
        throw err;
      }
      const data = await res.json();
      const raw = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (typeof raw !== "string" || !raw.trim()) throw new Error("resposta vazia/inválida da OpenAI");
      return parseCoherenceReviewResponse(raw, pairs.length);
    }

    async function reviewCoherenceViaOllamaNative(pairs, settings, systemPrompt) {
      // Corrigido (era o bug relatado "resposta do revisor não é um JSON
      // válido"): agora usa a MESMA trava de formato que translateBatchViaOllamaNative
      // usa pra tradução — json schema forçado pela própria API do Ollama
      // (format: ollamaReviewSchema) + prefill (OLLAMA_REVIEWS_JSON_PREFILL),
      // em vez de só pedir JSON por instrução em texto. `kind: "reviews"`
      // é o que faz buildOllamaNativeBody/callOllamaNative escolherem o
      // schema/prefill de REVISÃO em vez do de TRADUÇÃO (ver comentário em
      // ollamaReviewSchema).
      const raw = await callOllamaNative(
        settings,
        systemPrompt,
        buildCoherenceReviewUserContent(pairs),
        Math.min(4096, 150 + pairs.length * 80),
        true,
        pairs.length, // alimenta o minItems/maxItems do schema
        "reviews"
      );
      return parseCoherenceReviewResponse(raw, pairs.length);
    }

    async function reviewCoherenceViaGoogle(pairs, settings, systemPrompt) {
      const model = settings.llmModel || "gemini-2.5-flash";
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
      let res;
      try {
        res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": settings.llmApiKey,
          },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: [{ parts: [{ text: buildCoherenceReviewUserContent(pairs) }] }],
            safetySettings: GOOGLE_SAFETY_SETTINGS,
            generationConfig: {
              temperature: 0,
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  reviews: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        id: { type: "INTEGER" },
                        nota: { type: "INTEGER" },
                        explicacao: { type: "STRING" },
                      },
                      required: ["id", "nota", "explicacao"],
                    },
                  },
                },
                required: ["reviews"],
              },
              maxOutputTokens: Math.min(4096, 150 + pairs.length * 80),
              ...googleThinkingConfig(model),
            },
          }),
        });
      } catch (e) {
        throw new Error("falha de rede ao chamar a API do Google AI Studio (verifique sua internet)");
      }
      if (!res.ok) {
        let detail = "";
        let errBody = null;
        try { errBody = await res.json(); detail = (errBody && errBody.error && errBody.error.message) || ""; } catch (e) {}
        const quotaInfo = res.status === 429 ? parseGoogleQuotaError(errBody) : { retryAfterMs: null, isDailyQuota: false };
        const err = new Error(
          res.status === 400 || res.status === 403
            ? "chave de API do Google AI Studio inválida ou não autorizada"
            : res.status === 429
            ? (quotaInfo.isDailyQuota
                ? "cota DIÁRIA do Google AI Studio esgotada para este modelo — só libera de novo à meia-noite (horário do Pacífico/EUA)."
                : `limite de requisições/cota do Google AI Studio atingido${quotaInfo.retryAfterMs ? ` — aguardando ~${Math.ceil(quotaInfo.retryAfterMs / 1000)}s antes de tentar de novo` : ""}`)
            : `Google AI Studio HTTP ${res.status}${detail ? ": " + detail.slice(0, 150) : ""}`
        );
        err.status = res.status;
        err.retryable = (res.status === 429 && !quotaInfo.isDailyQuota) || res.status >= 500;
        err.retryAfterMs = quotaInfo.retryAfterMs || parseRetryAfterMs(res);
        throw err;
      }
      const data = await res.json();
      const parts = data && Array.isArray(data.candidates) && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
      const raw = Array.isArray(parts) ? parts.map((p) => p && p.text).filter((t) => typeof t === "string").join("") : "";
      if (!raw.trim()) throw new Error("resposta vazia/inválida do Google AI Studio");
      return parseCoherenceReviewResponse(raw, pairs.length);
    }

    // Dispatcher — mesmo padrão de translateBatchViaLLM: escolhe o
    // provedor pelo settings já configurado nas Configurações, sem pedir
    // nada extra ao usuário (o revisor usa o MESMO motor da tradução, por
    // decisão explícita do usuário).
    async function reviewCoherenceBatchViaLLM(settings, pairs) {
      if (!settings.llmApiKey || !settings.llmApiKey.trim()) {
        throw new Error("chave de API não configurada — adicione ela nas configurações do motor LLM");
      }
      const systemPrompt = buildCoherenceReviewSystemPrompt();
      return isOllamaNativeEnabled(settings)
        ? await reviewCoherenceViaOllamaNative(pairs, settings, systemPrompt)
        : settings.llmProvider === "openai"
        ? await reviewCoherenceViaOpenAI(pairs, settings, systemPrompt)
        : settings.llmProvider === "google"
        ? await reviewCoherenceViaGoogle(pairs, settings, systemPrompt)
        : await reviewCoherenceViaAnthropic(pairs, settings, systemPrompt);
    }

    // Mesmo backoff de translateText (item a item), mas pro lote inteiro: se o
    // lote falhar por rate limit (429) ou erro passageiro do servidor (5xx),
    // espera e tenta o MESMO lote de novo antes de desistir e cair pro
    // fallback item a item (ver runBatchTranslate).
    async function translateBatchWithRetry(originals, settings, properNouns, translationMemory, retries = 2, shardHint) {
      let lastErr;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          // shardHint constante entre as tentativas: é o que faz a
          // retentativa reaproveitar o prefixo já quente (auditoria #2 B5).
          // Já o retryAttempt MUDA de propósito — é o que impede a segunda
          // tentativa de ser uma cópia exata da primeira (ver retryAttemptOf).
          return await translateBatchViaLLM(
            attempt === 0 ? settings : { ...settings, retryAttempt: attempt },
            originals, properNouns, translationMemory, shardHint
          );
        } catch (e) {
          lastErr = e;
          // auditoria 1.1: erro EXPLICITAMENTE marcado como não-recuperável
          // (chave inválida, cota diária esgotada etc.) não se resolve
          // tentando de novo — falha rápido em vez de gastar 2-3 tentativas
          // inúteis (e mais tempo até o usuário ver o erro de verdade).
          // `retryable === false` é distinto de `undefined` (que continua
          // usando o backoff genérico de antes).
          if (e && e.retryable === false) throw e;
          if (attempt < retries) {
            const delay = e && e.retryable ? computeBackoffDelay(attempt, e.retryAfterMs) : 700 * (attempt + 1);
            await sleep(delay);
          }
        }
      }
      throw lastErr;
    }

    // Auditoria #2 M3: freio de rate limit COMPARTILHADO entre os workers.
    // Antes cada worker tratava o próprio 429 isoladamente — quando a cota
    // estourava, todos batiam no limite quase juntos e os que ainda não
    // tinham batido continuavam disparando durante a espera dos outros.
    // Com a concorrência da OpenAI em 4, isso virou um thundering herd em
    // miniatura. Agora o primeiro 429 fecha o portão pra todo mundo.
    function createRateLimitGate() {
      return { until: 0 };
    }

    function noteRateLimited(gate, retryAfterMs) {
      if (!gate) return;
      const wait = Math.min(typeof retryAfterMs === "number" && retryAfterMs > 0 ? retryAfterMs : 5000, 65000);
      gate.until = Math.max(gate.until, Date.now() + wait);
    }

    async function waitForRateLimitGate(gate) {
      if (!gate) return;
      const delta = gate.until - Date.now();
      // O jitter é o detalhe que importa: sem ele os workers acordam todos
      // no mesmo milissegundo e recriam o pico que acabou de ser punido.
      if (delta > 0) await sleep(delta + Math.floor(Math.random() * 400));
    }

    // Tamanho/ritmo do lote LLM — calibrado pra caber numa resposta só sem
    // estourar o limite de tokens e pra não disparar tudo de uma vez.
    const LLM_BATCH_SIZE = 20;

    // Endpoint compatível com OpenAI apontando pra um servidor LOCAL
    // (Ollama/LM Studio/vLLM). Muda bastante a calibragem: não há cota de
    // rede pra respeitar, mas também não há paralelismo real — a GPU/CPU
    // processa uma requisição de cada vez.
    function isLocalOpenAiEndpoint(settings) {
      return !!(settings && settings.llmProvider === "openai" && settings.openaiBaseUrl && settings.openaiBaseUrl.trim());
    }

    // Lote maior = menos requisições = menos overhead de rede e mais reuso do
    // prompt de sistema em cache. Mas lote grande também significa que uma
    // falha isolada joga MAIS itens no fallback item-a-item, e que a resposta
    // precisa caber no teto de tokens. 30 é o meio-termo pra API oficial da
    // OpenAI (respostas rápidas, JSON travado por schema estrito). Servidor
    // local fica menor: modelo pequeno rodando em hardware doméstico erra
    // mais o formato quando o lote cresce demais.
    function llmBatchSizeFor(settings) {
      if (!settings || settings.engine !== "llm") return LLM_BATCH_SIZE;
      if (isLocalOpenAiEndpoint(settings)) {
        return Math.max(1, Math.min(50, Number(settings.openaiLocalBatchSize) || 10));
      }
      if (settings.llmProvider === "openai") return 30;
      return LLM_BATCH_SIZE;
    }

    // Anthropic/OpenAI (tier pago) aguentam bem 2 requisições em paralelo com
    // pouco espaçamento. O Google AI Studio, principalmente no tier
    // GRATUITO, tem um limite de requisições por MINUTO (RPM) bem mais baixo
    // — 2 workers disparando a cada ~200-250ms estoura essa cota em segundos
    // e cai direto no erro "limite de requisições/cota atingido". Por isso
    // "google" usa 1 requisição de cada vez, bem mais espaçada: quem estiver
    // num tier pago mais alto perde um pouco de velocidade aqui, mas ninguém
    // fica travando em erro de cota no caminho comum (tier gratuito).
    // `settings` (não só o nome do provedor) porque a calibragem certa
    // depende TAMBÉM de pra onde a requisição vai: a mesma opção "openai"
    // pode ser a API oficial (rede, paralelizável) ou um servidor local
    // (hardware próprio, serial).
    function llmPacingFor(settingsOrProvider) {
      const settings = typeof settingsOrProvider === "string"
        ? { llmProvider: settingsOrProvider }
        : (settingsOrProvider || {});
      const provider = settings.llmProvider;

      if (provider === "google") {
        return { concurrency: 1, staggerMs: 0, paceMs: 1200, itemPaceMs: 1200 };
      }

      // Servidor local: paralelizar não acelera nada (a fila é a mesma
      // GPU/CPU) e ainda piora — várias requisições concorrentes disputam
      // memória e podem estourar o contexto ou derrubar o servidor. Uma de
      // cada vez, sem pausa artificial (não há cota externa a respeitar).
      if (isLocalOpenAiEndpoint(settings)) {
        // 1 era um padrão seguro, mas conservador demais pra quem subiu o
        // Ollama com OLLAMA_NUM_PARALLEL > 1: nesse caso ele processa vários
        // pedidos no mesmo lote de inferência e o ganho de throughput é
        // real. Quem não configurou nada continua em 1, que é o certo — aí
        // paralelizar só faz as requisições brigarem pela mesma fila.
        const n = Math.max(1, Math.min(8, Number(settings.openaiLocalConcurrency) || 1));
        return { concurrency: n, staggerMs: n > 1 ? 80 : 0, paceMs: 0, itemPaceMs: 0 };
      }

      // API oficial da OpenAI: os limites de requisição por minuto são bem
      // folgados já no tier pago inicial, e cada lote aqui carrega 30 linhas
      // — 4 requisições simultâneas aproveitam muito melhor o tempo de ida e
      // volta da rede sem chegar perto da cota. Se ainda assim bater 429, o
      // backoff exponencial (computeBackoffDelay) já segura a onda sozinho.
      if (provider === "openai") {
        return { concurrency: 4, staggerMs: 150, paceMs: 120, itemPaceMs: 150 };
      }

      return { concurrency: 2, staggerMs: 200, paceMs: 250, itemPaceMs: 200 };
    }

    // ---------------------------------------------------------------------------
    // Nomes próprios protegidos (personagens, lugares etc.) — igual aos
    // códigos do jogo, esses termos nunca vão pro tradutor. Se tiver uma
    // tradução fixa definida, ela é usada no lugar; senão, o termo original
    // é mantido do jeito que está.
    // ---------------------------------------------------------------------------
    // Protege nomes próprios ANTES de mandar pro tradutor (em vez de tentar
    // substituir DEPOIS, procurando o termo em inglês dentro do resultado já
    // em português). Proteger antes é mais confiável: garante que o nome
    // nunca é exposto ao modelo de tradução, então não tem como ele mudar a
    // grafia, "traduzir" o nome por engano (ex: "Ash" virar "cinza") ou
    // reordenar a frase de um jeito que o termo em inglês some do resultado.
    // Substituir depois só funciona quando o tradutor por acaso deixa o nome
    // intacto — sem garantia, e falha calada (sem aviso) quando não funciona.
    function protectProperNouns(text, properNouns) {
      if (!properNouns || properNouns.length === 0) return { text, tokens: [] };
      const sorted = [...properNouns].filter((p) => p.term && p.term.trim()).sort((a, b) => b.term.length - a.term.length);
      if (sorted.length === 0) return { text, tokens: [] };

      // acha todas as ocorrências primeiro (termo mais longo tem prioridade,
      // sem sobrepor), só depois substitui de uma vez com espaçamento seguro
      // — mesmo princípio usado pra proteger os códigos do jogo: um marcador
      // colado sem espaço numa palavra ou pontuação vizinha (ex: "Rean's",
      // "Rean,") pode ser engolido/embaralhado pelo tradutor automático.
      const matches = [];
      for (const pn of sorted) {
        const escaped = pn.term.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`\\b${escaped}\\b`, "gi");
        let m;
        while ((m = re.exec(text)) !== null) {
          const start = m.index;
          const end = start + m[0].length;
          const overlaps = matches.some((x) => start < x.end && end > x.start);
          if (!overlaps) {
            matches.push({ start, end, replacement: pn.translation && pn.translation.trim() ? pn.translation.trim() : m[0] });
          }
          if (m[0].length === 0) re.lastIndex += 1;
        }
      }
      if (matches.length === 0) return { text, tokens: [] };
      matches.sort((a, b) => a.start - b.start);

      let result = "";
      let cursor = 0;
      const tokens = [];
      for (const mtch of matches) {
        result += text.slice(cursor, mtch.start);
        const idx = tokens.length;
        // glueBefore/glueAfter: true quando o termo está colado ao texto
        // vizinho no ORIGINAL (sem espaço) — mesmo mecanismo do protectCodes/
        // restoreCodes (ver comentário lá): o espaço aqui embaixo é só pra
        // ajudar o tradutor estatístico a não engolir o marcador junto da
        // palavra/pontuação vizinha (ex: "Rean's", "Rean,"); sem isso a
        // tradução final voltava com espaço extra ("Rean 's" em vez de
        // "Rean's") que restoreProperNouns não desfazia.
        const glueBefore = result.length > 0 && !/\s$/.test(result);
        result += (glueBefore ? " " : "") + `¤${idx}¤`;
        const nextChar = text[mtch.end];
        const glueAfter = !!nextChar && !/\s/.test(nextChar);
        if (glueAfter) result += " ";
        tokens.push({ text: mtch.replacement, glueBefore, glueAfter });
        cursor = mtch.end;
      }
      result += text.slice(cursor);
      return { text: result, tokens };
    }

    // Aceita tokens no formato antigo (string pura) como fallback, mesmo
    // raciocínio do restoreCodes: não quebra nada que já esteja em voo.
    function restoreProperNouns(text, tokens) {
      return text.replace(/(\s*)¤\s*(\d+)\s*¤(\s*)/g, (m, before, idx, after) => {
        const tok = tokens[Number(idx)];
        if (tok === undefined) return m;
        if (typeof tok === "string") return `${before}${tok}${after}`;
        const keepBefore = tok.glueBefore ? "" : before;
        const keepAfter = tok.glueAfter ? "" : after;
        return `${keepBefore}${tok.text}${keepAfter}`;
      });
    }

    // ---------------------------------------------------------------------------
    // Verificação de qualidade (QA) — roda sob demanda (aba "Verificar
    // qualidade") e também antes de qualquer exportação de arquivo traduzido.
    // Não bloqueia nada sozinha, só lista os problemas pra revisão humana:
    //   - "critical": código do jogo ausente/alterado — isso PODE QUEBRAR o
    //     jogo (crash, texto cortado, retrato errado etc.)
    //   - "warning": não quebra o jogo, mas indica que a linha provavelmente
    //     precisa de outra revisão (contagem de linha diferente do original,
    //     texto ainda parece inglês, ou termo do glossário sem a tradução
    //     fixa cadastrada aplicada)
    // ---------------------------------------------------------------------------

    // termo do glossário (nome próprio, habilidade, item etc.) que aparece
    // no original mas cuja tradução fixa cadastrada não aparece na tradução
    // final — nem o termo original foi deixado como estava. Pega
    // inconsistência de terminologia digitada manualmente (a tradução
    // automática já é forçada a usar o termo certo via protectProperNouns).
    // Cache dos regex compilados do glossário, por REFERÊNCIA do array
    // `properNouns` (auditoria 3.2): checkEntryIssues roda a CADA TECLA no
    // cartão em edição (EntryCard não debounça a checagem ao vivo), e sem
    // esse cache cada chamada recompilava um `new RegExp(...)` PRA CADA
    // termo do glossário — com um glossário de personagens/lugares/
    // habilidades de RPG completo (facilmente 100-300+ termos), isso é
    // 100-300 compilações de regex a cada caractere digitado. Como
    // `properNouns` só muda de referência quando o glossário é editado de
    // verdade (não durante a digitação de uma tradução), o WeakMap acerta o
    // cache em praticamente toda chamada no caminho quente.
    const glossaryCompileCache = new WeakMap();
    // Achata espaço em branco pra comparação de glossário. O motivo é
    // concreto: wrapToLineCount reparte a tradução em linhas DEPOIS de ela
    // ficar pronta, e a quebra cai onde couber — inclusive no meio de um
    // termo do glossário ("Panzer\nSoldat", "Guerra dos Cem\nDias",
    // "Rean\nSchwarzer"). Comparar o texto cru contra "Panzer Soldat"
    // falhava sempre nesses casos, e como quase toda fala longa é
    // reparticionada, isso virou a maior fonte de aviso FALSO do QA.
    function flattenForGlossary(text) {
      return String(text == null ? "" : text).replace(/\s+/g, " ");
    }

    // Artigos que podem sumir/contrair na frente do termo. Em português a
    // preposição gruda no artigo o tempo todo (de+a=da, em+a=na, a+a=à), então
    // exigir "A Sociedade" literal reprova "ligado à Sociedade", que está
    // certíssimo. Só o corpo do termo importa pra checagem.
    const GLOSSARIO_ARTIGOS = new Set(["a", "o", "as", "os", "um", "uma"]);

    function escapeForRegex(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    // Regex do termo ESPERADO em português, tolerante às variações que a
    // língua cria sozinha:
    //  - artigo inicial vira opcional (contração, ver acima);
    //  - cada palavra aceita flexão de plural — mas NÃO tentando prever a
    //    regra certa (bug real: "(?:s|es)?" cobre plural regular do
    //    inglês, mas o plural do português é irregular pra várias
    //    terminações — "Filial" vira "Filiais" (-al -> -ais), não
    //    "Filials" nem "Filiales". Prever cada terminação irregular
    //    (-al/-ais, -el/-eis, -ão/-ões/-ães...) é retrabalho sem fim.
    //    Em vez disso, casa o RADICAL da palavra (as primeiras ~70% das
    //    letras) seguido de QUALQUER sufixo — "Fili" + qualquer coisa
    //    casa "Filial" e "Filiais" igualmente, sem saber gramática
    //    nenhuma. Palavra curta (<4 letras) demais pro radical fazer
    //    sentido cai de volta no sufixo simples;
    //  - o espaço entre palavras aceita qualquer espaço em branco.
    // É deliberadamente tolerante: este aviso existe pra pegar "o modelo
    // ignorou meu termo fixo", não pra corrigir concordância.
    function radicalDaPalavra(p) {
      if (p.length < 4) return escapeForRegex(p) + "(?:s|es)?";
      const tamanhoRadical = Math.max(3, Math.ceil(p.length * 0.7));
      return escapeForRegex(p.slice(0, tamanhoRadical)) + "[A-Za-zÀ-ÖØ-öø-ÿ]*";
    }

    function buildExpectedTermRegex(expected) {
      let palavras = expected.trim().split(/\s+/).filter(Boolean);
      if (palavras.length > 1 && GLOSSARIO_ARTIGOS.has(palavras[0].toLowerCase())) {
        palavras = palavras.slice(1);
      }
      if (palavras.length === 0) palavras = expected.trim().split(/\s+/).filter(Boolean);
      const corpo = palavras.map(radicalDaPalavra).join("\\s+");
      return new RegExp(corpo, "i");
    }

    function compileGlossary(properNouns) {
      if (!properNouns || properNouns.length === 0) return [];
      const cached = glossaryCompileCache.get(properNouns);
      if (cached) return cached;
      const compiled = [];
      for (const pn of properNouns) {
        const term = (pn.term || "").trim();
        const expected = (pn.translation || "").trim();
        if (!term || !expected) continue; // sem tradução fixa cadastrada, nada a checar
        const escaped = escapeForRegex(term);
        compiled.push({
          term,
          expected,
          re: new RegExp(`\\b${escaped}\\b`, "i"),
          expectedRe: buildExpectedTermRegex(expected),
        });
      }
      glossaryCompileCache.set(properNouns, compiled);
      return compiled;
    }

    function findGlossaryMismatches(original, translation, properNouns) {
      const compiled = compileGlossary(properNouns);
      if (compiled.length === 0) return [];
      // Achata ANTES de comparar: sem isso, todo termo de duas palavras que
      // caiu numa quebra de linha vira aviso falso (ver flattenForGlossary).
      const origPlano = flattenForGlossary(original);
      const tradPlano = flattenForGlossary(translation);
      const mismatches = [];
      for (const pn of compiled) {
        if (!pn.re.test(origPlano)) continue; // termo não aparece nesta linha
        // aceita o termo em português (com artigo contraído/plural)...
        const hasExpected = pn.expectedRe.test(tradPlano);
        // ...ou o termo em inglês mantido tal e qual (nome próprio que não
        // se traduz, tipo "Panzer Soldat")
        const hasOriginalTerm = pn.re.test(tradPlano);
        if (!hasExpected && !hasOriginalTerm) {
          mismatches.push({ term: pn.term, expected: pn.expected });
        }
      }
      return mismatches;
    }

    // conta quantas vezes `code` aparece em `str` — usado pra comparar
    // presença por QUANTIDADE, não só por existência (ver checkEntryIssues)
    function countOccurrences(str, code) {
      let count = 0;
      let from = 0;
      while (true) {
        const i = str.indexOf(code, from);
        if (i === -1) break;
        count += 1;
        from = i + code.length;
      }
      return count;
    }

    function countOccurrencesByCode(codes) {
      const map = new Map();
      for (const c of codes) map.set(c, (map.get(c) || 0) + 1);
      return map;
    }

    // Separa um texto em (códigos colados no começo) + (miolo) + (códigos
    // colados no fim). É a base do reparo automático: no formato do jogo, a
    // esmagadora maioria dos códigos de uma fala fica justamente nessas duas
    // pontas (troca de expressão/boca/olhos antes da fala, pausa/fim depois).
    function splitLeadingTrailingCodes(text) {
      const s = String(text || "");
      const matches = matchAllCodes(s);
      let lead = "";
      let cursor = 0;
      let i = 0;
      while (i < matches.length && matches[i].start === cursor) {
        lead += matches[i].text;
        cursor = matches[i].end;
        i += 1;
      }
      let trail = "";
      let end = s.length;
      let j = matches.length - 1;
      // j >= i evita contar duas vezes quando a fala inteira é só código
      while (j >= i && matches[j].end === end) {
        trail = matches[j].text + trail;
        end = matches[j].start;
        j -= 1;
      }
      return { lead, core: s.slice(cursor, end), trail };
    }

    // Tenta devolver pra tradução os códigos do jogo que se perderam, SEM
    // adivinhar posição. A regra é deliberadamente conservadora, porque
    // colocar um código no lugar errado é pior do que não colocar: o jogo
    // pode mudar a expressão do personagem na hora errada, ou travar.
    //
    // Como funciona: reconstrói a linha usando as pontas de código do
    // ORIGINAL (lead/trail) em volta do miolo já traduzido, e só aceita o
    // resultado se a sequência de códigos ficar EXATAMENTE igual à do
    // original — mesmos códigos, mesma quantidade, mesma ordem. Se sobrar
    // qualquer código no meio da fala (que é onde não dá pra inferir lugar),
    // a função recusa e devolve `fixed: false` com a lista do que não deu —
    // aí a saída certa é apagar a tradução e traduzir de novo.
    function repairMissingCodes(original, translation) {
      const text = String(translation || "");
      const expectedCodes = extractCodes(String(original || ""));
      if (expectedCodes.length === 0) return { text, fixed: true, changed: false, unfixable: [] };

      const expected = countOccurrencesByCode(expectedCodes);
      const missing = [];
      for (const [code, n] of expected.entries()) {
        if (countOccurrences(text, code) < n) missing.push(code);
      }
      if (missing.length === 0) return { text, fixed: true, changed: false, unfixable: [] };

      const o = splitLeadingTrailingCodes(original);
      const t = splitLeadingTrailingCodes(text);
      // o miolo traduzido entra sem as pontas de código que ele porventura
      // ainda tenha (essas vêm do original, que é a fonte da verdade)
      const candidate = o.lead + t.core.trim() + o.trail;

      // Aprovação só sai se a SEQUÊNCIA de códigos bater exatamente. Isso
      // cobre de uma vez: código faltando, código sobrando (duplicado) e
      // código fora de ordem — os três são inaceitáveis pro jogo.
      const candidateCodes = extractCodes(candidate);
      if (candidateCodes.join("\u0000") !== expectedCodes.join("\u0000")) {
        return { text, fixed: false, changed: false, unfixable: missing };
      }
      return { text: candidate, fixed: true, changed: candidate !== text, unfixable: [] };
    }

    // Uma linha só é "reparável" se o reparo automático consegue devolver
    // TODOS os códigos com segurança. Usado pela UI pra só oferecer o botão
    // de reinserir quando ele realmente vai resolver.
    function canRepairMissingCodes(original, translation) {
      const r = repairMissingCodes(original, translation);
      return r.fixed && r.changed;
    }

    // Escritas que NUNCA deveriam aparecer numa tradução en->pt-BR deste
    // jogo. Nasceu de um caso real: modelos multilíngues (o qwen2.5 é um
    // deles) às vezes respondem no próprio idioma de origem em vez do idioma
    // pedido — e o texto saía em chinês sem que nada acusasse, porque a
    // detecção de idioma só sabia distinguir português de inglês.
    // Faixas: CJK unificado, hiragana/katakana, hangul, cirílico, árabe,
    // hebraico, grego, tailandês e devanágari.
    // O grego (\u0370-\u03FF) foi DELIBERADAMENTE deixado de fora: α, β, Ω e
    // π aparecem como SÍMBOLO em nome de item, habilidade e versão de jogo o
    // tempo todo. Uma letra grega solta não é evidência de que a tradução
    // saiu em grego — e tratar como tal gerava crítico em linha que estava
    // perfeitamente em português.
    const NON_LATIN_SCRIPT_RE = /[\u4E00-\u9FFF\u3400-\u4DBF\u3040-\u30FF\uAC00-\uD7AF\u0400-\u04FF\u0600-\u06FF\u0590-\u05FF\u0E00-\u0E7F\u0900-\u097F]/;

    // Devolve os caracteres fora do alfabeto latino encontrados (sem repetir),
    // pra mensagem do QA poder mostrar o que apareceu.
    function findNonLatinChars(text) {
      const found = [];
      const seen = new Set();
      for (const ch of String(text || "")) {
        if (NON_LATIN_SCRIPT_RE.test(ch) && !seen.has(ch)) {
          seen.add(ch);
          found.push(ch);
        }
      }
      return found;
    }

    // Um caractere estranho perdido no meio de uma frase em português NÃO
    // quer dizer que "a tradução está em outro idioma" — quer dizer que tem
    // um caractere estranho ali. Tratar os dois casos como a mesma coisa
    // gerava crítico (que BLOQUEIA a exportação) em linha correta.
    //
    // Para valer como idioma errado, a escrita estrangeira precisa ser
    // presença de verdade: pelo menos 2 caracteres E pelo menos 15% do
    // texto. Tradução que saiu inteira em chinês ou russo fica perto de
    // 100% e passa fácil; um símbolo solto fica em 2-3% e não passa.
    const NON_LATIN_MIN_CHARS = 2;
    const NON_LATIN_MIN_RATIO = 0.15;

    function nonLatinRatio(text) {
      const s = String(text || "").replace(/\s+/g, "");
      if (!s) return 0;
      let n = 0;
      for (const ch of s) if (NON_LATIN_SCRIPT_RE.test(ch)) n += 1;
      return n / s.length;
    }

    function isWrongScript(text) {
      const s = String(text || "");
      let total = 0;
      for (const ch of s.replace(/\s+/g, "")) if (NON_LATIN_SCRIPT_RE.test(ch)) total += 1;
      return total >= NON_LATIN_MIN_CHARS && nonLatinRatio(s) >= NON_LATIN_MIN_RATIO;
    }

    // Mostra o caractere com o código Unicode junto. Sem isso, um caractere
    // invisível (espaço ideográfico, marca de direção) aparecia como um vazio
    // na mensagem e não dava pra saber o que era.
    function describeChars(chars) {
      return chars.map((ch) => `${ch} (U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")})`).join(" ");
    }

    // Migração de progresso salvo: o aviso "ainda em inglês" tinha tipo
    // próprio ("still-english") e virou parte de "wrong-language" — porque a
    // pergunta que importa é uma só, "está em português?". Sem isto, quem já
    // tinha ignorado avisos de inglês veria todos eles voltarem, já que a
    // chave gravada não casaria mais com o tipo emitido.
    function migrateQaIgnored(saved) {
      if (!saved || typeof saved !== "object") return {};
      const out = {};
      for (const [ref, tipos] of Object.entries(saved)) {
        if (!tipos || typeof tipos !== "object") continue;
        const novo = {};
        for (const [tipo, val] of Object.entries(tipos)) {
          novo[tipo === "still-english" ? "wrong-language" : tipo] = val;
        }
        out[ref] = novo;
      }
      return out;
    }

    // Issue sintético pra linha em que o motor de tradução falhou e o texto
    // original foi mantido no lugar da tradução (ver applyGroupResult e
    // checkBatchApiJobs). Não faz parte de checkEntryIssues de propósito:
    // aquela função só olha o CONTEÚDO do texto, e não tem como saber se um
    // texto igual ao original é "falha mantida de propósito" ou coincidência
    // — quem sabe disso é o dado do documento (doc.translationFailed), não o
    // texto em si. Por isso os 3 lugares que calculam issues por linha
    // (runQualityCheck, EntryCard, selectBulkApprovableEntries) injetam este
    // issue à parte quando a flag está marcada.
    function makeTranslationFailedIssue() {
      return {
        severity: "critical",
        type: "translation-failed",
        detail: 'o motor de tradução falhou nesta linha depois de esgotar as tentativas — o texto original foi mantido pra não ficar em branco. Reenvie ao lote (ou use "Apagar críticos e refazer").',
      };
    }

    function checkEntryIssues(entry, translation, properNouns) {
      const text = (translation || "").trim();
      if (!text) return [];
      const issues = [];

      if (entry.codes.length > 0) {
        // conta OCORRÊNCIAS de cada código, não só presença — um `.includes()`
        // simples não pega o caso de um código que aparece 2x no original e
        // só 1x na tradução (comum em falas longas com mais de uma quebra/
        // troca de expressão do mesmo tipo). Auditoria 2.1.
        const missingOrShort = [];
        for (const [code, expectedCount] of countOccurrencesByCode(entry.codes).entries()) {
          const actualCount = countOccurrences(text, code);
          if (actualCount < expectedCount) {
            missingOrShort.push(expectedCount > 1 ? `${code} (${actualCount}/${expectedCount}x)` : code);
          }
        }
        if (missingOrShort.length > 0) {
          issues.push({
            severity: "critical",
            type: "missing-code",
            detail: `código(s) do jogo ausente(s) ou em quantidade menor na tradução: ${missingOrShort.join(" ")}`,
          });
        }
      }

      // Marcador de proteção que sobrou é sempre CRÍTICO: é texto que não
      // existe no roteiro e vai aparecer literalmente na tela do jogo.
      const leaked = findLeakedMarkers(text);
      if (leaked.length > 0) {
        issues.push({
          severity: "critical",
          type: "leaked-marker",
          detail: `sobrou marcador de proteção na tradução (${leaked.slice(0, 4).join(" ")}) — isso apareceria literalmente no jogo`,
        });
      }

      // Código inventado é tão grave quanto código perdido: manda o jogo
      // executar uma instrução que o roteiro original não tinha.
      const inventados = findInventedCodes(entry.original, text);
      if (inventados.length > 0) {
        issues.push({
          severity: "critical",
          type: "invented-code",
          detail: `código(s) de jogo que NÃO existem no original: ${inventados.slice(0, 4).join(" ")}`,
        });
      }

      if (entry.lineCount > 1) {
        const lc = text.split(/\r\n|\r|\n/).length;
        if (lc !== entry.lineCount) {
          issues.push({
            severity: "warning",
            type: "line-mismatch",
            detail: `original tem ${entry.lineCount} linha(s), tradução tem ${lc}`,
          });
        }
      }

      // IDIOMA ERRADO — um tipo só pra qualquer coisa que não seja
      // português. Antes eram dois avisos separados ("ainda em inglês" e
      // "outro idioma"), o que dividia o mesmo problema em duas listas e dois
      // botões. O que importa é uma pergunta só: a linha está em português?
      // Inglês, chinês ou russo são todos a mesma falha do ponto de vista de
      // quem revisa.
      //
      // A SEVERIDADE é que muda, conforme a força da evidência:
      //  - escrita não-latina (chinês, cirílico...) é CRÍTICA. Não existe
      //    hipótese de isso ser proposital num texto pt-BR, e gravar no jogo
      //    seria lixo garantido — então bloqueia a exportação.
      //  - inglês é AVISO. Pode ser proposital: nome próprio, sigla, "OK",
      //    grito. Bloquear a exportação nesses casos travaria o trabalho à
      //    toa; como aviso, dá pra usar "ignorar" linha a linha.
      const nonLatin = findNonLatinChars(text);
      const escritaErrada = isWrongScript(text);
      if (escritaErrada) {
        issues.push({
          severity: "critical",
          type: "wrong-language",
          detail: `a tradução está em outro idioma (${Math.round(nonLatinRatio(text) * 100)}% do texto fora do alfabeto latino: ${describeChars(nonLatin.slice(0, 4))}${nonLatin.length > 4 ? "..." : ""})`,
        });
      } else if (nonLatin.length > 0) {
        // Poucos caracteres estranhos no meio de um texto latino: pode ser
        // símbolo copiado por engano, resíduo de codificação do arquivo, ou
        // um caractere invisível. Vale revisar, mas NÃO é "a tradução está
        // em outro idioma" e não pode bloquear a exportação.
        issues.push({
          severity: "warning",
          type: "odd-chars",
          detail: `caractere(s) fora do alfabeto latino no meio do texto: ${describeChars(nonLatin.slice(0, 4))}${nonLatin.length > 4 ? "..." : ""}`,
        });
      }

      // Continua em INGLÊS — mesmo tipo "wrong-language", severidade aviso.
      //
      // A evidência mais forte aqui não é o idioma detectado, é a SEMELHANÇA
      // com o original. Tradução de verdade fica em ~0% de semelhança
      // ("Please be careful." -> "Por favor, tenha cuidado."); linha que
      // passou sem tradução fica em 100%. Separação limpa, e não depende de
      // reconhecer vocabulário — a versão anterior, que confiava só na
      // detecção de idioma, dava 10% de falso positivo em linha curta.
      //
      // Também resolve um empate: "Do not push or run!" tem "do", que existe
      // nas listas de palavras dos DOIS idiomas, então a detecção devolvia
      // "unknown" e a linha não traduzida escapava. Pela semelhança, é pega.
      if (entry.lang === "en" && !escritaErrada) {
        const sim = textSimilarity(entry.original, text);
        // praticamente intocada: evidência suficiente sozinha
        const quaseIdentica = sim >= 0.85;
        // parcialmente mexida: exige a detecção de idioma concordando
        const parecidaEDetectadaEn = sim >= 0.5 && detectLanguage(text) === "en";
        if (quaseIdentica || parecidaEDetectadaEn) {
          issues.push({
            severity: "warning",
            type: "wrong-language",
            detail: `a tradução ainda parece estar em inglês (${Math.round(sim * 100)}% igual ao original)`,
          });
        }
      }

      for (const m of findGlossaryMismatches(entry.original, text, properNouns)) {
        issues.push({
          severity: "warning",
          type: "glossary-mismatch",
          detail: `termo "${m.term}" tem tradução fixa "${m.expected}" cadastrada no glossário, mas não aparece na tradução`,
        });
      }

      return issues;
    }

    // ---------------------------------------------------------------------------
    // Relatório de diagnóstico do QA (pra colar numa IA)
    // ---------------------------------------------------------------------------
    // Duas decisões de projeto que fazem esse arquivo servir pra alguma coisa:
    //
    //  1) NÃO é um despejo. Com 550 problemas, 500 deles são a mesma coisa
    //     repetida — mandar tudo estoura o contexto da IA e não acrescenta
    //     informação. O relatório leva a CONTAGEM completa (que é o que
    //     revela proporção) e uma AMOSTRA limitada por tipo (que é o que
    //     revela o padrão).
    //
    //  2) Leva o AMBIENTE junto. A pergunta "por que tantas linhas ficaram
    //     em inglês?" não tem resposta sem saber qual modelo, qual tamanho
    //     de lote e qual contexto estavam em uso. Sem isso, quem analisa
    //     chuta.
    //
    // A chave de API NUNCA entra aqui — o arquivo existe pra ser
    // compartilhado, e chave em log é como chave vaza.
    const QA_DIAG_AMOSTRAS_POR_TIPO = 12;
    const QA_DIAG_MAX_TEXTO = 300;

    function cortaTexto(s, max) {
      const t = String(s == null ? "" : s);
      return t.length > max ? t.slice(0, max) + "…[cortado]" : t;
    }

    function buildQaDiagnostic(qaResults, settings, extras) {
      const items = (qaResults && qaResults.items) || [];
      const info = extras || {};

      // --- contagens (completas, sobre TODOS os itens) ---
      const porTipo = {};
      const porSeveridade = { critical: 0, warning: 0 };
      const porArquivo = {};
      for (const it of items) {
        porArquivo[it.fileName] = (porArquivo[it.fileName] || 0) + 1;
        for (const iss of it.issues) {
          porTipo[iss.type] = (porTipo[iss.type] || 0) + 1;
          if (iss.severity === "critical") porSeveridade.critical += 1;
          else porSeveridade.warning += 1;
        }
      }

      // --- amostras (limitadas por tipo) ---
      const amostras = {};
      for (const it of items) {
        for (const iss of it.issues) {
          if (!amostras[iss.type]) amostras[iss.type] = [];
          if (amostras[iss.type].length >= QA_DIAG_AMOSTRAS_POR_TIPO) continue;
          amostras[iss.type].push({
            arquivo: it.fileName,
            celula: it.ref,
            original: cortaTexto(it.original, QA_DIAG_MAX_TEXTO),
            traducao: cortaTexto(it.translation, QA_DIAG_MAX_TEXTO),
            detalhe: iss.detail,
            verificadaPorHumano: !!it.verified,
            // dados que costumam explicar o problema sem precisar perguntar
            codigosNoOriginal: extractCodes(it.original),
            codigosNaTraducao: extractCodes(it.translation),
          });
        }
      }

      const s = settings || {};
      const ehLocal = !!(s.openaiBaseUrl && String(s.openaiBaseUrl).trim());

      return {
        comoUsar:
          "Log de diagnóstico do tradutor de Trails of Cold Steel (inglês -> português do Brasil). " +
          "Os textos passam por um pipeline que protege os códigos do jogo (#E[12], #M_4 etc.) antes de ir " +
          "pro modelo e os recoloca depois. Analise os padrões em 'amostras' junto com 'ambiente' e diga: " +
          "(a) qual a causa mais provável de cada tipo de problema, (b) se é configuração, prompt ou limitação " +
          "do modelo, e (c) o que mudar primeiro. 'contagens' vale sobre o TOTAL; 'amostras' é uma seleção " +
          "limitada por tipo, então use-a pra padrão, não pra proporção.",

        geradoEm: new Date().toISOString(),
        versaoRelatorio: 1,

        ambiente: {
          motor: s.engine || null,
          provedor: s.llmProvider || null,
          modelo: s.llmModel || null,
          servidorLocal: ehLocal,
          apiNativaOllama: ehLocal ? s.openaiUseOllamaNative !== false : false,
          numCtx: ehLocal ? Number(s.openaiNumCtx) || null : null,
          keepAlive: ehLocal ? s.openaiKeepAlive || null : null,
          linhasPorRequisicao: ehLocal ? Number(s.openaiLocalBatchSize) || null : null,
          requisicoesEmParalelo: ehLocal ? Number(s.openaiLocalConcurrency) || null : null,
          // a chave NUNCA sai daqui: este arquivo existe pra ser compartilhado
          chaveDeApi: "[removida do relatório]",
        },

        escopo: {
          alcance: (qaResults && qaResults.scope) || null,
          arquivosAnalisados: info.totalArquivos || null,
          linhasAnalisadas: info.totalLinhas || null,
          termosNoGlossario: info.totalGlossario || null,
        },

        contagens: {
          linhasComProblema: items.length,
          porSeveridade,
          porTipo,
          porArquivo: Object.fromEntries(
            Object.entries(porArquivo).sort((a, b) => b[1] - a[1]).slice(0, 20)
          ),
        },

        amostrasLimitadasA: QA_DIAG_AMOSTRAS_POR_TIPO,
        amostras,
      };
    }

    function runQualityCheck(scopedDocs, properNouns) {
      const results = [];
      for (const d of scopedDocs) {
        const qaIgnored = d.qaIgnored || {};
        for (const e of d.entries) {
          if (d.ignored[e.ref]) continue;
          const translation = d.translations[e.ref];
          if (!translation || !translation.trim()) continue;
          let issues = checkEntryIssues(e, translation, properNouns);
          if (d.translationFailed && d.translationFailed[e.ref]) {
            issues = [makeTranslationFailedIssue(), ...issues];
          }
          // Nota do revisor de coerência (IA) — só existe se a pessoa clicou
          // em "Revisar coerência" pra esta linha (ver runCoherenceReview).
          // Igual translation-failed, isso não vem de checkEntryIssues
          // porque não é uma propriedade do TEXTO, é um veredito já
          // computado e guardado à parte em d.coherenceReview.
          const review = d.coherenceReview && d.coherenceReview[e.ref];
          if (review) {
            const coherenceIssue = makeCoherenceIssue(review);
            if (coherenceIssue) issues = [coherenceIssue, ...issues];
          }

          // LINHA VERIFICADA só mostra CRÍTICO.
          // Marcar como verificada é o ato de dizer "eu li e aprovo esta
          // tradução" — o que já inclui ter visto os avisos. Continuar
          // repetindo "parece estar em inglês" ou "termo do glossário
          // diferente" numa linha que a pessoa aprovou de propósito só
          // enche a lista e faz o QA perder credibilidade: quando quase
          // tudo é aviso, ninguém olha os avisos.
          //
          // Crítico é diferente e NÃO some: código do jogo ausente ou
          // tradução em outro idioma podem quebrar o jogo, e isso não é
          // questão de gosto que uma aprovação humana resolva — pode ter
          // sido aprovado sem a pessoa perceber o código faltando.
          if (d.verified[e.ref]) {
            issues = issues.filter((iss) => iss.severity === "critical");
          }

          // "ignorar" só se aplica a avisos — crítico (código do jogo
          // ausente/alterado) NUNCA é filtrado aqui, mesmo que alguém tenha
          // deixado uma entrada velha em qaIgnored (defesa extra: a UI já
          // não oferece o botão de ignorar pra severidade crítica).
          const ignoredForRef = qaIgnored[e.ref];
          if (ignoredForRef) {
            issues = issues.filter((iss) => iss.severity === "critical" || !ignoredForRef[iss.type]);
          }
          if (issues.length > 0) {
            results.push({
              docId: d.id,
              fileName: d.fileName,
              project: d.project,
              ref: e.ref,
              location: e.location,
              original: e.original,
              translation,
              verified: !!d.verified[e.ref],
              issues,
            });
          }
        }
      }
      return results;
    }

    async function translateTextOnce(original, settings, properNouns, translationMemory) {
      // conta as linhas do original ANTES de mexer em qualquer coisa, e manda
      // pro tradutor um texto de uma linha só (mais confiável) — a quebra de
      // linha é reaplicada depois, por tamanho de palavra, sem cortar nada.
      const lineCount = original.split(/\r\n|\r|\n/).length;
      const flatOriginal = original.replace(/\r\n|\r|\n/g, " ");

      if (settings.engine === "llm") {
        // LLM entende contexto, então o glossário de termos vai como
        // instrução no prompt (não como marcador de posição) — fica mais
        // natural mesmo quando a frase flexiona o termo ao redor dele.
        const restored = await translateViaLLM(flatOriginal, settings, properNouns, translationMemory);
        return lineCount > 1 ? wrapToLineCount(restored, lineCount) : restored;
      }

      // Auditoria 2.4: códigos do jogo são protegidos PRIMEIRO — mais
      // defensivo que a ordem anterior (nomes próprios antes de códigos),
      // porque garante que o regex de nomes próprios nunca roda sobre texto
      // que ainda tem sintaxe de código de controle crua (#E[12] etc.),
      // eliminando de vez qualquer possibilidade futura de um termo do
      // glossário coincidir parcialmente com um código novo. O restore
      // desfaz na ordem EXATAMENTE inversa (pontuação -> nomes -> códigos).
      const { protectedText: codeProtected, tokens: codeTokens } = protectCodes(flatOriginal);
      const { text: nounProtected, tokens: nounTokens } = protectProperNouns(codeProtected, properNouns);
      // punctProtected só acrescenta a proteção de "(" ")" "..." "…" (‡N‡)
      // por cima, sem se misturar com códigos (§N§) nem nomes (¤N¤)
      const { protectedText: punctProtected, tokens: punctTokens } = protectPunctuation(nounProtected);
      const translatedRaw =
        settings.engine === "mymemory"
          ? await translateViaMyMemory(punctProtected)
          : await translateViaLibreTranslate(punctProtected, settings);
      let restored = restorePunctuation(translatedRaw, punctTokens);
      restored = restoreProperNouns(restored, nounTokens);
      restored = restoreCodes(restored, codeTokens);
      return lineCount > 1 ? wrapToLineCount(restored, lineCount) : restored;
    }

    async function translateText(original, settings, properNouns, translationMemory, retries = 3) {
      let lastErr;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          return await translateTextOnce(
            original,
            attempt === 0 ? settings : { ...settings, retryAttempt: attempt },
            properNouns,
            translationMemory
          );
        } catch (e) {
          lastErr = e;
          // auditoria 1.1: mesmo raciocínio de translateBatchWithRetry — não
          // insiste em erro que o próprio motor já disse que não vai se
          // resolver tentando de novo.
          if (e && e.retryable === false) throw e;
          if (attempt < retries) {
            const delay = e && e.retryable ? computeBackoffDelay(attempt, e.retryAfterMs) : 700 * (attempt + 1);
            await sleep(delay);
          }
        }
      }
      throw lastErr;
    }

    async function testLibreTranslateConnection(settings) {
      try {
        const result = await translateViaLibreTranslate("Hello", settings);
        return { ok: true, sample: result };
      } catch (e) {
        return { ok: false, error: e.message };
      }
    }

    async function testLLMConnection(settings) {
      try {
        const result = await translateViaLLM("Hello, how are you?", settings, []);
        return { ok: true, sample: result };
      } catch (e) {
        return { ok: false, error: e.message };
      }
    }

    const PAGE_SIZE_OPTIONS = [20, 50, 100];
    const FILTERS = [
      ["all", "Todos"],
      ["pending", "🔴 Pendentes"],
      ["done", "🟡 Traduzidos"],
      ["verified", "🔵 Verificados"],
      ["ignored", "Ignorados"],
      ["lang-en", "Inglês"],
      ["dup-unverified", "Repetidos 3x+ (não verif.)"],
    ];

    // usada pra casar o texto original com a chave da memória de tradução —
    // módulo-level porque tanto o componente quanto entryMatchesFilter (abaixo)
    // precisam dela.
    const memoryKey = (text) => text.trim();

    // Mesma regra de filtro/busca usada tanto pra lista do arquivo ativo
    // quanto pra busca no projeto inteiro — extraída aqui pra não duplicar
    // (e desalinhar) a lógica entre os dois modos.
    function entryMatchesFilter(doc, e, filter, q, originalOccurrenceCounts) {
      const isDone = (doc.translations[e.ref] || "").trim().length > 0;
      const isIgnored = !!doc.ignored[e.ref];
      const isVerified = !!doc.verified[e.ref];
      if (isIgnored && filter !== "ignored" && filter !== "all") return false;
      if (filter === "pending" && (isDone || isVerified)) return false;
      if (filter === "done" && (!isDone || isVerified)) return false;
      if (filter === "ignored" && !isIgnored) return false;
      if (filter === "verified" && !isVerified) return false;
      if (filter === "lang-en" && (e.lang !== "en" || isVerified)) return false;
      if (filter === "dup-unverified") {
        if (isVerified) return false;
        const count = (originalOccurrenceCounts && originalOccurrenceCounts[memoryKey(e.original)]) || 0;
        if (count <= 2) return false;
      }
      if (q) {
        const hay = `${e.ref} ${e.location} ${e.original}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    let nextDocId = 1;

    // Cartão de um diálogo. Envolvido em React.memo: só re-renderiza quando
    // ALGUMA de suas próprias props muda — não quando o usuário digita em
    // OUTRO cartão da lista. É isso que mantém a digitação fluida mesmo com
    // a página cheia de cartões (as funções on* recebidas são estáveis via
    // useCallback lá no componente pai, então a comparação rasa do memo
    // realmente funciona).
    // Item da lista de arquivos na sidebar. Memoizado pelo mesmo motivo do
    // EntryCard: sem isso, digitar em QUALQUER cartão de tradução re-renderiza
    // a lista inteira de arquivos na lateral, mesmo os que não mudaram nada.
    const SidebarFileItem = React.memo(function SidebarFileItem({ doc, isActive, stats, onSelect, onRemove }) {
      return (
        <div
          className={`sidebar-file-item ${isActive ? "active" : ""}`}
          onClick={() => onSelect(doc.id)}
        >
          <FileSpreadsheet size={14} color={isActive ? "#C9A227" : "currentColor"} style={{ flexShrink: 0 }} />
          <div className="sidebar-file-info">
            <span className="file-tab-project">{doc.project}</span>
            <span className="sidebar-file-name">{doc.fileName}</span>
          </div>
          <span className="sidebar-file-badges" title={`${stats.pending} pendente(s) · ${stats.done} traduzido(s) não verificado(s) · ${stats.verified} verificado(s)`}>
            <span className={`badge badge-pending ${stats.pending === 0 ? "zero" : ""}`}>🔴 {stats.pending}</span>
            <span className={`badge badge-done ${stats.done === 0 ? "zero" : ""}`}>🟡 {stats.done}</span>
            <span className={`badge badge-verified ${stats.verified === 0 ? "zero" : ""}`}>🔵 {stats.verified}</span>
          </span>
          <button
            type="button"
            className="close-x"
            onClick={(ev) => { ev.stopPropagation(); onRemove(doc.id); }}
            title="Remover da lista (não apaga o progresso salvo)"
            aria-label={`Remover ${doc.fileName} da lista`}
          >
            <XIcon size={12} />
          </button>
        </div>
      );
    });

    const EntryCard = React.memo(function EntryCard({
      entry,
      docId,
      translationValue,
      isIgnored,
      isAuto,
      isFromMemory,
      isFailed,
      isVerified,
      memory,
      properNouns,
      position, // posição deste cartão na página atual (1-based) — orientação em sessões longas
      total, // total de itens no filtro/busca atual
      onToggleIgnored,
      onToggleVerified,
      onChangeTranslation,
      onBlurTranslation,
      onWrapLines,
      onFocusNext,
    }) {
      const isDone = translationValue.trim().length > 0;
      const translationLineCount = isDone ? translationValue.split(/\r\n|\r|\n/).length : entry.lineCount;

      // Auditoria #2 M4: checkEntryIssues chama detectLanguage, que faz
      // strip de regex, tokenização, varredura de dois Sets e (no pior caso)
      // perfil de trigramas. Rodando no corpo do componente, isso acontecia
      // a CADA TECLA no cartão em edição, competindo com o próprio evento de
      // digitação. Nenhum desses avisos precisa de reação instantânea — eles
      // só fazem sentido quando a pessoa PARA de digitar. 400ms é curto o
      // bastante pra parecer imediato e longo o bastante pra pular o trabalho
      // de uma frase inteira sendo digitada.
      const [settledValue, setSettledValue] = React.useState(translationValue);
      React.useEffect(() => {
        if (settledValue === translationValue) return;
        const t = setTimeout(() => setSettledValue(translationValue), 400);
        return () => clearTimeout(t);
      }, [translationValue, settledValue]);

      // Mesma regra do painel de QA (ver runQualityCheck): linha aprovada
      // por uma pessoa só continua avisando sobre CRÍTICO. Sem isto, o
      // cartão e o painel discordariam sobre a mesma linha.
      const allIssues = isDone ? checkEntryIssues(entry, settledValue, properNouns) : [];
      const liveIssues = isVerified ? allIssues.filter((i) => i.severity === "critical") : allIssues;
      // Auditoria #2 C2: aqui existia uma SEGUNDA definição de "código
      // ausente", com `.includes()` — cega a duplicatas, exatamente o bug que
      // a auditoria #1 corrigiu em checkEntryIssues. O resultado era o
      // cartão jurando que estava tudo certo enquanto o QA bloqueava a
      // exportação da mesma linha. Agora sai tudo da mesma fonte de verdade,
      // então cartão e QA não têm como discordar (inclusive na contagem
      // "1/2x" quando o código aparece mais de uma vez no original).
      const missingCodeIssue = liveIssues.find((i) => i.type === "missing-code") || null;
      const lineMismatch = liveIssues.some((i) => i.type === "line-mismatch");
      const glossaryIssues = liveIssues.filter((i) => i.type === "glossary-mismatch");
      const [similar, setSimilar] = React.useState(null); // null = não buscou ainda

      const searchSimilar = () => {
        setSimilar(findSimilarInMemory(entry.original, memory));
      };

      const useSuggestion = (translation) => {
        onChangeTranslation(docId, entry.ref, translation);
        setSimilar(null);
      };

      // Ctrl+M: aplica na hora a melhor sugestão da memória — igual exato
      // primeiro, senão a mais parecida com pelo menos 90% de similaridade —
      // sem precisar clicar em "buscar similar". Só preenche o campo; a
      // aprovação continua manual (Ctrl+Enter), pra nunca aprovar sozinho
      // algo que ninguém olhou.
      const applyTopMemorySuggestion = () => {
        const key = entry.original.trim();
        const exact = memory[key];
        if (exact && exact.translation) {
          onChangeTranslation(docId, entry.ref, exact.translation);
          setSimilar(null);
          return;
        }
        const [top] = findSimilarInMemory(entry.original, memory, 0.9, 1);
        if (top) {
          onChangeTranslation(docId, entry.ref, top.translation);
          setSimilar(null);
        }
      };

      // Ctrl+Enter aprova e pula pra próxima linha · Ctrl+I ignora e pula ·
      // Ctrl+M aplica a melhor sugestão da memória (igual ou ≥90% parecida)
      const handleKeyDown = (ev) => {
        if (ev.ctrlKey && ev.key === "Enter") {
          ev.preventDefault();
          if (!isIgnored && translationValue.trim()) onToggleVerified(docId, entry.ref);
          onFocusNext(entry.ref);
        } else if (ev.ctrlKey && (ev.key === "i" || ev.key === "I")) {
          ev.preventDefault();
          onToggleIgnored(docId, entry.ref);
          onFocusNext(entry.ref);
        } else if (ev.ctrlKey && (ev.key === "m" || ev.key === "M")) {
          ev.preventDefault();
          if (!isIgnored) applyTopMemorySuggestion();
        }
      };

      return (
        <div
          className={[
            "card",
            isIgnored ? "ignored is-ignored" : "",
            // ordem importa: crítico manda em tudo, depois verificado,
            // depois só "tem tradução" (ver .card::before no CSS)
            missingCodeIssue ? "is-critical" : isVerified ? "is-verified" : isDone ? "is-done" : "",
          ].filter(Boolean).join(" ")}
          id={`card-${entry.ref}`}
        >
          <div className="card-tab dialog">Diálogo</div>
          <div className="card-head">
            {position != null && total != null && (
              <span className="card-position" title="Posição deste cartão dentro do filtro/busca atual">{position} de {total}</span>
            )}
            <span className="ref">{entry.ref}</span>
            <span>loc {entry.location}</span>
            {entry.lang !== "unknown" && (
              <span className={`lang-badge lang-${entry.lang}`}>{entry.lang === "en" ? "EN" : "PT"}</span>
            )}
            {entry.lineCount > 1 && (
              <span className="lines-badge" title="Quantidade de linhas no texto original">{entry.lineCount} linhas</span>
            )}
            {isAuto && !isIgnored && (
              <span className="auto-badge"><Sparkles size={11} /> automática</span>
            )}
            {isFromMemory && !isIgnored && (
              <span className="memory-badge"><Link2 size={11} /> da memória</span>
            )}
            {isFailed && !isIgnored && (
              <span className="fail-badge" title="O motor de tradução falhou aqui — o texto abaixo é o ORIGINAL, mantido pra não ficar em branco.">
                <AlertCircle size={11} /> falha do motor
              </span>
            )}
            <button
              className="card-status-btn"
              onClick={() => onToggleIgnored(docId, entry.ref)}
              title={isIgnored ? "Voltar a marcar como pendente" : "Marcar como nome próprio / não traduzir"}
            >
              {isIgnored ? (
                <React.Fragment><MinusCircle size={13} /> ignorado</React.Fragment>
              ) : isDone ? (
                <React.Fragment><CheckCircle2 size={13} color="#74915E" /> traduzido</React.Fragment>
              ) : (
                <React.Fragment><Circle size={13} /> ignorar</React.Fragment>
              )}
            </button>
          </div>
          <div className="field-label">Original</div>
          <p className="original-text">{entry.original}</p>
          {entry.codes.length > 0 && (
            <div className="code-chips" title="Códigos do jogo nesta linha — precisam continuar presentes na tradução">
              {entry.codes.map((c, i) => (
                <span className="code-chip" key={i}>{c}</span>
              ))}
            </div>
          )}
          <div className="field-label" style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span>Tradução</span>
            <div style={{ display: "flex", gap: 6 }}>
              {!isDone && !isIgnored && (
                <button
                  className="verify-toggle-btn"
                  onClick={searchSimilar}
                  title="Procurar frases parecidas já traduzidas na memória"
                >
                  <Search size={11} /> buscar similar
                </button>
              )}
              {isDone && entry.lineCount > 1 && (
                <button
                  className="verify-toggle-btn"
                  onClick={() => onWrapLines(docId, entry.ref)}
                  title={`Reformatar a tradução pra ter ${entry.lineCount} linha(s), igual ao original, sem cortar palavra`}
                >
                  <WrapText size={11} /> ajustar linhas
                </button>
              )}
              {!isIgnored && isDone && (
                <button
                  className={`verify-toggle-btn ${isVerified ? "on" : ""}`}
                  onClick={() => onToggleVerified(docId, entry.ref)}
                  title="Marcar que você revisou e aprova esta tradução (Ctrl+Enter)"
                >
                  <ShieldCheck size={11} /> {isVerified ? "verificado" : "aprovar"}
                </button>
              )}
            </div>
          </div>
          {similar && (
            <div className="similar-panel">
              {similar.length === 0 ? (
                <div className="no-suggestion">Nada parecido encontrado na memória ainda.</div>
              ) : (
                similar.map((s, i) => (
                  <div className="similar-item" key={i}>
                    <div className="similar-score">{Math.round(s.score * 100)}%</div>
                    <div className="similar-text">
                      <div className="similar-original">{s.original}</div>
                      <div className="similar-translation">{s.translation}</div>
                    </div>
                    <button className="suggestion-chip" onClick={() => useSuggestion(s.translation)}>usar</button>
                  </div>
                ))
              )}
              <button className="dismiss-issues-btn" onClick={() => setSimilar(null)}><XIcon size={11} /> fechar</button>
            </div>
          )}
          {isFailed && !isIgnored && (
            <div className="warn-note critical">
              <AlertCircle size={12} /> O motor de tradução falhou aqui depois de esgotar as tentativas — o texto abaixo é o ORIGINAL em inglês, mantido pra não ficar em branco. Edite manualmente ou reenvie ao lote em "Verificar qualidade" → "Apagar críticos e refazer".
            </div>
          )}
          {missingCodeIssue && (
            <div className="warn-note critical">
              <AlertCircle size={12} /> {missingCodeIssue.detail}
            </div>
          )}
          {lineMismatch && (
            <div className="warn-note">
              <AlertCircle size={12} /> original tem {entry.lineCount} linhas, tradução tem {translationLineCount}
            </div>
          )}
          <textarea
            className="translation-area"
            rows={2}
            placeholder="Digite a tradução aqui... (Ctrl+Enter aprova e avança · Ctrl+I ignora e avança)"
            value={translationValue}
            disabled={isIgnored}
            onChange={(ev) => onChangeTranslation(docId, entry.ref, ev.target.value)}
            onBlur={() => onBlurTranslation(docId, entry.ref)}
            onKeyDown={handleKeyDown}
          />
        </div>
      );
    });

    // Lista os problemas achados pelo runQualityCheck, com contagem por
    // severidade no topo e um botão "ir para" que leva direto ao cartão da
    // linha (troca de arquivo se precisar).
    // Lista de linhas onde o import de outra pessoa tem tradução DIFERENTE
    // da que já está aqui — precisa de decisão manual, uma por uma (ou
    // ignorar e deixar a sua como está).
    function ConflictsPanel({ conflicts, onResolve }) {
      const [page, setPage] = React.useState(1);
      const PAGE_SIZE = 10;

      React.useEffect(() => { setPage(1); }, [conflicts.length]);

      if (conflicts.length === 0) {
        return (
          <div className="empty-state" style={{ padding: "16px 0" }}>
            <CheckCircle2 size={16} color="#74915E" style={{ marginBottom: 6 }} /><br />
            Nenhum conflito pendente.
          </div>
        );
      }

      const totalPages = Math.max(1, Math.ceil(conflicts.length / PAGE_SIZE));
      const safePage = Math.min(page, totalPages);
      const visible = conflicts.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

      return (
        <div>
          <div className="settings-note" style={{ marginBottom: 10 }}>
            {conflicts.length} linha(s) têm tradução diferente da importada — escolha qual manter em cada uma.
          </div>
          <div className="memory-list">
            {visible.map((c) => (
              <div className="memory-item qa-item" key={`${c.docId}:${c.ref}`} style={{ gridTemplateColumns: "1fr" }}>
                <div className="memory-item-original">
                  <span className="file-tab-project" style={{ marginRight: 6 }}>{c.fileName}</span>
                  <span className="ref mono">{c.ref}</span> — {c.original}
                </div>
                <div className="similar-panel" style={{ margin: "6px 0 0" }}>
                  <div className="similar-item">
                    <span className="similar-score" style={{ background: "rgba(116,145,94,0.12)", borderColor: "rgba(116,145,94,0.35)", color: "#4F6B3F" }}>sua</span>
                    <div className="similar-text"><div className="similar-translation">{c.local}</div></div>
                    <button className="suggestion-chip" onClick={() => onResolve(c, "local")}>manter</button>
                  </div>
                  <div className="similar-item">
                    <span className="similar-score">{c.importedVerified ? "importada ✓" : "importada"}</span>
                    <div className="similar-text"><div className="similar-translation">{c.imported}</div></div>
                    <button className="suggestion-chip" onClick={() => onResolve(c, "imported")}>usar</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {totalPages > 1 && (
            <div className="pagination" style={{ marginTop: 12 }}>
              <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={safePage <= 1} aria-label="Página anterior"><ChevronLeft size={14} /></button>
              <span>página {safePage} de {totalPages} · {conflicts.length} conflito(s)</span>
              <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={safePage >= totalPages} aria-label="Próxima página"><ChevronRight size={14} /></button>
            </div>
          )}
        </div>
      );
    }

    // Abas de filtro do painel de QA: "all"/"critical"/"warning" filtram por
    // severidade, o resto filtra por `issue.type` específico. A ordem aqui é
    // a ordem de exibição dos chips.
    const QA_ISSUE_FILTERS = [
      ["all", "Todos"],
      ["critical", "Crítico"],
      ["warning", "Aviso"],
      ["missing-code", "Código ausente"],
      ["wrong-language", "Não está em português"],
      ["odd-chars", "Caractere estranho"],
      ["leaked-marker", "Marcador vazado"],
      ["invented-code", "Código inventado"],
      ["line-mismatch", "Linhas diferentes"],
      ["glossary-mismatch", "Glossário"],
      ["translation-failed", "Falha do motor"],
      ["coherence-low", "Coerência baixa (IA)"],
    ];

    // Um problema de QA, em formato de cartão: original em cima, tradução
    // editável embaixo (igual ao cartão normal de tradução), e os
    // problemas encontrados numa coluna à parte à direita, com largura
    // própria — pedido do usuário depois que a nota de coerência ficava
    // cortada dividindo espaço com a tradução na grade apertada de antes.
    // Corrigir a tradução AQUI MESMO (sem precisar ir até o cartão) é o
    // outro pedido: onChangeTranslation/onBlurTranslation são os mesmos
    // handlers que o cartão normal usa (setTranslation/handleTranslationBlur),
    // só que aplicados a partir do painel de QA.
    const QaItemCard = React.memo(function QaItemCard({
      item,
      multiDoc,
      onJump,
      onIgnore,
      onRepairCodes,
      onClearTranslation,
      canRepair,
      onChangeTranslation,
      onBlurTranslation,
    }) {
      const [value, setValue] = React.useState(item.translation);
      // Sincroniza quando o ITEM muda vindo de fora (ex: "reinserir código"
      // altera o texto e dispara um novo scan; ou a linha foi editada em
      // outra aba/painel) — sem isto, a caixa de texto continuaria
      // mostrando o valor antigo depois de uma ação que mexeu no texto por
      // outro caminho que não a digitação aqui.
      React.useEffect(() => { setValue(item.translation); }, [item.translation]);

      const isCritical = item.issues.some((i) => i.severity === "critical");

      const handleChange = (ev) => {
        setValue(ev.target.value);
        onChangeTranslation(item.docId, item.ref, ev.target.value);
      };
      const handleBlur = () => {
        if (onBlurTranslation) onBlurTranslation(item.docId, item.ref);
      };

      return (
        <div className="qa-card">
          <div className="qa-card-head">
            {multiDoc && <span className="file-tab-project">{item.fileName}</span>}
            <span className="ref mono">{item.ref}</span>
            <span
              className={isCritical ? "memory-badge" : "verified-badge"}
              // mesma dupla vermelho/verde de .fail-badge e .qa-issue-box.critical,
              // já calibrada pro fundo CLARO deste cartão — o tom terracota usado
              // no resto do app (dark theme) ficava com contraste baixo aqui.
              style={isCritical ? { color: "#A6242E", background: "rgba(166,36,46,0.14)", borderColor: "rgba(166,36,46,0.4)" } : undefined}
            >
              {isCritical ? "crítico" : "aviso"}
            </span>
            <button className="btn subtle btn-xs" style={{ marginLeft: "auto" }} onClick={() => onJump(item)} title="Ir para esta linha">
              <Search size={12} /> ir
            </button>
          </div>

          <div className="qa-card-main">
            <div className="field-label">Original</div>
            <p className="original-text">{item.original}</p>
            <div className="field-label">Tradução</div>
            <textarea
              className="translation-area"
              rows={2}
              value={value}
              onChange={handleChange}
              onBlur={handleBlur}
            />
          </div>

          <div className="qa-card-side">
            {item.issues.map((iss, i) => (
              <div key={i} className={`qa-issue-box ${iss.severity === "critical" ? "critical" : ""}`}>
                <div className="qa-issue-box-detail">
                  <AlertCircle size={12} />
                  <span>{iss.detail}</span>
                </div>
                <div className="qa-issue-box-actions">
                  {iss.severity !== "critical" && onIgnore && (
                    <button
                      className="btn subtle btn-xs"
                      onClick={() => onIgnore(item, iss)}
                      title="Ignorar este aviso nesta linha (não afeta itens críticos — esses nunca podem ser ignorados)"
                    >
                      <Ban size={10} /> ignorar
                    </button>
                  )}
                  {/* Item CRÍTICO nunca pode ser "ignorado" — mas agora tem
                      duas saídas concretas em vez de só o aviso. "reinserir
                      código" só aparece quando o reparo automático consegue
                      devolver TODOS os códigos com segurança (ver
                      repairMissingCodes); quando os códigos ficam no meio
                      da fala não dá pra inferir posição, e aí a saída
                      honesta é apagar e traduzir de novo (ou corrigir à
                      mão, agora que dá pra fazer isso direto aqui). */}
                  {((iss.severity === "critical" && (iss.type === "missing-code" || iss.type === "wrong-language")) || iss.type === "coherence-low") && (
                    <React.Fragment>
                      {iss.type === "missing-code" && onRepairCodes && (canRepair ? canRepair(item) : canRepairMissingCodes(item.original, item.translation)) && (
                        <button
                          className="btn subtle btn-xs"
                          onClick={() => onRepairCodes(item)}
                          title="Recoloca os códigos do jogo que sumiram, nas mesmas pontas em que estavam no original. Só aparece quando dá pra fazer isso com segurança."
                        >
                          <WrapText size={10} /> reinserir código
                        </button>
                      )}
                      {onClearTranslation && (
                        <button
                          className="btn danger subtle btn-xs"
                          onClick={() => onClearTranslation(item)}
                          title={
                            iss.type === "coherence-low"
                              ? 'Apaga esta tradução (reprovada pelo revisor de IA) pra ela voltar a ficar pendente e entrar no próximo lote de tradução automática'
                              : "Apaga a tradução desta linha pra ela voltar a ficar pendente e ser traduzida de novo"
                          }
                        >
                          <Trash2 size={10} /> {iss.type === "coherence-low" ? "reenviar para tradução" : "apagar tradução"}
                        </button>
                      )}
                    </React.Fragment>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    });

    // ---------------------------------------------------------------------------
    // Editor de Cenas (Fase 2 do app Windows) — abre o MESMO .xlsx que já foi

    //  1) Sempre funciona: ler os parâmetros, editar, baixar o .xlsx editado

    function isTauriRuntime() {
      return typeof window !== "undefined" && !!window.__TAURI__;
    }

    function SceneParamField({ param, onChange }) {
      const editable = isEditableSceneParamType(param.type);
      if (!editable) {
        const pointerTarget = param.type === "pointer" ? parseScenePointerTarget(param.value) : null;
        return (
          <div className="scene-param scene-param-readonly" title={`tipo "${param.type}" — estrutura/fórmula, não editável`}>
            <div className="scene-param-label">{param.type}</div>
            <div className="scene-param-value mono">
              {pointerTarget ? `→ linha ${pointerTarget.row}` : param.value === "" || param.value === null || param.value === undefined ? "—" : String(param.value)}
            </div>
          </div>
        );
      }
      const isFloat = param.type === "float";
      const isIntLike = param.type === "byte" || param.type === "short" || param.type === "int" || param.type === "bytearray";
      const isBigText = param.type === "dialog" || (param.type === "string" && typeof param.value === "string" && param.value.length > 20);
      return (
        <div className="scene-param">
          <div className="scene-param-label">{param.type}</div>
          {isBigText ? (
            <textarea
              className="scene-param-input scene-param-textarea mono"
              rows={2}
              value={param.value == null ? "" : param.value}
              onChange={(e) => onChange(param.col, e.target.value)}
            />
          ) : isFloat || isIntLike ? (
            <input
              type="number"
              step={isFloat ? "any" : 1}
              className="scene-param-input mono"
              value={param.value == null ? 0 : param.value}
              onChange={(e) => {
                const raw = e.target.value;
                const num = isFloat ? parseFloat(raw) : parseInt(raw, 10);
                onChange(param.col, Number.isNaN(num) ? 0 : num);
              }}
            />
          ) : (
            <input
              type="text"
              className="scene-param-input mono"
              value={param.value == null ? "" : param.value}
              onChange={(e) => onChange(param.col, e.target.value)}
            />
          )}

      );

    function QaPanel({ results, multiDoc, onJump, onIgnore, onRepairCodes, onClearTranslation, canRepair, onChangeTranslation, onBlurTranslation }) {
      const [page, setPage] = React.useState(1);
      const [issueFilter, setIssueFilter] = React.useState("all");
      const PAGE_SIZE = 15;

      React.useEffect(() => { setPage(1); }, [results, issueFilter]);
      // se o filtro ativo ficou sem nenhum item (ex: ignorou o último aviso
      // daquele tipo), volta pra "Todos" sozinho em vez de mostrar vazio
      React.useEffect(() => {
        if (issueFilter === "all") return;
