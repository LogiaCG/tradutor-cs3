      // no filtro de pendentes — o que dava a impressão de trabalho
      // faltando que nunca ia diminuir. Marcar como ignorada resolve os
      // dois: some da conta e some da lista.
      const ignorePortugueseOriginals = () => {
        const scopedDocs = batchScope === "all" ? docsRef.current : docsRef.current.filter((d) => d.id === activeId);
        const targets = [];
        for (const doc of scopedDocs) {
          for (const e of doc.entries) {
            if (doc.ignored[e.ref]) continue;
            if ((doc.translations[e.ref] || "").trim()) continue; // já tem tradução: não mexe
            if (e.lang !== "pt") continue;
            targets.push({ docId: doc.id, ref: e.ref });
          }
        }
        if (targets.length === 0) {
          notify("Nenhuma linha pendente com o original já em português.", "info");
          return;
        }
        if (!window.confirm(
          `Marcar ${targets.length} linha(s) como ignorada(s)?\n\n` +
          "São linhas cujo ORIGINAL já está em português — o lote automático já as pulava, " +
          "mas elas continuavam contando como pendentes. Marcando como ignoradas, elas somem da conta e da lista.\n\n" +
          "Dá pra desfazer com Ctrl+Z, e elas continuam saindo normalmente na exportação."
        )) return;

        pushUndoSnapshot(`Ignorar originais em português (${targets.length})`, [...new Set(targets.map((t) => t.docId))]);
        // Escreve direto em vez de chamar toggleIgnored: aquele dispara a
        // checagem de duplicatas, que abre um confirm A CADA linha — num
        // lote de centenas viraria uma fila interminável de diálogos. Aqui
        // já estamos agindo em massa e com confirmação única, então a
        // pergunta por duplicata não faz sentido.
        const porDoc = new Map();
        for (const t of targets) {
          if (!porDoc.has(t.docId)) porDoc.set(t.docId, []);
          porDoc.get(t.docId).push(t.ref);
        }
        for (const [docId, refs] of porDoc.entries()) {
          updateDoc(docId, (d) => {
            const ignored = { ...d.ignored };
            for (const ref of refs) ignored[ref] = true;
            const next = { ...d, ignored };
            scheduleSave(next);
            return next;
          });
        }
        notify(`${targets.length} linha(s) já em português marcada(s) como ignorada(s).`, "ok");
      };

      // Versão em massa do reparo: passa por todos os críticos de código
      // ausente do resultado atual e conserta os que dá. Os que não dá ficam
      // como estão e são relatados no fim — nunca "conserta" na marra.
      const bulkRepairMissingCodes = () => {
        if (!qaResults) return;
        const targets = qaResults.items.filter((it) =>
          it.issues.some((i) => i.severity === "critical" && i.type === "missing-code")
        );
        if (targets.length === 0) {
          notify("Nenhum código do jogo ausente pra reinserir no resultado atual.", "err");
          return;
        }
        const repairable = targets.filter((it) => canRepairMissingCodes(it.original, it.translation));
        if (repairable.length === 0) {
          notify(
            `Nenhuma das ${targets.length} linha(s) crítica(s) pode ser reparada automaticamente: em todas elas o código fica no meio da fala, ` +
            "onde não dá pra saber a posição certa no texto traduzido. Use \"apagar tradução\" nelas e traduza de novo."
          , "ok");
          return;
        }
        if (!window.confirm(
          `Reinserir os códigos do jogo em ${repairable.length} de ${targets.length} linha(s) crítica(s)?\n\n` +
          "Os códigos voltam exatamente pras pontas em que estavam no original. " +
          (targets.length > repairable.length
            ? `As outras ${targets.length - repairable.length} têm código no meio da fala e não dá pra reinserir com segurança — elas ficam como estão.`
            : "")
        )) return;

        pushUndoSnapshot(`Reinserir códigos em massa (${repairable.length})`, [...new Set(repairable.map((t) => t.docId))]);
        let done = 0;
        for (const item of repairable) {
          const doc = docsRef.current.find((d) => d.id === item.docId);
          const entry = doc && doc.entries.find((e) => e.ref === item.ref);
          if (!doc || !entry) continue;
          const result = repairMissingCodes(entry.original, doc.translations[item.ref] || "");
          if (result.fixed && result.changed) {
            setTranslation(item.docId, item.ref, result.text, { keepVerified: true });
            done += 1;
          }
        }
        runQaScan(qaResults.scope);
        notify(`${done} linha(s) reparada(s).${targets.length > done ? ` ${targets.length - done} continua(m) crítica(s) — nelas o código fica no meio da fala; apague a tradução e traduza de novo.` : ""}`, "ok");
      };

      useEffect(() => {
        if (!jumpTarget) return;
        const idx = filtered.findIndex((e) => e.ref === jumpTarget);
        if (idx === -1) {
          setJumpTarget(null);
          return;
        }
        const targetPage = Math.floor(idx / pageSize) + 1;
        setPage(targetPage);
        const t = setTimeout(() => {
          const el = document.getElementById(`card-${jumpTarget}`);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            const ta = el.querySelector(".translation-area");
            if (ta) ta.focus();
          }
          setJumpTarget(null);
        }, 150);
        return () => clearTimeout(t);
      }, [jumpTarget, filtered, pageSize]);

      // conta só o que é acionável no app (diálogo); texto/UI é ignorado aqui
      // de propósito porque só existe na planilha exportada.
      //
      // Cacheado por REFERÊNCIA do doc: como updateDoc só troca o objeto do
      // arquivo que mudou (os outros continuam com a mesma referência entre
      // renders), a maioria das chamadas aqui vira O(1) — só o arquivo
      // realmente editado recalcula a contagem. Sem isso, cada tecla digitada
      // relia TODAS as entradas de TODOS os arquivos abertos só pra desenhar
      // a barra lateral.
      const fileStatsCacheRef = useRef(new WeakMap());
      const fileStatsFor = useCallback((doc) => {
        const cache = fileStatsCacheRef.current;
        const cached = cache.get(doc);
        if (cached !== undefined) return cached;
        let pending = 0, done = 0, verified = 0;
        for (const e of doc.entries) {
          if (doc.ignored[e.ref]) continue;
          const isVerified = !!doc.verified[e.ref];
          const isDone = (doc.translations[e.ref] || "").trim().length > 0;
          if (isVerified) verified += 1;
          else if (isDone) done += 1;
          else pending += 1;
        }
        const stats = { pending, done, verified };
        cache.set(doc, stats);
        return stats;
      }, []);

      const totalPendingAll = docs.reduce((s, d) => s + fileStatsFor(d).pending, 0);

      const renderPagination = (position) => (
        <div className={`pagination pagination-${position}`}>
          <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={safePage <= 1} aria-label="Página anterior">
            <ChevronLeft size={14} />
          </button>
          <span>página {safePage} de {totalPages} · {filtered.length} itens</span>
          <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={safePage >= totalPages} aria-label="Próxima página">
            <ChevronRight size={14} />
          </button>
          {position === "top" && totalPages > 1 && (
            <select
              className="page-jump-select"
              value={safePage}
              onChange={(e) => setPage(Number(e.target.value))}
              aria-label="Ir para página"
            >
              {Array.from({ length: totalPages }, (_, i) => i + 1).map((n) => (
                <option key={n} value={n}>ir p/ pág. {n}</option>
              ))}
            </select>
          )}
        </div>
      );

      // Paginação da busca em todo o projeto (auditoria 3.3) — mesmo
      // padrão visual/comportamental de renderPagination, mas sobre
      // projectSearchResults.results em vez de "filtered".
      const renderProjectSearchPagination = (position) => (
        <div className={`pagination pagination-${position}`}>
          <button onClick={() => setProjectSearchPage((p) => Math.max(1, p - 1))} disabled={projectSearchSafePage <= 1} aria-label="Página anterior">
            <ChevronLeft size={14} />
          </button>
          <span>página {projectSearchSafePage} de {projectSearchTotalPages} · {projectSearchResults ? projectSearchResults.results.length : 0} itens</span>
          <button onClick={() => setProjectSearchPage((p) => Math.min(projectSearchTotalPages, p + 1))} disabled={projectSearchSafePage >= projectSearchTotalPages} aria-label="Próxima página">
            <ChevronRight size={14} />
          </button>
          {position === "top" && projectSearchTotalPages > 1 && (
            <select
              className="page-jump-select"
              value={projectSearchSafePage}
              onChange={(e) => setProjectSearchPage(Number(e.target.value))}
              aria-label="Ir para página"
            >
              {Array.from({ length: projectSearchTotalPages }, (_, i) => i + 1).map((n) => (
                <option key={n} value={n}>ir p/ pág. {n}</option>
              ))}
            </select>
          )}
        </div>
      );

      const projectBarJsx = (
        <div className="project-bar">
          <Folder size={13} />
          <span>Projeto:</span>
          <input
            list="project-options"
            className="project-input"
            value={activeProject}
            onChange={(e) => changeActiveProject(e.target.value)}
            placeholder="ex: CS3, CS4, Outro Jogo..."
            title="Arquivos com o mesmo nome (ex: a0000.xlsx) de jogos diferentes não se misturam se estiverem em projetos diferentes. A memória de tradução continua valendo pra todos os projetos."
          />
          <datalist id="project-options">
            {knownProjects.map((p) => (<option key={p} value={p} />))}
          </datalist>
          <button className="rename-project-btn" onClick={handleRenameProjectClick} title="Renomear este projeto (atualiza os arquivos já abertos dele)">
            <PencilLine size={12} /> renomear
          </button>
          <span className="project-hint">arquivos novos entram neste projeto</span>
        </div>
      );

      return (
        <div className={`app-root${density === "compact" ? " density-compact" : ""}`}>
          <ToastStack />
          <div className="shell">
            {saveError && (
              <div className="save-error-banner" role="alert">
                <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 2 }} />
                <div>
                  <strong>Seu progresso não está sendo salvo.</strong> {saveError.message}
                  {" "}Exporte agora pra não perder o que já fez
                  {saveError.quota
                    ? " e feche arquivos que não estiver usando pra liberar espaço."
                    : "."}
                  <div className="save-error-detail">chave: {saveError.fileName}</div>
                </div>
              </div>
            )}
            <div className="masthead">
              <div>

                                  {doc.fileName}
                                  <button
                                    className="project-result-open"
                                    onClick={() => { setActiveId(doc.id); setFilter("all"); setProjectSearch(false); }}
                                    title="Abrir este arquivo na visão normal, mantendo a busca"
                                  >
                                    abrir arquivo →
                                  </button>
                                </div>
                                <EntryCard
                                  entry={e}
                                  docId={doc.id}
                                  translationValue={doc.translations[e.ref] || ""}
                                  isIgnored={!!doc.ignored[e.ref]}
                                  isAuto={!!doc.autoTranslated[e.ref]}
                                  isFailed={!!doc.translationFailed[e.ref]}
                                  isFromMemory={!!doc.fromMemory[e.ref]}
                                  isVerified={!!doc.verified[e.ref]}
                                  onToggleIgnored={toggleIgnored}
                                  onToggleVerified={toggleVerified}
                                  onChangeTranslation={setTranslation}
                                  onBlurTranslation={handleTranslationBlur}
                                  onWrapLines={wrapEntryLines}
                                  memory={translationMemory}
                                  properNouns={properNouns}
                                  onFocusNext={focusNextCard}
                                />
                              </div>
                            ))}
                            </div>
                            {renderProjectSearchPagination("bottom")}
                          </React.Fragment>
                        )}
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        {filtered.length > 0 && renderPagination("top")}

                        {visible.length === 0 ? (
                          <div className="empty-state">Nenhum item encontrado com esse filtro.</div>
                        ) : (
                          <div className="cards">
                            {visible.map((e, idx) => (
                              <EntryCard
                                key={e.id}
                                entry={e}
                                docId={activeDoc.id}
                                translationValue={activeDoc.translations[e.ref] || ""}
                                isIgnored={!!activeDoc.ignored[e.ref]}
                                isAuto={!!activeDoc.autoTranslated[e.ref]}
                                isFailed={!!activeDoc.translationFailed[e.ref]}
                                isFromMemory={!!activeDoc.fromMemory[e.ref]}
                                isVerified={!!activeDoc.verified[e.ref]}
                                position={(safePage - 1) * pageSize + idx + 1}
                                total={filtered.length}
                                onToggleIgnored={toggleIgnored}
                                onToggleVerified={toggleVerified}
                                onChangeTranslation={setTranslation}
                                onBlurTranslation={handleTranslationBlur}
                                onWrapLines={wrapEntryLines}
                                memory={translationMemory}
                                properNouns={properNouns}
                                onFocusNext={focusNextCard}
                              />
                            ))}
                          </div>
                        )}

                        {renderPagination("bottom")}
                      </React.Fragment>
                    )}
                    </React.Fragment>
                  )}
                </main>
                {/* Coluna da direita = SAÍDA. Diferente dos painéis, o bloco
                    de download fica sempre visível: é a ação de destino do
                    trabalho todo, e ter que abrir um painel pra chegar nela
                    era um passo a mais sem motivo. */}
                <aside className="sidebar-right">
                  {activeDoc && (
                    <div className="download-bar">
                      <span className="download-bar-label"><FileDown size={13} /> Baixar</span>
                      <div className="download-bar-primary">
                        <button className="btn primary" onClick={() => exportTranslated(activeDoc)} disabled={!!exportAllProgress}>
                          <FileDown size={13} /> Arquivo traduzido (.xlsx)
                        </button>
                        <button
                          className="btn"
                          onClick={() => exportTranslated(activeDoc, { onlyVerified: true })}
                          disabled={!!exportAllProgress}
                          title="Só grava as linhas marcadas como verificadas — o resto sai como no original"
                        >
                          <ShieldCheck size={13} /> Só verificados (.xlsx)
                        </button>
                        {docs.length > 1 && (
                          <button className="btn primary" onClick={() => exportAllTranslated()} disabled={!!exportAllProgress}>
                            <FileDown size={13} /> Baixar todos ({docs.length} arquivos)
                          </button>
                        )}
                        {docs.length > 1 && (
                          <button
                            className="btn"
                            onClick={() => exportAllTranslated({ onlyVerified: true })}
                            disabled={!!exportAllProgress}
                            title="Em todos os arquivos, só grava as linhas verificadas — o resto sai como no original"
                          >
                            <ShieldCheck size={13} /> Todos — só verificados
                          </button>
                        )}
                        {exportAllProgress && (
                          <span className="download-bar-progress">
                            {savedDirName ? "Salvando" : "Compactando"} {exportAllProgress.done}/{exportAllProgress.total}...
                          </span>
                        )}
                      </div>
                      <div className="download-bar-extra">
                        {activeDoc.lastBatch.length > 0 && !batchRunning && (
                          <button className="btn subtle" onClick={() => exportBatchReport(activeDoc)} title="Planilha com só as linhas traduzidas no último lote automático">
                            <ClipboardList size={13} /> Relatório do lote
                          </button>
                        )}
                        <button className="btn subtle" onClick={() => exportWorklist(activeDoc)} title="Planilha de revisão: célula, location, texto original e tradução lado a lado">
                          <Download size={13} /> Lista para traduzir
                        </button>
                        <button className="btn subtle" onClick={exportGlossary} title="Referência dos códigos de controle do jogo encontrados (.txt)">
                          <AlertCircle size={13} /> Glossário de códigos
                        </button>
                        <button className="btn subtle" onClick={exportTermsGlossary} title="Lista de nomes/termos com tradução fixa (.txt)">
                          <UserCheck size={13} /> Glossário de termos
                        </button>
                      </div>
                      {!savedDirName && docs.length > 1 && !exportAllProgress && (
                        <div className="download-bar-hint">
                          Sem pasta fixa escolhida: "Baixar todos" sai num único .zip. Prefere gravar direto sem diálogo nenhum?{" "}
                          <button className="link-btn" onClick={() => togglePanel("settings")}>Escolher pasta fixa</button>.
                        </div>
                      )}
                    </div>
                  )}
                  {activePanel === "collab" && (
                    <div className="settings-panel">
                      <div className="settings-row" style={{ alignItems: "center" }}>
                        <button className="btn" onClick={() => exportProjectState("file")}>
                          <FileJson size={13} /> Exportar estado — este arquivo
                        </button>
                        {docs.length > 1 && (
                          <button className="btn" onClick={() => exportProjectState("all")}>
                            <FileJson size={13} /> Exportar estado — todos abertos
                          </button>
                        )}
                        <label className="btn" style={{ cursor: "pointer" }}>
                          <FileJson size={13} /> Importar estado (.json)
                          <input
                            type="file"
                            accept=".json"
                            className="hidden-input"
                            onChange={(e) => {
                              const f = e.target.files && e.target.files[0];
                              if (f) importProjectState(f);
                              e.target.value = "";
                            }}
                          />
                        </label>
                      </div>
                      <div className="settings-note">
                        Pra dividir o trabalho com outra pessoa: exporte o estado (tradução, ignorado, verificado,
                        memória e glossário — bem mais leve que o .xlsx inteiro) e mande pra ela importar aqui. Só
                        mescla arquivos que estão abertos dos dois lados (mesmo projeto + mesmo nome de arquivo).
                        Linha vazia aqui recebe a tradução importada direto; linha igual só funde o selo de
                        verificado; linha DIFERENTE nos dois lados vira conflito — você decide qual manter, uma por
                        uma, sem sobrescrever nada sozinho.
                      </div>
                      {importSummary && (
                        <React.Fragment>
                          <div className="settings-note" style={{ marginTop: 4 }}>
                            Último import: {importSummary.filledCount} linha(s) preenchida(s), {importSummary.mergedFlagsCount} selo(s)
                            mesclado(s), {importSummary.memoryAdded} termo(s) novo(s) na memória, {importSummary.termsAdded} termo(s)
                            novo(s) no glossário
                            {importSummary.notOpenCount > 0 ? `, ${importSummary.notOpenCount} linha(s) ignorada(s) de arquivo(s) que você não tem aberto` : ""}.
                          </div>
                          <ConflictsPanel conflicts={importSummary.conflicts} onResolve={resolveConflict} />
                        </React.Fragment>
                      )}
                    </div>
                  )}

                  {!activePanel && (
                    <div className="sidebar-right-empty">
                      <FolderCog size={22} style={{ opacity: 0.5 }} />
                      Memória, Glossário, Verificar qualidade e Motor abrem na coluna do meio,
                      que é mais larga. Aqui ficam as saídas: baixar arquivos e colaboração.
                    </div>
                  )}
                </aside>
              </div>
            )}

            <div style={{ marginTop: 40, textAlign: "center", opacity: 0.35 }}>
              <BookOpen size={14} style={{ display: "inline", marginRight: 6, verticalAlign: 'middle' }} />
              <span className="mono u-micro-inline">
                progresso salvo automaticamente neste navegador
              </span>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<TranslationVerifier />);
  </script>
</body>
</html>
