        const stillHasAny = results.some((r) => matchesQaFilter(r, issueFilter));
        if (!stillHasAny) setIssueFilter("all");
      }, [results, issueFilter]);

      function matchesQaFilter(r, filterKey) {
        if (filterKey === "all") return true;
        if (filterKey === "critical") return r.issues.some((i) => i.severity === "critical");
        if (filterKey === "warning") return r.issues.some((i) => i.severity !== "critical");
        return r.issues.some((i) => i.type === filterKey);
      }

      const counts = React.useMemo(() => {
        const c = {};
        for (const [key] of QA_ISSUE_FILTERS) {
          c[key] = key === "all" ? results.length : results.filter((r) => matchesQaFilter(r, key)).length;
        }
        return c;
      }, [results]);

      const filteredResults = React.useMemo(() => {
        if (issueFilter === "all") return results;
        return results
          .map((r) => {
            const issues = r.issues.filter((i) =>
              issueFilter === "critical" ? i.severity === "critical" :
              issueFilter === "warning" ? i.severity !== "critical" :
              i.type === issueFilter
            );
            return issues.length > 0 ? { ...r, issues } : null;
          })
          .filter(Boolean);
      }, [results, issueFilter]);

      const criticalCount = counts.critical;
      const warningCount = counts.warning;

      if (results.length === 0) {
        return (
          <div className="empty-state" style={{ padding: "20px 0" }}>
            <CheckCircle2 size={16} color="#74915E" style={{ marginBottom: 6 }} /><br />
            Nenhum problema encontrado no escopo verificado. 🎉
          </div>
        );
      }

      const totalPages = Math.max(1, Math.ceil(filteredResults.length / PAGE_SIZE));
      const safePage = Math.min(page, totalPages);
      const visible = filteredResults.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

      return (
        <div>
          <div className="settings-note" style={{ marginBottom: 10 }}>
            {criticalCount > 0 && (
              <strong style={{ color: "#C98A6E" }}>{criticalCount} crítico(s) (código do jogo ausente/alterado — pode quebrar o jogo)</strong>
            )}
            {criticalCount > 0 && warningCount > 0 && " · "}
            {warningCount > 0 && <span>{warningCount} aviso(s) (revisão recomendada, não quebra o jogo)</span>}
          </div>
          <div className="chips" style={{ marginBottom: 12 }}>
            {QA_ISSUE_FILTERS.filter(([key]) => key === "all" || counts[key] > 0).map(([key, label]) => (
              <button
                key={key}
                className={`chip ${issueFilter === key ? "active" : ""}`}
                onClick={() => setIssueFilter(key)}
              >
                {label} ({counts[key]})
              </button>
            ))}
          </div>
          {filteredResults.length === 0 ? (
            <div className="empty-state" style={{ padding: "16px 0" }}>Nenhum item nesta aba.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {visible.map((item) => (
                <QaItemCard
                  key={`${item.docId}:${item.ref}`}
                  item={item}
                  multiDoc={multiDoc}
                  onJump={onJump}
                  onIgnore={onIgnore}
                  onRepairCodes={onRepairCodes}
                  onClearTranslation={onClearTranslation}
                  canRepair={canRepair}
                  onChangeTranslation={onChangeTranslation}
                  onBlurTranslation={onBlurTranslation}
                />
              ))}
            </div>
          )}
          {totalPages > 1 && (
            <div className="pagination" style={{ marginTop: 12 }}>
              <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={safePage <= 1} aria-label="Página anterior"><ChevronLeft size={14} /></button>
              <span>página {safePage} de {totalPages} · {filteredResults.length} linha(s) nesta aba</span>
              <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={safePage >= totalPages} aria-label="Próxima página"><ChevronRight size={14} /></button>
            </div>
          )}
        </div>
      );
    }

    function MemoryList({ memory, search, onForget }) {
      const [page, setPage] = React.useState(1);
      const PAGE_SIZE = 15;
      const q = search.trim().toLowerCase();
      const entries = Object.entries(memory)
        .filter(([original, data]) => !q || original.toLowerCase().includes(q) || data.translation.toLowerCase().includes(q))
        .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

      React.useEffect(() => { setPage(1); }, [search]);

      if (entries.length === 0) {
        return <div className="empty-state" style={{ padding: "20px 0" }}>Nenhum termo aprendido ainda. Traduza algo e saia do campo — o app aprende sozinho.</div>;
      }

      const totalPages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
      const safePage = Math.min(page, totalPages);
      const visible = entries.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

      return (
        <div>
          <div className="memory-list">
            {visible.map(([original, data]) => (
              <div className="memory-item" key={original}>
                <div className="memory-item-original">{original}</div>
                <div className="memory-item-arrow">→</div>
                <div className="memory-item-translation">{data.translation}</div>
                {data.verified ? (
                  <span className="verified-badge" title="Aprovada por você"><ShieldCheck size={11} /> verificado</span>
                ) : (
                  <span className="memory-badge" style={{ color: "#BE6A4B", background: "rgba(190,106,75,0.12)", borderColor: "rgba(190,106,75,0.4)" }} title="Ainda não foi revisada/aprovada">
                    <AlertCircle size={11} /> não verificado
                  </span>
                )}
                <button className="memory-item-forget" onClick={() => onForget(original)} title="Esquecer este termo" aria-label={`Esquecer o termo "${original}"`}>
                  <XIcon size={12} />
                </button>
              </div>
            ))}
          </div>
          {totalPages > 1 && (
            <div className="pagination" style={{ marginTop: 12 }}>
              <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={safePage <= 1} aria-label="Página anterior"><ChevronLeft size={14} /></button>
              <span>página {safePage} de {totalPages} · {entries.length} termos</span>
              <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={safePage >= totalPages} aria-label="Próxima página"><ChevronRight size={14} /></button>
            </div>
          )}
        </div>
      );
    }

    // Some sozinho depois de um tempo proporcional ao tamanho da mensagem
    // (dá tempo de ler um relatório de importação sem prender um "ok, li"
    // pra uma frase curta). Erros ficam até a pessoa fechar.
    function ToastStack() {
      const [toasts, setToasts] = React.useState([]);

      React.useEffect(() => toastBus.subscribe((t) => {
        setToasts((cur) => [...cur, t]);
        if (t.kind !== "err") {
          const ms = Math.min(12000, 3500 + t.message.length * 28);
          setTimeout(() => setToasts((cur) => cur.filter((x) => x.id !== t.id)), ms);
        }
      }), []);

      const dismiss = (id) => setToasts((cur) => cur.filter((x) => x.id !== id));
      if (toasts.length === 0) return null;

      return (
        <div className="toast-stack" aria-live="polite" aria-atomic="false">
          {toasts.map((t) => (
            <div key={t.id} className={`toast ${t.kind}`} role={t.kind === "err" ? "alert" : "status"}>
              {t.kind === "err" ? <AlertCircle size={14} style={{ flexShrink: 0, marginTop: 2 }} />
                : t.kind === "ok" ? <CheckCircle2 size={14} style={{ flexShrink: 0, marginTop: 2 }} />
                : <Info size={14} style={{ flexShrink: 0, marginTop: 2 }} />}
              <span>{t.message}</span>
              <button className="toast-close" onClick={() => dismiss(t.id)} aria-label="Fechar aviso">×</button>
            </div>
          ))}
        </div>
      );
    }

    function TranslationVerifier() {
      const [docs, setDocs] = useState([]); // {id, fileName, entries, translations, ignored, autoTranslated, lastBatch}
      const [activeId, setActiveId] = useState(null);
      const [filter, setFilter] = useState("all");
      const [search, setSearch] = useState("");
      const [page, setPage] = useState(1);
      const [pageSize, setPageSize] = useState(20);
      const [jumpTarget, setJumpTarget] = useState(null); // ref da linha pra rolar até assim que aparecer na página certa
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      // Falha de gravação (auditoria #2 C1). Fica separado de `error` porque
      // não é um erro de uma ação pontual: é um estado PERSISTENTE de "seu
      // trabalho não está sendo salvo", e some sozinho quando uma gravação
      // volta a dar certo.
      const [saveError, setSaveError] = useState(null);
      // 1.8: densidade dos cartões. Quem traduz do zero quer respiro pra ler;
      // quem revisa 5.000 linhas quer caber o máximo na tela.
      const [density, setDensity] = useState("comfortable"); // "comfortable" | "compact"
      const [dragOver, setDragOver] = useState(false);
      const [restoredNote, setRestoredNote] = useState(null);
      const [batchRunning, setBatchRunning] = useState(false);
      const [batchDone, setBatchDone] = useState(0);
      const [batchTotal, setBatchTotal] = useState(0);
      const [batchFailed, setBatchFailed] = useState(0);
      const [batchScope, setBatchScope] = useState("file"); // 'file' | 'filter' | 'all'
      const [lastErrorSample, setLastErrorSample] = useState(null);
      // Revisor de coerência (IA) — progresso próprio, separado do lote de
      // tradução (batchRunning/batchTotal/batchDone acima): são duas ações
      // independentes que podem, em tese, não rodar ao mesmo tempo (o botão
      // de revisar fica desabilitado enquanto um lote de tradução roda, e
      // vice-versa — ver JSX), mas reaproveitar as MESMAS variáveis faria a
      // barra de progresso de uma ação mostrar o rótulo da outra.
      const [reviewRunning, setReviewRunning] = useState(false);
      const [reviewDone, setReviewDone] = useState(0);
      const [reviewTotal, setReviewTotal] = useState(0);
      const [reviewFailed, setReviewFailed] = useState(0);
      const [lastReviewErrorSample, setLastReviewErrorSample] = useState(null);
      // Lotes enviados pra Message Batches API da Anthropic — assíncrono, o
      // resultado pode demorar minutos a até 24h. Guardado no IndexedDB pra
      // sobreviver a reload/fechar a aba enquanto o lote ainda está rodando.
      const [pendingBatchJobs, setPendingBatchJobs] = useState([]);
      const [checkingBatchJobs, setCheckingBatchJobs] = useState(false);
      // Painéis que abrem na coluna CENTRAL em vez da barra da direita.
      // A Memória entrou aqui porque cada item dela é um par
      // "original -> tradução" lado a lado, que não cabe bem em 350px.
      // Quando um deles está ativo, a coluna da direita não é renderizada e
      // o grid colapsa pra duas colunas (auditoria #2 M1).

      // item 3.3 auditoria UX: accordion exclusivo — um unico estado no lugar
      // de 5 booleanos independentes (antes dava pra abrir varios paineis ao
      // mesmo tempo, ex. settings + memoria + qa juntos).
      // null = nenhum painel aberto; string = qual painel esta aberto.
      const [activePanel, setActivePanel] = useState(null); // null | "settings" | "memory" | "properNouns" | "qa" | "collab"
      const togglePanel = (key) => setActivePanel((p) => (p === key ? null : key));

      // --- Editor de Cenas (Fase 2) -------------------------------------------
      // sceneModel: { functions, orphanInstructions, ws, sheetName } do doc
      // ATUALMENTE aberto no painel — recalculado quando o painel abre ou o
      // arquivo muda. As edições pendentes (ainda não baixadas/recompiladas)
      // ficam em sceneEdits, indexadas por "linha:coluna" — e TAMBÉM já
      // aplicadas dentro de sceneModel.functions[...].params pra o campo
      // mostrar o valor novo na hora, sem esperar salvar.
      const [sceneModel, setSceneModel] = useState(null);
      const [sceneEdits, setSceneEdits] = useState({}); // { "row:col": value }
      const [sceneSelectedFuncIndex, setSceneSelectedFuncIndex] = useState(null);
      const [sceneSearch, setSceneSearch] = useState("");
      const [sceneSaving, setSceneSaving] = useState(false);
      const [sceneRecompiling, setSceneRecompiling] = useState(false);
      const [sceneMessage, setSceneMessage] = useState(null);
      const [memorySearch, setMemorySearch] = useState("");
      // Projetos: cada arquivo pertence a um projeto (ex: "CS3", "CS4", "Outro Jogo").
      // O progresso salvo é isolado por projeto+nome de arquivo, pra dois jogos
      // diferentes com um arquivo "a0000.xlsx" cada não se misturarem. A memória
      // de tradução (glossário de termos) continua GLOBAL de propósito — vale
      // pra todos os projetos, já que é você aprendendo o vocabulário, não o
      // arquivo.
      //
      // Esses estados globais (projeto, memória, nomes próprios, config)
      // começam com valores padrão e são carregados de verdade do IndexedDB
      // logo depois do primeiro render (useEffect abaixo) — IndexedDB é
      // assíncrono, não dá pra ler de forma síncrona no useState como dava
      // com localStorage.
      const [activeProject, setActiveProject] = useState("Padrão");
      const [knownProjects, setKnownProjects] = useState(["Padrão"]);
      const [translationMemory, setTranslationMemory] = useState({});
      // Nomes próprios (personagens, lugares) — protegidos igual aos códigos
      // do jogo, nunca vão pro tradutor. Global, vale pra todos os projetos.
      const [properNouns, setProperNouns] = useState([]);
      const [qaResults, setQaResults] = useState(null); // {scope, generatedAt, multiDoc, items}
      const [pendingExport, setPendingExport] = useState(null); // { kind: 'one'|'all', doc?, options } — export bloqueada esperando decisão
      const [exportAllProgress, setExportAllProgress] = useState(null); // { done, total } — enquanto "baixar todos" está rodando
      const [importSummary, setImportSummary] = useState(null); // {filledCount, mergedFlagsCount, notOpenCount, memoryAdded, termsAdded, conflicts}
      const [newNounTerm, setNewNounTerm] = useState("");
      const [newNounTranslation, setNewNounTranslation] = useState("");
      const SETTINGS_DEFAULTS = {
        engine: "libretranslate",
        ltEndpoint: "http://localhost:5000/translate",
        ltApiKey: "",
        ltSource: "en",
        ltTarget: "pt",
        llmProvider: "anthropic",
        llmApiKey: "",
        llmModel: "",
        openaiBaseUrl: "", // endpoint compatível com OpenAI — vazio = api.openai.com; preencha pra apontar pra Ollama/LM Studio/etc rodando local
        openaiNumCtx: 8192, // Ollama: tamanho da janela de contexto (num_ctx) — só é enviado quando openaiBaseUrl está preenchido
        // "auto" = não manda service_tier nenhum (padrão da conta). "priority"
        // = latência menor e mais previsível, custa mais caro por token.
        // "flex" = mais barato, porém mais lento e pode ficar indisponível em
        // horário de pico. Só vale pra API oficial da OpenAI.
        openaiServiceTier: "auto",
        // Ajustes de servidor LOCAL (Ollama/LM Studio). Os padrões são os
        // mesmos valores que já estavam fixos no código — quem não mexer
        // não percebe diferença nenhuma.
        // true = usa /api/chat (nativa) em vez de /v1/chat/completions. É o
        // padrão porque só assim num_ctx e keep_alive são respeitados de
        // verdade; desligue se o seu servidor local NÃO for Ollama (LM
        // Studio, vLLM etc. só entendem o dialeto compatível).
        openaiUseOllamaNative: true,
        openaiKeepAlive: "30m",       // quanto tempo o Ollama segura o modelo carregado
        openaiLocalConcurrency: 1,    // subir só se OLLAMA_NUM_PARALLEL > 1
        openaiLocalBatchSize: 10,     // linhas por requisição
        // "auto" = escolhe sozinho o menor esforço de raciocínio que o modelo
        // configurado aceita (ver openAiReasoningEffortFor). Só existe pros
        // modelos de raciocínio (gpt-5.x / série o).
        openaiReasoningEffort: "auto",
        rememberApiKey: true, // false = a chave só fica na memória desta aba (nunca gravada no IndexedDB)
        encryptApiKey: false, // true = a chave é criptografada (AES-GCM) antes de ir pro IndexedDB, com frase-senha da sessão
        // Fase 2 (Editor de Cenas): pasta onde já ficam o SenScriptsDecompiler.exe,
        // as .dll do Qt e o config.ini do usuário (o mesmo lugar de onde ele já
        // roda o converter_em_lote.bat hoje). Só é usada dentro do app Windows
        // (Tauri) — no navegador comum esse campo não faz nada.
        sceneDecompilerFolder: "",
      };
      const [settings, setSettings] = useState(SETTINGS_DEFAULTS);
      const [globalsLoaded, setGlobalsLoaded] = useState(false);
      // Os gravadores "dispara e esquece" (settings, glossário, memória,
      // projeto...) reportam falha nessa fila — sem isso, uma falha em
      // qualquer um deles voltaria a ser invisível.
      useEffect(() => {
        let alive = true;
        window.storage.get("cs3_density").then((r) => {
          if (alive && r && (r.value === "compact" || r.value === "comfortable")) setDensity(r.value);
        }).catch(() => {});
        return () => { alive = false; };
      }, []);

      useEffect(() => storageFailure.subscribe((f) => {
        if (!f) { setSaveError(null); return; }
        const isQuota = !!(f.error && (f.error.name === "QuotaExceededError" || /quota|space/i.test(f.error.message || "")));
        setSaveError({
          fileName: f.key,
          quota: isQuota,
          message: isQuota
            ? "O navegador ficou sem espaço pra gravar."
            : `O navegador recusou a gravação${f.error && f.error.message ? ` (${f.error.message})` : ""}.`,
        });
      }), []);
      // frase-senha de criptografia da chave — só vive em memória desta aba,
      // NUNCA é persistida (nem no IndexedDB, nem em lugar nenhum)
      const [apiKeyPassphrase, setApiKeyPassphrase] = useState("");
      const [encryptedKeyLocked, setEncryptedKeyLocked] = useState(false); // true = tem chave criptografada salva, ainda não desbloqueada nesta sessão
      const [unlockPassphraseInput, setUnlockPassphraseInput] = useState("");
      const [unlockError, setUnlockError] = useState(null);
      const encryptedKeyRef = useRef(null); // {cipher, iv, salt} carregado do storage, usado só na hora de desbloquear
      const [testingConn, setTestingConn] = useState(false);
      const [testResult, setTestResult] = useState(null);
      const [savedDirName, setSavedDirName] = useState(null); // nome da pasta escolhida pra downloads (exibição)
      const supportsDirPicker = typeof window !== "undefined" && !!window.showDirectoryPicker;

      // carrega tudo do IndexedDB (ou do localStorage antigo, se ainda não
      // migrou) uma vez, assim que o app abre
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const [proj, projList, mem, nouns, cfg, batchJobs] = await Promise.all([
              window.storage.get("cs3_active_project"),
              window.storage.get("cs3_projects_list"),
              window.storage.get("cs3_translation_memory"),
              window.storage.get("cs3_proper_nouns"),
              window.storage.get("cs3settings"),
              window.storage.get("cs3_batch_jobs"),
            ]);
            if (cancelled) return;
            if (proj && proj.value) setActiveProject(proj.value);
            if (projList && projList.value) {
              try {
                const list = JSON.parse(projList.value);
                setKnownProjects(list.includes("Padrão") ? list : ["Padrão", ...list]);
              } catch (e) {}
            }
            if (mem && mem.value) {
              try {
                const parsed = JSON.parse(mem.value);
                // termos salvos por uma versão antiga do app (antes da regra
                // "só memória verificada") não têm o campo `verified` — em vez
                // de confiar neles por padrão, marcamos como NÃO verificados;
                // dá pra revisar e aprovar de novo na aba Memória
                const migrated = {};
                for (const [key, data] of Object.entries(parsed)) {
                  migrated[key] = { ...data, verified: !!data.verified };
                }
                setTranslationMemory(migrated);
              } catch (e) {}
            }
            if (nouns && nouns.value) {
              try { setProperNouns(JSON.parse(nouns.value)); } catch (e) {}
            }
            if (cfg && cfg.value) {
              try {
                const parsedSettings = JSON.parse(cfg.value);
                if (parsedSettings.llmApiKeyEncrypted) {
                  // chave criptografada: guarda o blob pra desbloquear sob
                  // demanda, mas NÃO expõe settings.llmApiKey em texto puro
                  // até a frase-senha certa ser digitada nesta sessão
                  encryptedKeyRef.current = parsedSettings.llmApiKeyEncrypted;
                  setEncryptedKeyLocked(true);
                  setSettings({ ...SETTINGS_DEFAULTS, ...parsedSettings, llmApiKey: "" });
                } else {
                  setSettings({ ...SETTINGS_DEFAULTS, ...parsedSettings });
                }
              } catch (e) {}
            }
            if (batchJobs && batchJobs.value) {
              try { setPendingBatchJobs(JSON.parse(batchJobs.value)); } catch (e) {}
            }
          } catch (e) {
            console.error("Falha ao carregar dados salvos:", e);
          } finally {
            if (!cancelled) setGlobalsLoaded(true);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!globalsLoaded) return; // evita gravar os valores padrão por cima do que acabou de carregar
        if (encryptedKeyLocked) return; // ainda não desbloqueou — não sobrescreve o blob criptografado salvo com uma chave vazia
        (async () => {
          // Se a pessoa desmarcou "lembrar a chave", grava tudo MENOS a chave —
          // ela continua funcionando normalmente nesta aba (vive só no estado
          // React em memória), mas não fica parada em texto puro no IndexedDB
          // do navegador entre uma sessão e outra.
          if (!settings.rememberApiKey) {
            const { llmApiKeyEncrypted, ...rest } = settings;
            storageSetAndForget("cs3settings", JSON.stringify({ ...rest, llmApiKey: "" }));
            return;
          }
          // Criptografia opcional (auditoria 1.3): com "criptografar chave"
          // ligado e uma frase-senha definida nesta sessão, a chave nunca
          // toca o IndexedDB em texto puro — só o blob cifrado (AES-GCM) fica
          // salvo, e a frase-senha em si nunca é persistida.
          if (settings.encryptApiKey && apiKeyPassphrase && settings.llmApiKey) {
            try {
              const encrypted = await encryptApiKey(settings.llmApiKey, apiKeyPassphrase);
              storageSetAndForget("cs3settings", JSON.stringify({ ...settings, llmApiKey: "", llmApiKeyEncrypted: encrypted }));
              return;
            } catch (e) {
              console.error("Falha ao criptografar a chave, salvando sem criptografia:", e);
            }
          }
          const { llmApiKeyEncrypted, ...rest } = settings;
          storageSetAndForget("cs3settings", JSON.stringify(rest));
        })();
      }, [settings, globalsLoaded, encryptedKeyLocked, apiKeyPassphrase]);

      // Desbloqueia a chave criptografada salva de uma sessão anterior —
      // pede a mesma frase-senha usada pra cifrar, decifra em memória e
      // guarda a frase-senha (só nesta aba) pra continuar re-criptografando
      // em saves futuros sem pedir de novo a cada mudança.
      const unlockEncryptedKey = async () => {
        if (!encryptedKeyRef.current || !unlockPassphraseInput) return;
        try {
          const plain = await decryptApiKey(encryptedKeyRef.current, unlockPassphraseInput);
          setApiKeyPassphrase(unlockPassphraseInput);
          setUnlockPassphraseInput("");
          setUnlockError(null);
          setEncryptedKeyLocked(false);
          setSettings((prev) => ({ ...prev, llmApiKey: plain }));
        } catch (e) {
          setUnlockError("Frase-senha incorreta (ou os dados salvos estão corrompidos).");
        }
      };

      // Desliga a criptografia: da próxima vez que salvar, a chave volta a
      // ir em texto puro pro IndexedDB (mesmo comportamento de antes da 1.3)
      const disableApiKeyEncryption = () => {
        setApiKeyPassphrase("");
        updateSetting("encryptApiKey", false);
      };

      // memória de tradução é global (vale pra todos os arquivos), salva com
      // um pequeno atraso pra não gravar no disco a cada tecla digitada
      const memorySaveTimeoutRef = useRef(null);
      useEffect(() => {
        if (!globalsLoaded) return;
        if (memorySaveTimeoutRef.current) clearTimeout(memorySaveTimeoutRef.current);
        memorySaveTimeoutRef.current = setTimeout(() => {
          storageSetAndForget("cs3_translation_memory", JSON.stringify(translationMemory));
        }, 500);
        return () => clearTimeout(memorySaveTimeoutRef.current);
      }, [translationMemory, globalsLoaded]);

      const forgetMemoryEntry = (key) => {
        setTranslationMemory((prev) => {
          const next = { ...prev };
          delete next[key];
          return next;
        });
      };

      const clearMemory = () => {
        if (!window.confirm("Apagar toda a memória de tradução (todos os termos aprendidos)? Isso não muda as traduções já aplicadas nos arquivos.")) return;
        setTranslationMemory({});
      };

      // remove só os termos ainda NÃO verificados (normalmente sobras de
      // uma versão antiga do app, que aprendia qualquer rascunho na
      // memória) — os verificados ficam intocados
      const clearUnverifiedMemory = () => {
        const unverifiedCount = Object.values(translationMemory).filter((d) => !d.verified).length;
        if (unverifiedCount === 0) return;
        if (!window.confirm(`Apagar ${unverifiedCount} termo(s) ainda não verificado(s) da memória? Os termos verificados não são afetados.`)) return;
        setTranslationMemory((prev) => {
          const next = {};
          for (const [key, data] of Object.entries(prev)) {
            if (data.verified) next[key] = data;
          }
          return next;
        });
      };

      // varre TODOS os arquivos abertos e traz pra memória, já como
      // verificadas, as traduções que você aprovou antes desta versão do
      // app existir (quando a memória ainda não distinguia verificado de
      // rascunho) — não mexe em nada que já estava correto na memória.
      const importVerifiedIntoMemory = () => {
        const currentDocs = docsRef.current;
        let scanned = 0;
        const additions = {};
        for (const d of currentDocs) {
          for (const e of d.entries) {
            if (!d.verified[e.ref]) continue;
            const text = (d.translations[e.ref] || "").trim();
            if (!text) continue;
            scanned += 1;
            const key = memoryKey(e.original);
            if (!key) continue;
            const already = translationMemory[key];
            if (already && already.translation === text && already.verified) continue; // já está igual e verificado
            additions[key] = { translation: text, updatedAt: Date.now(), verified: true };
          }
        }
        const changed = Object.keys(additions).length;
        if (scanned === 0) {
          notify("Não encontrei nenhuma linha verificada nos arquivos abertos.", "err");
          return;
        }
        if (changed === 0) {
          notify(`As ${scanned} linha(s) verificada(s) já estavam na memória como verificadas — nada a atualizar.`, "info");
          return;
        }
        setTranslationMemory((prev) => ({ ...prev, ...additions }));
        notify(`${changed} termo(s) importado(s)/atualizado(s) na memória, a partir de ${scanned} linha(s) verificada(s) nos arquivos abertos.`, "ok");
      };

      useEffect(() => {
        if (!globalsLoaded) return;
        storageSetAndForget("cs3_proper_nouns", JSON.stringify(properNouns));
      }, [properNouns, globalsLoaded]);

      const addProperNoun = () => {
        const term = newNounTerm.trim();
        if (!term) return;
        setProperNouns((prev) => [...prev.filter((p) => p.term.toLowerCase() !== term.toLowerCase()), { term, translation: newNounTranslation.trim() }]);
        setNewNounTerm("");
        setNewNounTranslation("");
      };

      const removeProperNoun = (term) => {
        setProperNouns((prev) => prev.filter((p) => p.term !== term));
      };

      // importa vários termos de uma vez de um .csv/.txt ("termo,tradução"
      // por linha) — não sobrescreve termo que já existe com tradução
      // diferente sem avisar
      const importProperNounsFile = async (file) => {
        const text = await file.text();
        const rows = parseTwoColumnImport(text);
        if (rows.length === 0) {
          notify('Nenhum termo válido encontrado. Formato esperado: uma linha por termo, "termo,tradução" (vírgula ou tab).', "err");
          return;
        }
        let added = 0, updated = 0, unchanged = 0;
        setProperNouns((prev) => {
          const map = new Map(prev.map((p) => [p.term.toLowerCase(), p]));
          for (const row of rows) {
            const key = row.original.toLowerCase();
            const existing = map.get(key);
            if (!existing) {
              map.set(key, { term: row.original, translation: row.translation });
              added += 1;
            } else if (existing.translation !== row.translation && row.translation) {
              map.set(key, { term: row.original, translation: row.translation });
              updated += 1;
            } else {
              unchanged += 1;
            }
          }
          return Array.from(map.values());
        });
        notify(`Importação concluída: ${added} termo(s) novo(s), ${updated} atualizado(s), ${unchanged} já estavam iguais.`, "ok");
      };

      // Exporta a memória de tradução em TMX 1.4 — o formato padrão da
      // indústria de localização (OmegaT, memoQ, Trados etc.) — pra dar pra
      // reaproveitar o trabalho feito aqui em outra ferramenta, ou compartilhar
      // com outro tradutor do projeto sem depender deste app específico.
      const exportMemoryAsTmx = () => {
        const entries = Object.entries(translationMemory);
        if (entries.length === 0) {
          notify("A memória de tradução está vazia — nada para exportar.", "err");
          return;
        }
        const nowIso = tmxTimestamp();
        const tus = entries
          .filter(([, data]) => data && data.translation && data.translation.trim())
          .map(([original, data]) => {
            const changeDate = tmxTimestamp(data.updatedAt);
            return [
              `    <tu changedate="${changeDate}">`,
              `      <tuv xml:lang="en"><seg>${escapeXml(original)}</seg></tuv>`,
              `      <tuv xml:lang="pt-BR"><seg>${escapeXml(data.translation)}</seg></tuv>`,
              `    </tu>`,
            ].join("\n");
          });
        const xml = [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<tmx version="1.4">',
          `  <header creationtool="TLoH CS3 Tradutor" creationtoolversion="1.0" datatype="plaintext" segtype="sentence" adminlang="en" srclang="en" o-tmf="TLoHCS3Tradutor" creationdate="${nowIso}" />`,
          "  <body>",
          tus.join("\n"),
          "  </body>",
          "</tmx>",
        ].join("\n");
        downloadTmxFile(xml, `${safeForFilename(activeProject)}_memoria_traducao.tmx`);
      };

      // importa pares "texto original,tradução" pra dentro da Memória —
      // marca como verificado (assume que veio de uma fonte já revisada,
      // tipo um glossário de tradução anterior do time)
      const importMemoryFile = async (file) => {
        const text = await file.text();
        const rows = parseTwoColumnImport(text);
        if (rows.length === 0) {
          notify('Nenhuma linha válida encontrada. Formato esperado: uma por linha, "texto original,tradução" (vírgula ou tab).', "err");
          return;
        }
        let added = 0, updated = 0, unchanged = 0;
        setTranslationMemory((prev) => {
          const next = { ...prev };
          for (const row of rows) {
            if (!row.translation) continue; // memória precisa de tradução, termo sozinho não serve aqui
            const key = memoryKey(row.original);
            const existing = next[key];
            if (!existing) {
              next[key] = { translation: row.translation, updatedAt: Date.now(), verified: true };
              added += 1;
            } else if (existing.translation !== row.translation) {
              next[key] = { translation: row.translation, updatedAt: Date.now(), verified: true };
              updated += 1;
            } else {
              unchanged += 1;
            }
          }
          return next;
        });
        notify(`Importação concluída: ${added} termo(s) novo(s) na memória, ${updated} atualizado(s), ${unchanged} já estavam iguais.`, "ok");
      };

      useEffect(() => {
        if (!globalsLoaded) return;
        storageSetAndForget("cs3_active_project", activeProject);
      }, [activeProject, globalsLoaded]);

      useEffect(() => {
        if (!globalsLoaded) return;
        storageSetAndForget("cs3_projects_list", JSON.stringify(knownProjects));
      }, [knownProjects, globalsLoaded]);

      // troca (ou cria, se for nome novo) o projeto usado pros PRÓXIMOS
      // arquivos que forem carregados — arquivos já abertos não mudam de
      // projeto sozinhos.
      const changeActiveProject = (name) => {
        const clean = name.trim();
        if (!clean) return;
        setActiveProject(clean);
        setKnownProjects((prev) => (prev.includes(clean) ? prev : [...prev, clean]));
      };

      // renomeia um projeto: atualiza a lista, os arquivos JÁ ABERTOS que
      // pertencem a ele, e migra o progresso salvo desses arquivos pra chave
      // nova (arquivos do mesmo projeto que não estão abertos no momento não
      // são alcançados — só é possível migrar o que está carregado agora).
      const renameProject = async (oldName, newNameRaw) => {
        const newName = (newNameRaw || "").trim();
        if (!newName || newName === oldName) return;
        if (knownProjects.includes(newName)) {
          if (!window.confirm(`Já existe um projeto "${newName}". Os arquivos de "${oldName}" vão passar a fazer parte dele. Continuar?`)) return;
        }

        const affected = docsRef.current.filter((d) => d.project === oldName);
        for (const d of affected) {
          try {
            const oldKey = `cs3progress:${oldName}:${d.fileName}`;
            const newKey = `cs3progress:${newName}:${d.fileName}`;
            const stored = await window.storage.get(oldKey);
            if (stored && stored.value) {
              await window.storage.set(newKey, stored.value);
              await window.storage.delete(oldKey);
            }
          } catch (e) {
            console.error("Falha ao migrar progresso do projeto renomeado:", e);
          }
        }

        setDocs((prev) => prev.map((d) => (d.project === oldName ? { ...d, project: newName } : d)));
        setKnownProjects((prev) => {
          const withoutOld = prev.filter((p) => p !== oldName);
          return withoutOld.includes(newName) ? withoutOld : [...withoutOld, newName];
        });
        if (activeProject === oldName) setActiveProject(newName);
      };

      const handleRenameProjectClick = () => {
        const newName = window.prompt(
          `Renomear o projeto "${activeProject}" para:`,
          activeProject
        );
        if (newName === null) return; // cancelou
        renameProject(activeProject, newName);
      };

      const updateSetting = (key, value) => {
        setTestResult(null);
        setSettings((prev) => ({ ...prev, [key]: value }));
      };

      const runTestConnection = async () => {
        setTestingConn(true);
        setTestResult(null);
        const result = settings.engine === "llm" ? await testLLMConnection(settings) : await testLibreTranslateConnection(settings);
        setTestResult(result);
        setTestingConn(false);
      };

      const chooseDownloadFolder = async () => {
        if (!supportsDirPicker) {
          notify(
            "Seu navegador não deixa escolher uma pasta fixa de destino (isso funciona no Chrome/Edge). " +
            "Os downloads vão continuar abrindo a caixa de 'Salvar como' padrão do navegador."
          , "info");
          return;
        }
        try {
          const handle = await window.showDirectoryPicker();
          savedDirHandle = handle;
          setSavedDirName(handle.name);
        } catch (e) {
          // usuário cancelou o seletor — tudo bem, não faz nada
        }
      };

      const clearDownloadFolder = () => {
        savedDirHandle = null;
        setSavedDirName(null);
      };

      const originalDataMapRef = useRef(new Map()); // docId -> Uint8Array
      const saveTimeoutRef = useRef(new Map()); // docId -> timeout
      const cancelBatchRef = useRef(false);
      const cancelReviewRef = useRef(false);

      const activeDoc = docs.find((d) => d.id === activeId) || null;
      // auditoria 3.1: `docs` muda de referência a CADA tecla digitada (edita
      // 1 linha, o objeto do doc inteiro é recriado) — num arquivo de 5.000+
      // linhas, isso fazia o `.filter()` de `filtered` (abaixo) escanear o
      // arquivo inteiro a cada tecla. `useDeferredValue` deixa o textarea
      // 100% instantâneo (ele sempre lê da versão imediata de `activeDoc`,
      // não desta) e só a LISTA/paginação atualiza com prioridade menor,
      // uma fração de segundo depois — padrão recomendado pelo próprio time
      // do React pra "digitar rápido + lista grande derivada".
      //
      // IMPORTANTE (não colapsar num só): `activeDoc` e `deferredActiveDoc`
      // são DOIS objetos propositalmente diferentes, não uma duplicação
      // acidental. `activeDoc` (imediato) é o que o textarea/EntryCard usa
      // pra ler/escrever o valor da tradução — precisa ser instantâneo.
      // `deferredActiveDoc` (atrasado) é só o que alimenta `filtered`/a
      // lista renderizada — pode ficar uma fração de segundo "velho" sem
      // problema nenhum. Se algum dia forem unificados num só, o textarea
      // volta a travar em arquivos grandes (era exatamente o bug do item
      // 3.1 da auditoria).
      const deferredDocs = useDeferredValue(docs);
      // useMemo explícito (auditoria #2 M6): `find` já devolveria a mesma
      // referência quando nada muda, mas isso é acidente feliz, não
      // garantia — e essa referência é dependência de useMemos caros
      // (filtered, projectSearchResults). Memoizar documenta a intenção e
      // blinda contra alguém trocar o find por um map/filter no futuro.
      const deferredActiveDoc = useMemo(
        () => deferredDocs.find((d) => d.id === activeId) || null,
        [deferredDocs, activeId]
      );

      // --- upload & parse (múltiplos arquivos) -------------------------------
      const handleFiles = useCallback(async (fileList) => {
        const files = Array.from(fileList || []).filter((f) => /\.xlsx$/i.test(f.name));
        if (files.length === 0) return;
        setLoading(true);
        setError(null);
        setRestoredNote(null);

        const project = activeProject;
        const added = [];
        const failedNames = [];

        for (const file of files) {
          try {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: "array" });
            const { entries } = parseWorkbook(wb);
            if (entries.length === 0) {
              failedNames.push(file.name);
              continue;
            }
            const id = nextDocId++;
            originalDataMapRef.current.set(id, new Uint8Array(buf));

            let translations = {};
            let ignored = {};
            let autoTranslated = {};
            // Linhas em que o motor de tradução falhou (todas as tentativas
            // esgotadas): a tradução guardada é o TEXTO ORIGINAL — mantido de
            // propósito pra nunca exportar em branco — e esta flag é o que
            // diferencia isso de uma tradução de verdade. O QA transforma
            // isso num problema crítico (ver checkEntryIssues) pra reenviar
            // ao lote depois de revisado.
            let translationFailed = {};
            // Vereditos do revisor de coerência (IA), por ref: { nota, explicacao,
            // textHash, revisadoEm }. textHash é o que permite pular uma linha já
            // revisada CUJA TRADUÇÃO NÃO MUDOU desde a última revisão (ver
            // reviewTextHash) — sem isso, clicar "Revisar coerência" de novo re-
            // pagaria pela mesma linha toda vez, mesmo sem nada ter mudado nela.
            let coherenceReview = {};
            let verified = {};
            let fromMemory = {};
            let qaIgnored = {};
            let restoredCount = 0;
            try {
              // progresso é isolado por projeto+arquivo, pra "a0000.xlsx" de
              // um jogo não se misturar com "a0000.xlsx" de outro
              const stored = await window.storage.get(`cs3progress:${project}:${file.name}`, false);
              if (stored && stored.value) {
                const data = JSON.parse(stored.value);
                if (data.translations) translations = data.translations;
                if (data.ignored) ignored = data.ignored;
                if (data.autoTranslated) autoTranslated = data.autoTranslated;
                if (data.translationFailed) translationFailed = data.translationFailed;
                if (data.coherenceReview) coherenceReview = data.coherenceReview;
                if (data.verified) verified = data.verified;
                if (data.fromMemory) fromMemory = data.fromMemory;
                if (data.qaIgnored) qaIgnored = migrateQaIgnored(data.qaIgnored);
                restoredCount = Object.keys(translations).length;
              }
            } catch (e) {}

            // pré-preenche com o que já está na memória de tradução (termos/
            // falas que você já traduziu antes, em qualquer arquivo/projeto —
            // a memória é global de propósito)
            let memoryFilledCount = 0;
            for (const e of entries) {
              if (translations[e.ref] && translations[e.ref].trim()) continue;
              const mem = translationMemory[memoryKey(e.original)];
              // só preenche automaticamente com termos JÁ VERIFICADOS —
              // rascunho não aprovado não deveria se espalhar sozinho
              if (mem && mem.translation && mem.verified) {
                translations[e.ref] = mem.translation;
                fromMemory[e.ref] = true;
                verified[e.ref] = true;
                memoryFilledCount += 1;
              }
            }

            added.push({
              id,
              fileName: file.name,
              project,
              entries,
              translations,
              ignored,
              autoTranslated,
              translationFailed,
              coherenceReview,
              verified,
              fromMemory,
              qaIgnored,
              lastBatch: [],
              restoredCount,
              memoryFilledCount,
            });
          } catch (e) {
            console.error(e);
            failedNames.push(file.name);
          }
        }

        if (added.length > 0) {
          setDocs((prev) => [...prev, ...added]);
          setActiveId(added[0].id);
          setFilter("all");
          setSearch("");
          setPage(1);
          const restoredTotal = added.reduce((s, d) => s + d.restoredCount, 0);
          const memoryTotal = added.reduce((s, d) => s + d.memoryFilledCount, 0);
          const notes = [];
          if (restoredTotal > 0) notes.push(`${restoredTotal} tradução(ões) restaurada(s) do progresso salvo`);
          if (memoryTotal > 0) notes.push(`${memoryTotal} preenchida(s) automaticamente pela memória de tradução`);
          if (notes.length > 0) setRestoredNote(notes.join(" · ") + ".");
        }
        if (failedNames.length > 0) {
          setError(
            `Não foi possível processar: ${failedNames.join(", ")}. Confira se são .xlsx exportados pelo SenScriptsDecompiler com texto traduzível.`
          );
        }
        setLoading(false);
      }, [translationMemory, activeProject]);

      const onInputChange = (e) => {
        handleFiles(e.target.files);
        e.target.value = "";
      };
      const onAddMoreInputChange = (e) => {
        handleFiles(e.target.files);
        e.target.value = "";
      };
      const onDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        handleFiles(e.dataTransfer.files);
      };

      // --- helpers para atualizar um doc específico ---------------------------
      const updateDoc = useCallback((id, updater) => {
        setDocs((prev) => prev.map((d) => (d.id === id ? updater(d) : d)));
      }, []);

      const scheduleSave = useCallback((doc) => {
        const map = saveTimeoutRef.current;
        if (map.has(doc.id)) clearTimeout(map.get(doc.id));
        const t = setTimeout(async () => {
          try {
            await window.storage.set(
              `cs3progress:${doc.project}:${doc.fileName}`,
              JSON.stringify({
                translations: doc.translations,
                ignored: doc.ignored,
                autoTranslated: doc.autoTranslated,
                translationFailed: doc.translationFailed,
                coherenceReview: doc.coherenceReview,
                fromMemory: doc.fromMemory,
                verified: doc.verified,
                qaIgnored: doc.qaIgnored,
                updatedAt: Date.now(),
              }),
              false
            );
            setSaveError(null); // gravou com sucesso: se havia aviso na tela, ele sai
          } catch (e) {
            console.error("Falha ao salvar progresso:", e);
            const isQuota = !!(e && (e.name === "QuotaExceededError" || /quota|space/i.test(e.message || "")));
            setSaveError({
              fileName: doc.fileName,
              quota: isQuota,
              message: isQuota
                ? "O navegador ficou sem espaço pra gravar."
                : `O navegador recusou a gravação${e && e.message ? ` (${e.message})` : ""}.`,
            });
          }
        }, 600);
        map.set(doc.id, t);
      }, []);

      // mantém uma referência sempre atualizada de `docs` para handlers
      // estáveis (useCallback com deps vazias) que precisam ler o estado
      // mais recente sem precisar mudar de identidade a cada render —
      // isso é o que permite os cartões usarem React.memo de verdade
      // (sem isso, cada tecla digitada re-renderizaria TODOS os cartões
      // visíveis na página, não só o que está sendo editado).
      const docsRef = useRef(docs);
      useEffect(() => {
        docsRef.current = docs;
      }, [docs]);

      useEffect(() => {
        setPage(1);
      }, [filter, search, pageSize, activeId]);

      // ---------------------------------------------------------------------
      // Desfazer (Ctrl+Z) — rede de segurança pra ações em lote/destrutivas
      // (limpar não verificados, aplicar em duplicatas, importar estado,
      // corrigir linhas em massa). Guarda só os campos que MUDAM (tradução,
      // ignorado, verificado etc.) — nunca as `entries`/bytes originais do
      // arquivo, que nunca mudam e ficariam pesados de duplicar à toa.
      // ---------------------------------------------------------------------
      const [undoStack, setUndoStack] = useState([]); // [{label, timestamp, entries: [{docId, translations, ignored, verified, autoTranslated, fromMemory}]}]
      const [redoStack, setRedoStack] = useState([]); // mesmo formato — alimentado só por undoLastAction/redoLastAction
      const MAX_UNDO = 20;
      const undoStackRef = useRef(undoStack);
      useEffect(() => { undoStackRef.current = undoStack; }, [undoStack]);
      const redoStackRef = useRef(redoStack);
      useEffect(() => { redoStackRef.current = redoStack; }, [redoStack]);

      // Tira uma "foto" do estado ATUAL (antes de aplicar um snapshot salvo) —
      // usada tanto por undo quanto por redo pra alimentar a pilha oposta,
      // assim dá pra ir e voltar (Ctrl+Z / Ctrl+Shift+Z) sem perder nada.
      const captureCurrentSnapshot = useCallback((label, docIds) => {
        const currentDocs = docsRef.current;
        const targets = docIds ? currentDocs.filter((d) => docIds.includes(d.id)) : currentDocs;
        return {
          label,
          timestamp: Date.now(),
          entries: targets.map((d) => ({
            docId: d.id,
            translations: { ...d.translations },
            ignored: { ...d.ignored },
            verified: { ...d.verified },
            autoTranslated: { ...d.autoTranslated },
            translationFailed: { ...d.translationFailed },
            coherenceReview: { ...d.coherenceReview },
            fromMemory: { ...d.fromMemory },
          })),
        };
      }, []);

      const pushUndoSnapshot = useCallback((label, docIds) => {
        const currentDocs = docsRef.current;
        const targets = docIds ? currentDocs.filter((d) => docIds.includes(d.id)) : currentDocs;
        if (targets.length === 0) return;
        const snapshot = {
          label,
          timestamp: Date.now(),
          entries: targets.map((d) => ({
            docId: d.id,
            translations: { ...d.translations },
            ignored: { ...d.ignored },
            verified: { ...d.verified },
            autoTranslated: { ...d.autoTranslated },
            translationFailed: { ...d.translationFailed },
            coherenceReview: { ...d.coherenceReview },
            fromMemory: { ...d.fromMemory },
          })),
        };
        setUndoStack((prev) => {
          const next = [...prev, snapshot];
          return next.length > MAX_UNDO ? next.slice(next.length - MAX_UNDO) : next;
        });
        // uma ação nova invalida o "futuro" que o redo levaria de volta —
        // comportamento padrão de undo/redo em qualquer editor
        setRedoStack([]);
      }, []);

      const applySnapshotEntries = useCallback((entries) => {
        for (const snap of entries) {
          updateDoc(snap.docId, (d) => {
            const next = {
              ...d,
              translations: snap.translations,
              ignored: snap.ignored,
              verified: snap.verified,
              autoTranslated: snap.autoTranslated,
              translationFailed: snap.translationFailed,
              coherenceReview: snap.coherenceReview,
              fromMemory: snap.fromMemory,
            };
            scheduleSave(next);
            return next;
          });
        }
      }, [updateDoc, scheduleSave]);

      const undoLastAction = useCallback(() => {
        const stack = undoStackRef.current;
        if (stack.length === 0) return;
        const last = stack[stack.length - 1];
        const docIds = last.entries.map((e) => e.docId);
        // guarda o estado de ANTES de desfazer, pra "Refazer" poder trazer de volta
        const redoSnap = captureCurrentSnapshot(last.label, docIds);
        applySnapshotEntries(last.entries);
        setUndoStack((prev) => prev.slice(0, -1));
        setRedoStack((prev) => {
          const next = [...prev, redoSnap];
          return next.length > MAX_UNDO ? next.slice(next.length - MAX_UNDO) : next;
        });
      }, [applySnapshotEntries, captureCurrentSnapshot]);

      const redoLastAction = useCallback(() => {
        const stack = redoStackRef.current;
        if (stack.length === 0) return;
        const last = stack[stack.length - 1];
        const docIds = last.entries.map((e) => e.docId);
        // guarda o estado de antes de refazer, pra continuar podendo desfazer de novo
        const undoSnap = captureCurrentSnapshot(last.label, docIds);
        applySnapshotEntries(last.entries);
        setRedoStack((prev) => prev.slice(0, -1));
        setUndoStack((prev) => {
          const next = [...prev, undoSnap];
          return next.length > MAX_UNDO ? next.slice(next.length - MAX_UNDO) : next;
        });
      }, [applySnapshotEntries, captureCurrentSnapshot]);

      // Ctrl+Z desfaz a última ação em lote; Ctrl+Shift+Z ou Ctrl+Y refaz
      useEffect(() => {
        const handler = (ev) => {
          if (ev.ctrlKey && (ev.key === "y" || ev.key === "Y") && !ev.shiftKey) {
            if (redoStackRef.current.length === 0) return;
            ev.preventDefault();
            redoLastAction();
            return;
          }
          if (ev.ctrlKey && ev.shiftKey && (ev.key === "z" || ev.key === "Z")) {
            if (redoStackRef.current.length === 0) return;
            ev.preventDefault();
            redoLastAction();
            return;
          }
          if (ev.ctrlKey && !ev.shiftKey && (ev.key === "z" || ev.key === "Z")) {
            if (undoStackRef.current.length === 0) return;
            ev.preventDefault();
            undoLastAction();
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [undoLastAction, redoLastAction]);

      // --- ações por arquivo ---------------------------------------------------
      // options.keepVerified: usado só pelo reparo MECÂNICO de código do
      // jogo (auditoria #2 M5). Ele recoloca "#E[12]" na ponta e não altera
      // uma palavra sequer da redação — invalidar a aprovação humana nesse
      // caso é punir a pessoa por uma correção que ela nem fez. Edição
      // normal continua desmarcando, que é o certo.
      const setTranslation = useCallback((docId, ref, text, options = {}) => {
        updateDoc(docId, (d) => {
          const translations = { ...d.translations, [ref]: text };
          const autoTranslated = { ...d.autoTranslated };
          delete autoTranslated[ref];
          const translationFailed = { ...d.translationFailed };
          delete translationFailed[ref];
          // a nota de coerência vale pra um TEXTO específico — mudou o texto,
          // a nota velha não significa mais nada (ver coherenceReview.textHash)
          const coherenceReview = { ...d.coherenceReview };
          delete coherenceReview[ref];
          const fromMemory = { ...d.fromMemory };
          delete fromMemory[ref];
          const verified = { ...d.verified };
          if (!options.keepVerified) delete verified[ref]; // editar de novo desfaz a aprovação anterior
          const next = { ...d, translations, autoTranslated, translationFailed, coherenceReview, fromMemory, verified };
          scheduleSave(next);
          return next;
        });
      }, [updateDoc, scheduleSave]);

      // reformata a tradução manual pra ter o mesmo número de linhas do
      // original, sem cortar palavra — botão "ajustar linhas" no cartão
      const wrapEntryLines = useCallback((docId, ref) => {
        const doc = docsRef.current.find((d) => d.id === docId);
        if (!doc) return;
        const entry = doc.entries.find((e) => e.ref === ref);
        if (!entry || entry.lineCount <= 1) return;
        const current = doc.translations[ref] || "";
        if (!current.trim()) return;
        setTranslation(docId, ref, wrapToLineCount(current, entry.lineCount));
      }, [setTranslation]);

      // Ctrl+Enter / Ctrl+I no cartão chamam isso pra pular pro campo de
      // tradução seguinte, sem precisar tirar a mão do teclado.
      const focusNextCard = useCallback((currentRef) => {
        const areas = Array.from(document.querySelectorAll(".translation-area"));
        const currentEl = document.getElementById(`card-${currentRef}`);
        const currentArea = currentEl ? currentEl.querySelector(".translation-area") : null;
        const idx = currentArea ? areas.indexOf(currentArea) : -1;
        const next = idx >= 0 && idx < areas.length - 1 ? areas[idx + 1] : null;
        if (next) {
          next.focus();
          next.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }, []);

      // só é chamada a partir de toggleVerified (ao APROVAR uma linha) —
      // a memória de tradução deve conter só o que você revisou de fato,
      // nunca sugestão automática nem rascunho digitado e ainda não aprovado
      const learnTranslation = useCallback((original, translation) => {
        const key = memoryKey(original);
        if (!key || !translation.trim()) return;
        setTranslationMemory((prev) => {
          if (prev[key] && prev[key].translation === translation && prev[key].verified) return prev;
          return { ...prev, [key]: { translation, updatedAt: Date.now(), verified: true } };
        });
      }, []);

      // checa se já existe uma tradução VERIFICADA na memória pra esse
      // texto original (usado pra decidir se um item pode ser pré-preenchido
      // automaticamente / contado como aprovado ao reaplicar da memória)
      const isMemoryVerified = useCallback((original) => {
        const entry = translationMemory[memoryKey(original)];
        return !!(entry && entry.verified);
      }, [translationMemory]);

      // roda quando o campo de tradução perde o foco: aprende o termo na
      // memória e procura outras linhas com o MESMO texto original em
      // qualquer arquivo carregado, oferecendo replicar a tradução nelas.
      const handleTranslationBlur = useCallback((docId, ref) => {
        const currentDocs = docsRef.current;
        const doc = currentDocs.find((d) => d.id === docId);
        if (!doc) return;
        const entry = doc.entries.find((e) => e.ref === ref);
        if (!entry) return;
        const text = (doc.translations[ref] || "").trim();
        if (!text) return;

        // NÃO aprende na memória aqui — isso é só um rascunho ainda não
        // aprovado. A memória só recebe termos verificados, o que acontece
        // em toggleVerified (ao clicar "aprovar" / Ctrl+Enter).
        const matches = findDuplicateOriginals(currentDocs, docId, ref, entry.original, (d, e) => {
          if (d.ignored[e.ref]) return true;
          return (d.translations[e.ref] || "").trim() === text; // já está igual, nada a fazer
        });
        if (!confirmDuplicates(matches, `Aplicar esta tradução a ela${matches.length > 1 ? "s também" : " também"}?`)) return;

        pushUndoSnapshot(`Aplicar tradução em ${matches.length} duplicata(s)`, [...new Set(matches.map((m) => m.docId))]);
        for (const m of matches) {
          updateDoc(m.docId, (d) => {
            const translations = { ...d.translations, [m.ref]: text };
            const fromMemory = { ...d.fromMemory, [m.ref]: true };
            const autoTranslated = { ...d.autoTranslated };
            delete autoTranslated[m.ref];
            const translationFailed = { ...d.translationFailed };
            delete translationFailed[m.ref];
            const coherenceReview = { ...d.coherenceReview };
            delete coherenceReview[m.ref];
            const next = { ...d, translations, fromMemory, autoTranslated, translationFailed, coherenceReview };
            scheduleSave(next);
            return next;
          });
        }
      }, [updateDoc, scheduleSave, pushUndoSnapshot]);

      // ao marcar como ignorado (não ao desmarcar), procura outras linhas
      // com o MESMO texto original em qualquer arquivo e pergunta se quer
      // ignorar elas também.
      const toggleIgnored = useCallback((docId, ref) => {
        const currentDocs = docsRef.current;
        const doc = currentDocs.find((d) => d.id === docId);
        const wasIgnored = !!(doc && doc.ignored[ref]);

        updateDoc(docId, (d) => {
          const ignored = { ...d.ignored };
          if (ignored[ref]) delete ignored[ref];
          else ignored[ref] = true;
          const next = { ...d, ignored };
          scheduleSave(next);
          return next;
        });

        if (wasIgnored || !doc) return; // só verifica duplicatas ao IGNORAR, não ao desfazer
        const entry = doc.entries.find((e) => e.ref === ref);
        if (!entry) return;

        const matches = findDuplicateOriginals(currentDocs, docId, ref, entry.original, (d, e) => d.ignored[e.ref]);
        if (!confirmDuplicates(matches, `Ignorar ela${matches.length > 1 ? "s também" : " também"}?`)) return;

        pushUndoSnapshot(`Ignorar ${matches.length} duplicata(s)`, [...new Set(matches.map((m) => m.docId))]);
        for (const m of matches) {
          updateDoc(m.docId, (d) => {
            const ignored = { ...d.ignored, [m.ref]: true };
            const next = { ...d, ignored };
            scheduleSave(next);
            return next;
          });
        }
      }, [updateDoc, scheduleSave, pushUndoSnapshot]);

      // ao marcar como verificado (não ao desmarcar), procura outras linhas
      // com o MESMO texto original em qualquer arquivo e pergunta se quer
      // aprovar elas também (aplicando a mesma tradução, pra não ficar
      // "verificado" com um texto diferente do que foi de fato revisado).
      const toggleVerified = useCallback((docId, ref) => {
        const currentDocs = docsRef.current;
        const doc = currentDocs.find((d) => d.id === docId);
        const wasVerified = !!(doc && doc.verified[ref]);
        const entryForMemory = doc ? doc.entries.find((e) => e.ref === ref) : null;
        const textForMemory = doc ? (doc.translations[ref] || "").trim() : "";

        updateDoc(docId, (d) => {
          const verified = { ...d.verified };
          if (verified[ref]) delete verified[ref];
          else verified[ref] = true;
          const next = { ...d, verified };
          scheduleSave(next);
          return next;
        });

        // memória de tradução só recebe termos APROVADOS — é aqui, e só
        // aqui, que uma tradução vira "verificada" na memória global. Ao
        // desmarcar não desaprende automaticamente (use "esquecer" na aba
        // Memória se quiser remover o termo de vez).
        if (!wasVerified && entryForMemory && textForMemory) {
          learnTranslation(entryForMemory.original, textForMemory);
        }

        if (wasVerified || !doc) return; // só verifica duplicatas ao APROVAR
        const entry = doc.entries.find((e) => e.ref === ref);
        const text = (doc.translations[ref] || "").trim();
        if (!entry || !text) return;

        const matches = findDuplicateOriginals(currentDocs, docId, ref, entry.original, (d, e) => d.ignored[e.ref] || d.verified[e.ref]);

        if (matches.length > 0) {
          if (confirmDuplicates(matches, `Aplicar esta tradução e aprovar ela${matches.length > 1 ? "s também" : " também"}?`)) {
            pushUndoSnapshot(`Aprovar ${matches.length} duplicata(s)`, [...new Set(matches.map((m) => m.docId))]);
            for (const m of matches) {
              updateDoc(m.docId, (d) => {
                const translations = { ...d.translations, [m.ref]: text };
                const verified = { ...d.verified, [m.ref]: true };
                const fromMemory = { ...d.fromMemory, [m.ref]: true };
                const autoTranslated = { ...d.autoTranslated };
                delete autoTranslated[m.ref];
                const translationFailed = { ...d.translationFailed };
                delete translationFailed[m.ref];
                const coherenceReview = { ...d.coherenceReview };
                delete coherenceReview[m.ref];
                const next = { ...d, translations, verified, fromMemory, autoTranslated, translationFailed, coherenceReview };
                scheduleSave(next);
                return next;
              });
            }
          }
          return;
        }

        // sem duplicata IDÊNTICA — procura frases PARECIDAS (não idênticas,
        // ex: só um número/nome diferente) ainda sem tradução, só pra
        // apontar, sem aplicar nada sozinho (evitaria errar o número/nome)
        const near = findNearDuplicates(currentDocs, docId, ref, entry.original, 0.82);
        if (near.length > 0) {
          const filesInvolved = new Set(near.map((m) => m.fileName));
          const goReview = window.confirm(
            `Também encontrei ${near.length} frase${near.length > 1 ? "s" : ""} PARECIDA${near.length > 1 ? "S" : ""} (não idêntica${near.length > 1 ? "s" : ""} — ` +
            `provavelmente só um número/nome diferente) ainda sem tradução${filesInvolved.size > 1 ? ` em ${filesInvolved.size} arquivos` : ""}.\n\n` +
            `Elas NÃO foram alteradas automaticamente (evita aplicar tradução com número/nome errado). Quer ir ver a primeira agora?`
          );
          if (goReview) {
            const first = near[0];
            if (first.docId !== activeId) setActiveId(first.docId);
            setFilter("all");
            setSearch("");
            setJumpTarget(first.ref);
          }
        }
      }, [updateDoc, scheduleSave, learnTranslation, pushUndoSnapshot, activeId]);

      const clearSaved = async (docId) => {
        const doc = docs.find((d) => d.id === docId);
        if (!doc) return;
        if (!window.confirm("Apagar o progresso salvo deste arquivo? Isso não muda o que está na tela agora.")) return;
        try {
          await window.storage.delete(`cs3progress:${doc.project}:${doc.fileName}`, false);
          setRestoredNote("Progresso salvo apagado.");
        } catch (e) {
          console.error(e);
        }
      };

      // --- Editor de Cenas (Fase 2): handlers -------------------------------
      // Reaproveita EXATAMENTE o mesmo padrão de buildTranslatedWorkbook: relê
      // os bytes originais guardados em originalDataMapRef (o MESMO .xlsx que
      // o SenScriptsDecompiler gerou), sem precisar de nenhum comando novo do
      // Tauri pra isso — só pra decompilar/recompilar .dat é que precisa.
      const openSceneEditor = useCallback(() => {
        if (!activeDoc) return;
        const originalData = originalDataMapRef.current.get(activeDoc.id);
        if (!originalData) {
          setSceneMessage("Não achei os bytes originais deste arquivo — reabra o .xlsx.");
          return;
        }
        try {
          const wb = XLSX.read(originalData, { type: "array" });
          const sheetName = wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const parsed = parseSceneSheet(ws, XLSX);
          setSceneModel({ docId: activeDoc.id, sheetName, ws, functions: parsed.functions, orphanInstructions: parsed.orphanInstructions });
          setSceneEdits({});
          setSceneSelectedFuncIndex(null);
          setSceneSearch("");
          setSceneMessage(null);
          setActivePanel("cenas");
        } catch (e) {
          console.error(e);
          setSceneMessage("Não consegui ler a estrutura de cena deste arquivo: " + (e && e.message ? e.message : e));
        }
      }, [activeDoc]);

      const sceneParamChange = useCallback((row, col, value) => {
        setSceneEdits((prev) => ({ ...prev, [`${row}:${col}`]: value }));
        setSceneModel((prev) => {
          if (!prev) return prev;
          const functions = prev.functions.map((fn) => {
            if (!fn.instructions.some((i) => i.row === row)) return fn;
            return {
              ...fn,
              instructions: fn.instructions.map((instr) =>
                instr.row !== row
                  ? instr
                  : { ...instr, params: instr.params.map((p) => (p.col === col ? { ...p, value } : p)) }
              ),
            };
          });
          return { ...prev, functions };
        });
      }, []);

      // Monta a planilha editada (aplica todas as edições pendentes) e devolve
      // { wb, filename, bytes } — usado tanto pra baixar quanto pra recompilar.
      const buildEditedSceneWorkbook = useCallback(() => {
        if (!sceneModel) return null;
        const editsArray = Object.entries(sceneEdits).map(([key, value]) => {
          const [row, col] = key.split(":").map(Number);
          return { row, col, value };
        });
        const editedWs = applySceneEditsToWorksheet(sceneModel.ws, XLSX, editsArray);
        const wb = { SheetNames: [sceneModel.sheetName], Sheets: { [sceneModel.sheetName]: editedWs } };
        const doc = docs.find((d) => d.id === sceneModel.docId);
        const filename = `${baseName((doc && doc.fileName) || "cena")}_editado.xlsx`;
        const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        return { wb, filename, bytes, editedWs };
      }, [sceneModel, sceneEdits, docs]);

      const saveSceneXlsx = useCallback(async () => {
        const built = buildEditedSceneWorkbook();
        if (!built) return;
        setSceneSaving(true);
        try {
          const blob = new Blob([built.bytes], { type: "application/octet-stream" });
          await saveBlobToDisk(
            blob,
            built.filename,
            "Planilha Excel",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            [".xlsx"]
          );
          setSceneMessage(`Baixado: ${built.filename} (${Object.keys(sceneEdits).length} célula(s) editada(s)). Recompile com o SenScriptsDecompiler pra virar .dat de novo.`);
        } finally {
          setSceneSaving(false);
        }
      }, [buildEditedSceneWorkbook, sceneEdits]);

      // Abaixo, só funciona dentro do app Windows (Tauri) — window.__TAURI__
      // só existe lá. No navegador comum esses botões nem aparecem (ver
      // isTauriRuntime() no componente).
      const pickSceneDecompilerFolder = useCallback(async () => {
        if (!window.__TAURI__) return;
        try {
          const picked = await window.__TAURI__.dialog.open({ directory: true, multiple: false, title: "Pasta do SenScriptsDecompiler.exe" });
          if (picked) setSettings((s) => ({ ...s, sceneDecompilerFolder: Array.isArray(picked) ? picked[0] : picked }));
        } catch (e) {
          console.error(e);
        }
      }, []);

      const openDatFile = useCallback(async () => {
        if (!window.__TAURI__ || !settings.sceneDecompilerFolder) {
          setSceneMessage("Configure a pasta do SenScriptsDecompiler em Configurações antes de abrir um .dat direto.");
          return;
        }
        try {
          const picked = await window.__TAURI__.dialog.open({
            multiple: false,
            title: "Escolher arquivo .dat",
            filters: [{ name: "Script CS3", extensions: ["dat"] }],
          });
          if (!picked) return;
          const datPath = Array.isArray(picked) ? picked[0] : picked;
          setSceneRecompiling(true);
          setSceneMessage("Decompilando " + datPath.split(/[\\/]/).pop() + "…");
          const xlsxPath = await window.__TAURI__.core.invoke("decompile_dat", {
            exeDir: settings.sceneDecompilerFolder,
            game: "CS3",
            datPath,
          });
          const bytes = await window.__TAURI__.core.invoke("read_file_bytes", { path: xlsxPath });
          const buf = new Uint8Array(bytes).buffer;
          await handleFiles([new File([buf], xlsxPath.split(/[\\/]/).pop(), { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })]);
          setSceneMessage("Decompilado e aberto: " + xlsxPath);
        } catch (e) {
          console.error(e);
          setSceneMessage("Falha ao decompilar: " + (e && e.message ? e.message : e));
        } finally {
          setSceneRecompiling(false);
        }
      }, [settings.sceneDecompilerFolder, handleFiles]);

      const recompileScene = useCallback(async () => {
        if (!window.__TAURI__ || !settings.sceneDecompilerFolder || !sceneModel) return;
        const built = buildEditedSceneWorkbook();
        if (!built) return;
        setSceneRecompiling(true);
        setSceneMessage("Recompilando…");
        try {
          const bytesArray = Array.from(new Uint8Array(built.bytes));
          const datPath = await window.__TAURI__.core.invoke("recompile_xlsx", {
            exeDir: settings.sceneDecompilerFolder,
            game: "CS3",
            xlsxBytes: bytesArray,
            suggestedName: built.filename,
          });
          setSceneMessage("Recompilado com sucesso: " + datPath);
        } catch (e) {
          console.error(e);
          setSceneMessage("Falha ao recompilar: " + (e && e.message ? e.message : e));
        } finally {
          setSceneRecompiling(false);
        }
      }, [settings.sceneDecompilerFolder, sceneModel, buildEditedSceneWorkbook]);

      const removeDoc = useCallback((docId) => {
        setDocs((prev) => {
          const next = prev.filter((d) => d.id !== docId);
          setActiveId((prevActive) => (prevActive === docId ? (next.length > 0 ? next[0].id : null) : prevActive));
          return next;
        });
        originalDataMapRef.current.delete(docId);
      }, []);

      const exportWorklist = (doc) => {
        const rows = [["Célula", "Location", "Tipo", "Texto Original", "Tradução (PT-BR)"]];
        for (const e of doc.entries) {
          if (doc.ignored[e.ref]) continue;
          const tipo = "dialog";
          rows.push([e.ref, e.location, tipo, e.original, doc.translations[e.ref] || ""]);
        }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 70 }, { wch: 70 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Textos para Traduzir");
        downloadWorkbook(wb, `${safeForFilename(doc.project)}_${baseName(doc.fileName)}_lista_traducao.xlsx`);
      };

      const exportGlossary = () => {
        // conta quantas vezes cada código realmente aparece nos arquivos carregados
        const counts = new Map(); // code -> count
        for (const doc of docs) {
          for (const e of doc.entries) {
            for (const code of e.codes) {
              counts.set(code, (counts.get(code) || 0) + 1);
            }
          }
        }

        const grouped = new Map(); // classification key -> [{code, count}]
        for (const [code, count] of counts.entries()) {
          const cls = classifyCode(code);
          if (!grouped.has(cls.key)) grouped.set(cls.key, { cls, items: [] });
          grouped.get(cls.key).items.push({ code, count });
        }

        const lines = [];
        lines.push("=".repeat(72));
        lines.push("TLoH: Trails of Cold Steel Tradutor — Glossário de Códigos do Jogo");
        lines.push("=".repeat(72));
        lines.push("");
        lines.push("Gerado a partir dos arquivos carregados nesta sessão em " + new Date().toLocaleString("pt-BR") + ".");
        lines.push("");
        lines.push("IMPORTANTE: estes códigos controlam o jogo (expressão do retrato,");
        lines.push("formatação de texto, quebras de linha etc.) e NÃO devem ser traduzidos");
        lines.push("ou alterados. O app já os protege automaticamente na tradução");
        lines.push("automática — isto aqui é só uma referência de consulta.");
        lines.push("");
        lines.push("Legenda de confiança:");
        lines.push("  [confirmado]  — confirmado pelo código-fonte do SenScriptsDecompiler");
        lines.push("  [inferido]    — dedução razoável a partir do padrão de uso, não oficial");
        lines.push("  [desconhecido]— função ainda não documentada, use com cautela");
        lines.push("");

        if (counts.size === 0) {
          lines.push("(Nenhum código encontrado nos arquivos carregados até agora.)");
        } else {
          const sortedGroups = Array.from(grouped.values()).sort((a, b) => {
            const order = { confirmado: 0, inferido: 1, desconhecido: 2 };
            return (order[a.cls.confidence] ?? 3) - (order[b.cls.confidence] ?? 3);
          });
          for (const group of sortedGroups) {
            lines.push("-".repeat(72));
            lines.push(`${group.cls.label}  [${group.cls.confidence}]`);
            lines.push(group.cls.note);
            lines.push("-".repeat(72));
            const items = group.items.sort((a, b) => b.count - a.count);
            for (const { code, count } of items) {
              lines.push(`  ${code}   (encontrado ${count}x)`);
            }
            lines.push("");
          }
        }

        lines.push("=".repeat(72));
        lines.push("Fonte da estrutura dos códigos: código-fonte público do");
        lines.push("SenScriptsDecompiler (TwnKey), função reading_dialog.");
        lines.push("https://github.com/TwnKey/SenScriptsDecompiler");
        lines.push("=".repeat(72));

        downloadTextFile(lines.join("\n"), "glossario_codigos_TLoH.txt");
      };

      // documento de referência do glossário de termos (nomes, habilidades,
      // itens, lugares) pra time inteiro usar o mesmo padrão de tradução —
      // conta quantas vezes cada termo realmente aparece nos arquivos abertos
      const exportTermsGlossary = () => {
        const counts = new Map(); // term -> count
        for (const pn of properNouns) {
          const term = (pn.term || "").trim();
          if (!term) continue;
          const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const re = new RegExp(`\\b${escaped}\\b`, "gi");
          let n = 0;
          for (const doc of docs) {
            for (const e of doc.entries) {
              const matches = e.original.match(re);
              if (matches) n += matches.length;
            }
          }
          counts.set(term, n);
        }

        const lines = [];
        lines.push("=".repeat(72));
        lines.push("TLoH: Trails of Cold Steel Tradutor — Glossário de Termos");
        lines.push("=".repeat(72));
        lines.push("");
        lines.push("Gerado a partir dos termos cadastrados em \"Glossário de termos\" e dos");
        lines.push("arquivos abertos nesta sessão em " + new Date().toLocaleString("pt-BR") + ".");
        lines.push("");
        lines.push("Nomes de personagem/lugar, habilidades, itens e títulos com tradução fixa");
        lines.push("definida — usados automaticamente na tradução automática, e conferidos");
        lines.push("pela aba \"Verificar qualidade\" nas traduções digitadas manualmente.");
        lines.push("");

        if (properNouns.length === 0) {
          lines.push("(Nenhum termo cadastrado ainda.)");
        } else {
          const sorted = [...properNouns].sort((a, b) => a.term.localeCompare(b.term, "pt-BR"));
          for (const pn of sorted) {
            const term = (pn.term || "").trim();
            const translation = (pn.translation || "").trim();
            const count = counts.get(term) || 0;
