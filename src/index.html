<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLoH: Trails of Cold Steel Tradutor</title>

  <!-- Configurações PWA (Para parecer app de verdade no Edge / Chrome) -->
  <meta name="application-name" content="TLoH: Trails of Cold Steel Tradutor">
  <meta name="theme-color" content="#12141C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Bibliotecas Externas (React, Babel, XLSX) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #1B160F;
    }

    .app-root {
      --bg-void: #12141C;
      --bg-panel: #1A1D29;
      --bg-panel-raised: #232838;
      --card-bg: #F5F1E4;
      --card-border: #D6C9A3;
      --ink: #241C14;
      --ink-soft: #6B5E48;
      --text-onDark: #EAE6D9;
      --text-onDark-soft: #8890A4;
      --accent-amber: #C9A227;
      /* 1.5: o teal foi REBAIXADO. Ele estava em uso como quarta cor de
         destaque sem nenhum papel semântico — e é justamente esse tipo de
         cor "a mais" que faz uma tela parecer montada por acumulação em vez
         de projetada. Vira um azul-acinzentado de INFORMAÇÃO NEUTRA (links,
         dicas), enquanto âmbar fica como única cor de marca, brick como
         destrutivo/crítico e sage como sucesso/verificado. */
      --accent-info: #7C90AE;
      --accent-teal: var(--accent-info); /* alias: mantém quem já referenciava */
      --accent-brick: #A6242E;
      --accent-brick-text: #E08A93; /* item 3.2 auditoria UX — 7.2:1 sobre --bg-void, para uso em texto */
      --accent-sage: #5C8A5C;
      --hairline: #2C3040;

      /* ------------------------------------------------------------------
         ESCALA TIPOGRÁFICA (parte 1.1 da análise de UI)
         Antes existiam 13 tamanhos soltos no arquivo, vários separados por
         meio pixel (10px vs 10.5px). Meio pixel não comunica hierarquia
         nenhuma — o olho lê como inconsistência, não como "um nível acima".
         Seis degraus, cada um com um papel definido.
         ------------------------------------------------------------------ */
      --fs-micro: 10px;    /* selos, contadores, badges */
      --fs-meta: 11.5px;   /* rótulos de campo, notas auxiliares */
      --fs-body: 13px;     /* corpo padrão da interface */
      --fs-read: 15px;     /* texto original e tradução — o que se lê por horas */
      --fs-title: 20px;
      --fs-hero: 28px;

      /* RAIOS (1.2) — antes 3px, 4px, 6px e 999px conviviam sem critério.
         3 e 4 juntos é ruído: ninguém percebe a diferença, mas o conjunto
         fica sujo. */
      --radius-sm: 4px;    /* selos, chips, campos */
      --radius-md: 8px;    /* cartões e painéis */
      --radius-pill: 999px;

      /* ESPAÇAMENTO — base 4px */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;

      /* MOVIMENTO (1.3) — 140ms é "responsivo"; 300ms já parece lento */
      --motion: 140ms;

      /* PROFUNDIDADE (1.4) — numa metáfora de papel sobre a mesa, papel
         projeta sombra. Antes tudo era delimitado só por linha de 1px, o
         que achatava o cartão de diálogo ao mesmo peso visual de um painel
         de configuração. */
      --shadow-card: 0 1px 2px rgba(0,0,0,0.28), 0 6px 18px -8px rgba(0,0,0,0.5);
      --shadow-card-focus: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -10px rgba(0,0,0,0.6);

      /* Densidade (1.8): alternável entre confortável e compacto. Quem
         traduz do zero quer respiro; quem revisa 5.000 linhas quer densidade. */
      --card-pad-y: 14px;
      --card-pad-x: 16px;

      font-family: 'Lora', Georgia, serif;
      background: var(--bg-void);
      color: var(--text-onDark);
      min-height: 100vh;
      padding: 28px 20px 60px;
      box-sizing: border-box;
    }
    .app-root * { box-sizing: border-box; }
    @keyframes progressSheen {
      0% { background-position: 0% 0; }
      100% { background-position: -200% 0; }
    }
    .app-root.density-compact {
      --card-pad-y: 8px;
      --card-pad-x: 12px;
    }

    /* ------------------------------------------------------------------
       MOVIMENTO (1.3) — o arquivo tinha 4 transições no total; hover, foco,
       abrir painel e marcar verificado trocavam de estado instantaneamente.
       Interface que "pisca" em vez de responder é o que separa uma tela
       funcional de uma tela cara.
       ------------------------------------------------------------------ */
    .app-root .btn,
    .app-root .chip,
    .app-root .card,
    .app-root .card-status-btn,
    .app-root .verify-toggle-btn,
    .app-root .close-x,
    .app-root .file-item,
    .app-root .suggestion-chip,
    .app-root .link-btn,
    .app-root .memory-item-forget,
    .app-root input,
    .app-root select,
    .app-root textarea {
      transition: background-color var(--motion) ease,
                  border-color var(--motion) ease,
                  color var(--motion) ease,
                  box-shadow var(--motion) ease,
                  transform var(--motion) ease,
                  opacity var(--motion) ease;
    }
    .app-root .btn:active:not(:disabled),
    .app-root .chip:active,
    .app-root .card-status-btn:active,
    .app-root .verify-toggle-btn:active { transform: translateY(1px); }

    /* Quem configurou o sistema pra reduzir movimento não deve receber
       nenhum — inclusive as animações de progresso. */
    @media (prefers-reduced-motion: reduce) {
      .app-root *,
      .app-root *::before,
      .app-root *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

    .shell { max-width: 96%; margin: 0 auto; }

    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 2px solid var(--accent-brick);
      padding-bottom: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      position: relative;
    }
    .masthead::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 64px;
      height: 2px;
      background: var(--accent-amber);
    }
    .masthead-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-brick-text); /* era var(--accent-brick) — item 3.2 auditoria UX */
    }
    .masthead h1 {
      margin: 5px 0 0;
      font-family: 'Cinzel', 'Lora', serif;
      font-weight: 600;
      font-size: var(--fs-hero);
      letter-spacing: 0.02em;
      color: var(--text-onDark);
    }
    .masthead-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      max-width: 280px;
      text-align: right;
      line-height: 1.5;
    }

    /* --- Drop zone --- */
    .dropzone {
      border: 1.5px dashed var(--hairline);
      border-radius: var(--radius-sm);
      padding: 48px 24px;
      text-align: center;
      background: var(--bg-panel);
      transition: border-color .15s ease, background .15s ease;
      cursor: pointer;
      display: block;
    }
    .dropzone.drag { border-color: var(--accent-amber); background: var(--bg-panel-raised); }
    .dropzone-icon { color: var(--accent-amber); margin-bottom: 14px; display: flex; justify-content: center; }
    .dropzone h2 {
      font-family: 'Lora', serif;
      font-size: var(--fs-title);
      font-weight: 600;
      color: var(--text-onDark);
      margin: 0 0 6px;
    }
    .dropzone p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      color: var(--text-onDark-soft);
      margin: 0;
    }
    .hidden-input { display: none; }

    .error-box {
      margin-top: 16px;
      border: 1px solid var(--accent-brick);
      background: rgba(190,106,75,0.12);
      color: #E8B8A6;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    /* --- file bar --- */
    .filebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .filebar-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      color: var(--text-onDark);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filebar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* --- barra de download: separada do resto da toolbar de propósito, pra
       "baixar o arquivo traduzido" nunca se perder no meio de 15 outros
       botões (motor, QA, desfazer, lote...). O download é o objetivo final
       de quem usa o app, por isso ganha destaque visual próprio. --- */
    /* Coluna da direita: o bloco empilha em vez de espalhar na horizontal.
       Cada botão ocupa a largura toda, o que também dá alvo de clique maior
       e deixa a leitura vertical (que é como se lê uma lista de opções). */
    .download-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--sp-2);
      margin: 0 0 var(--sp-3);
      padding: var(--sp-3);
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-left: 3px solid var(--accent-amber);
      border-radius: var(--radius-md);
    }
    .download-bar .btn {
      width: 100%;
      justify-content: flex-start;
    }
    .download-bar-primary,
    .download-bar-extra {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      min-width: 0;
    }
    /* separador sutil entre as saídas principais e as auxiliares */
    .download-bar-extra {
      padding-top: var(--sp-2);
      border-top: 1px solid var(--hairline);
    }
    .download-bar-progress {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--accent-amber);
      padding: var(--sp-1) 0;
    }
    .download-bar-hint {
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      line-height: 1.55;
      padding-top: var(--sp-2);
      border-top: 1px solid var(--hairline);
    }
    .download-bar-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-amber);
      flex-shrink: 0;
      padding-bottom: var(--sp-1);
      border-bottom: 1px solid var(--hairline);
    }
    /* as regras de layout da barra de download vivem lá em cima, na versão
       em coluna — aqui ficou só o que é específico dos botões auxiliares */
    .download-bar-extra .btn { font-size: var(--fs-meta); padding: 6px 9px; }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--accent-teal);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      cursor: pointer;
      text-decoration: underline;
    }
    .link-btn:hover { color: var(--accent-amber); }


    .btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body); /* era 11.5px — item 3.1 da auditoria UX */
      letter-spacing: 0.03em;
      border: 1px solid var(--hairline);
      background: var(--bg-panel-raised);
      color: var(--text-onDark);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color .12s ease, color .12s ease, background .12s ease;
    }
    .btn:hover { border-color: var(--accent-amber); color: var(--accent-amber); }
    .btn:focus-visible { outline: 2px solid var(--accent-amber); outline-offset: 2px; }
    /* auditoria 4.2: .chip, .card-status-btn, .verify-toggle-btn e .link-btn
       só tinham :hover, sem NENHUM indicador visual de foco — quem navega
       só por teclado (o app já tem vários atalhos: Ctrl+Enter, Ctrl+I,
       Ctrl+M, Ctrl+Z, Ctrl+Shift+Z) não tinha como saber qual botão estava
       focado nesses casos. */
    .chip:focus-visible,
    .card-status-btn:focus-visible,
    .verify-toggle-btn:focus-visible,
    .link-btn:focus-visible {
      outline: 2px solid var(--accent-amber);
      outline-offset: 2px;
    }
    .btn.primary { background: var(--accent-amber); color: #241A0A; border-color: var(--accent-amber); font-weight: 600; }
    .btn.primary:hover { background: #D9B84A; color: #241A0A; }
    .btn.subtle { background: transparent; }
    .btn.danger:hover { border-color: var(--accent-brick); color: var(--accent-brick); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { border-color: var(--hairline); color: var(--text-onDark); }

    /* --- stats --- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 1px;
      background: var(--hairline);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--bg-panel);
      padding: 12px 14px;
    }
    .stat .num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-title);
      font-weight: 600;
    }
    .stat .lbl {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-onDark-soft);
      margin-top: 2px;
    }
    .stat.c-total .num { color: var(--text-onDark); }
    .stat.c-done .num { color: var(--accent-sage); }
    .stat.c-pending .num { color: var(--accent-brick-text); } /* era var(--accent-brick) — item 3.2 auditoria UX */
    .stat.c-ignored .num { color: var(--text-onDark-soft); }

    .progress-track {
      height: 5px;
      background: var(--bg-panel-raised);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--hairline);
    }
    .progress-fill {
      height: 100%;
      /* 1.8: âmbar (marca) -> sage (sucesso) conta a história do progresso
         com as cores que já têm significado no app. O brilho que desliza dá
         a sensação de "trabalhando" que um retângulo estático não dá. */
      background: linear-gradient(90deg, var(--accent-amber), var(--accent-sage));
      background-size: 200% 100%;
      animation: progressSheen 2.2s linear infinite;
      transition: width .3s ease;
    }

    .note {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--accent-teal);
      margin: -8px 0 18px;
    }

    /* --- resultados de busca no projeto inteiro --- */
    .project-result-file-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--ink-soft);
      margin: 4px 0 -6px;
    }
    .project-result-open {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--accent-teal);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      cursor: pointer;
      padding: 2px 4px;
    }
    .project-result-open:hover { text-decoration: underline; }

    /* --- toolbar --- */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    .search-box {
      flex: 1 1 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-onDark);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      width: 100%;
    }
    .search-box input::placeholder { color: var(--text-onDark-soft); }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body); /* era 11px — item 3.1 da auditoria UX */
      padding: 7px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--hairline);
      background: var(--bg-panel);
      color: var(--text-onDark-soft);
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      background: rgba(215,154,59,0.1);
    }

    /* --- cards --- */
    .cards { display: flex; flex-direction: column; gap: 14px; }

    .card {
      position: relative;
      background: var(--card-bg);
      color: var(--ink);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 14px rgba(0,0,0,0.28);
      padding: 16px 18px 16px 22px;
      animation: cardIn .25s ease both;
      transition: box-shadow .12s ease;
    }
    /* auditoria 4.3: destaque forte no cartão com o foco dentro dele —
       facilita "achar o lugar" depois de olhar pra outro lugar da tela numa
       sessão longa de tradução */
    .card:focus-within {
      box-shadow: 0 6px 14px rgba(0,0,0,0.28), inset 3px 0 0 var(--accent-amber);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .card::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 18px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bg-void);
      box-shadow: 0 22px 0 var(--bg-void);
    }

    .card-tab {
      position: absolute;
      top: -1px;
      right: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 0 0 3px 3px;
      color: #fff;
    }
    .card-tab.dialog { background: var(--accent-amber); color: #2A1D06; }

    .card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--ink-soft);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dotted var(--card-border);
    }
    .card-head .ref { font-weight: 600; color: var(--ink); }
    .card-position {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      color: var(--text-onDark-soft);
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      padding: 1px 7px;
    }

    .card-status-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--ink-soft);
      padding: 3px 6px;
      border-radius: var(--radius-sm);
    }
    .card-status-btn:hover { background: rgba(0,0,0,0.06); }
    .auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      color: #8A5A1E;
      background: rgba(215,154,59,0.18);
      border: 1px solid rgba(215,154,59,0.4);
      padding: 2px 7px;
      border-radius: var(--radius-pill);
    }

    .batch-panel {
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .batch-panel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      color: var(--text-onDark);
      margin-bottom: 8px;
    }
    .batch-panel .progress-track { margin-bottom: 8px; }
    .batch-panel-note {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body); /* era 10.5px — item 3.1 da auditoria UX */
      color: var(--text-onDark-soft);
      line-height: 1.6;
    }

    .field-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta); /* era 9.5px — item 3.1 da auditoria UX (legibilidade) */
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .original-text {
      font-family: 'Lora', serif;
      font-size: var(--fs-read); /* era 15px — item 3.1 da auditoria UX */
      line-height: 1.65; /* era 1.5 */
      white-space: pre-wrap;
      margin: 0 0 14px;
      color: var(--ink);
      max-width: 72ch; /* 1.6: acima de ~75 caracteres o olho perde o ponto de retorno ao quebrar a linha */
      /* auditoria 4.3: tom de fundo sutil diferencia visualmente "original"
         de "tradução" numa sessão longa, sem precisar reler o field-label
         toda vez pra saber em qual campo o olho está */
      background: rgba(0,0,0,0.025);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
    }

    .translation-area {
      width: 100%;
      font-family: 'Lora', serif;
      font-size: var(--fs-read); /* era 15px — item 3.1 da auditoria UX */
      line-height: 1.65; /* era 1.5 */
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--card-border);
      resize: vertical;
      min-height: 44px;
      padding: 2px 0 8px;
      color: var(--ink);
      outline: none;
      max-width: 72ch; /* 1.6: acima de ~75 caracteres o olho perde o ponto de retorno ao quebrar a linha */
    }
    .translation-area:focus { border-bottom-color: var(--accent-teal); }
    .translation-area::placeholder { color: #7A6748; font-style: italic; } /* era #B5A985 (2.07:1) -> 4.81:1 */

    .card.ignored { opacity: 0.55; }
    .card.ignored .translation-area { text-decoration: line-through; }

    /* --- pagination --- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      color: var(--text-onDark-soft);
      flex-wrap: wrap;
    }
    .pagination-top {
      margin-top: 0;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--hairline);
    }
    .pagination button {
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      color: var(--text-onDark);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      cursor: pointer;
      display: inline-flex;
    }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-jump-select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      background: var(--bg-panel);
      color: var(--text-onDark);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 5px 7px;
    }

    .page-size-select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      background: var(--bg-panel);
      color: var(--text-onDark);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-onDark-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
    }

    /* --- multi-file tabs --- */
    .project-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
    }
    .project-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      background: var(--bg-panel-raised);
      color: var(--accent-amber);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      min-width: 140px;
    }
    .project-input:focus { outline: none; border-color: var(--accent-amber); }
    .project-hint {
      font-size: var(--fs-micro);
      color: var(--text-onDark-soft);
      opacity: 0.75;
    }
    .rename-project-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      cursor: pointer;
    }
    .rename-project-btn:hover { border-color: var(--accent-amber); color: var(--accent-amber); }

    /* --- layout em duas colunas: sidebar fixa + área principal --- */
    .layout-grid {
      display: grid;
      grid-template-columns: 280px 1fr 350px;
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 40px);
      min-width: 0;
    }
    .sidebar .project-bar {
      margin-bottom: 0;
      flex-wrap: wrap;
    }
    .sidebar .project-hint { display: none; } /* sem espaço sobrando na coluna estreita */
    .sidebar-right {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    /* Banner de falha de gravação: fica GRUDADO no topo e não some sozinho.
       É o único aviso do app que justifica esse peso — os outros são sobre a
       tradução, este é sobre perder o trabalho todo. */
    /* ------------------------------------------------------------------
       TOASTS (item B3 da auditoria #2, implementado em parte)
       Substituem os 36 window.alert de RESULTADO. Os alert nativos travavam
       a aba inteira — inclusive no meio de um lote de tradução, onde o loop
       ficava parado esperando alguém clicar em "OK". Os window.confirm de
       ação destrutiva continuam nativos de propósito (ver nota na entrega).
       ------------------------------------------------------------------ */
    .toast-stack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      max-width: min(420px, calc(100vw - 40px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--hairline);
      border-left: 3px solid var(--accent-info);
      background: var(--bg-panel-raised);
      color: var(--text-onDark);
      font-size: var(--fs-body);
      line-height: 1.55;
      box-shadow: 0 8px 28px -10px rgba(0,0,0,0.75);
      animation: toastIn 200ms ease both;
    }
    .toast.ok { border-left-color: var(--accent-sage); }
    .toast.warn { border-left-color: var(--accent-amber); }
    .toast.err { border-left-color: var(--accent-brick); }
    .toast-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-onDark-soft);
      cursor: pointer;
      padding: 0 2px;
      font-size: var(--fs-body);
      line-height: 1;
      flex-shrink: 0;
    }
    .toast-close:hover { color: var(--text-onDark); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* 1.8: alternador de densidade */
    /* 1.7: classes utilitárias no lugar dos style={{ fontSize / padding /
       color }} espalhados. Cada inline daquele era um ponto onde a escala
       escapava do sistema — e a razão pela qual havia 13 tamanhos de fonte
       no arquivo. */
    .u-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
    }
    .u-micro {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      color: var(--text-onDark-soft);
    }
    .u-micro-inline {
      font-size: var(--fs-micro);
      vertical-align: middle;
    }
    .btn.btn-xs {
      padding: var(--sp-1) var(--sp-2);
      font-size: var(--fs-meta);
      flex-shrink: 0;
    }

    .density-toggle {
      display: inline-flex;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .density-toggle button {
      background: none;
      border: none;
      color: var(--text-onDark-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      padding: 3px 10px;
      cursor: pointer;
    }
    .density-toggle button.on {
      background: var(--accent-amber);
      color: #241C14;
    }

    .save-error-banner {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(201,138,110,0.55);
      border-left: 4px solid #C98A6E;
      border-radius: var(--radius-sm);
      background: rgba(201,138,110,0.14);
      color: var(--text-onDark);
      font-size: var(--fs-body);
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }
    .save-error-detail {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      margin-top: 4px;
      word-break: break-all;
    }
    .sidebar-right-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 32px 18px;
      border: 1px dashed var(--hairline);
      border-radius: var(--radius-md);
      color: var(--text-onDark-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      line-height: 1.6;
    }
    .main-content {
      min-width: 0; /* evita que conteúdo largo (cartões, tabelas) estoure a coluna do grid */
    }
    .global-progress {
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .global-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      margin-bottom: 6px;
    }
    .global-progress .progress-track { margin: 0 0 6px; }
    .global-progress-note {
      font-size: var(--fs-micro);
      color: var(--text-onDark-soft);
    }
    .sidebar-files {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .sidebar-file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      color: var(--text-onDark-soft);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .sidebar-file-item.active {
      border-color: var(--accent-amber);
      color: var(--text-onDark);
      background: var(--bg-panel-raised);
    }
    .sidebar-file-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .sidebar-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-file-badges {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .sidebar-files .badge {
      background: var(--bg-panel-raised);
      border: 1px solid var(--hairline);
      color: var(--text-onDark-soft);
      font-size: var(--fs-micro);
      padding: 1px 5px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .sidebar-files .badge.zero { opacity: 0.35; }
    .sidebar-file-item .close-x {
      /* auditoria 4.1: virou <button> (era <span onClick>, não acessível por
         teclado) — reset do estilo padrão de botão do navegador pra ficar
         visualmente igual ao que era antes */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      padding: 2px;
      border-radius: 50%;
      flex-shrink: 0;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .sidebar-file-item .close-x:hover { opacity: 1; background: rgba(255,255,255,0.08); }
    .sidebar-file-item .close-x:focus-visible {
      opacity: 1;
      outline: 2px solid var(--accent-amber);
      outline-offset: 1px;
    }
    .sidebar .add-more-dropzone {
      width: 100%;
      justify-content: center;
      box-sizing: border-box;
    }

    @media (max-width: 900px) {
      .layout-grid { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        max-height: none;
      }
      .sidebar .project-hint { display: inline; }
      .sidebar-right {
        position: static;
        max-height: none;
      }
    }

    .files-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .file-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      background: var(--bg-panel);
      border: 1px solid var(--hairline);
      color: var(--text-onDark-soft);
      padding: 7px 8px 7px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    .file-tab-project {
      font-size: var(--fs-micro);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-amber);
      border: 1px solid rgba(201,162,39,0.4);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
    }
    .file-tab.active {
      border-color: var(--accent-amber);
      color: var(--text-onDark);
      background: var(--bg-panel-raised);
    }
    .file-tab .badge {
      background: var(--accent-brick);
      color: #fff;
      font-size: var(--fs-micro);
      padding: 1px 6px;
      border-radius: var(--radius-pill);
    }
    .file-tab .badge.zero { background: var(--accent-sage); }
    .file-tab .close-x {
      display: inline-flex;
      opacity: 0.6;
      padding: 2px;
      border-radius: 50%;
    }
    .file-tab .close-x:hover { opacity: 1; background: rgba(255,255,255,0.08); }
    .add-more-dropzone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      border: 1.5px dashed var(--hairline);
      color: var(--text-onDark-soft);
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    .add-more-dropzone:hover, .add-more-dropzone.drag { border-color: var(--accent-amber); color: var(--accent-amber); }

    .scope-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--text-onDark-soft);
      padding: 0 4px;
      user-select: none;
      cursor: pointer;
    }
    .scope-toggle input { accent-color: var(--accent-amber); }

    .lang-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      color: var(--ink-soft);
    }
    .lang-badge.lang-en { border-color: var(--accent-brick); color: #8A4A34; background: rgba(190,106,75,0.12); }
    .lang-badge.lang-pt { border-color: var(--accent-sage); color: #4F6B3F; background: rgba(116,145,94,0.12); }

    .lines-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-micro);
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      color: var(--ink-soft);
      background: rgba(0,0,0,0.04);
    }

    .warn-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body); /* era 10.5px — item 3.1 da auditoria UX */
      line-height: 1.6;
      color: #8A4A34;
      background: rgba(190,106,75,0.1);
      border: 1px solid rgba(190,106,75,0.3);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      margin-top: 8px;
    }
    .warn-note.critical {
      color: #A6242E;
      background: rgba(166,36,46,0.1);
      border-color: rgba(166,36,46,0.4);
      font-weight: 600;
    }

    /* --- painel de QA em formato de cartão (pedido do usuário: nota com
       espaço pra ler inteira, tradução editável ali mesmo) ---
       Duas colunas: original+tradução (esquerda, igual ao cartão normal de
       tradução) e a lista de problemas (direita, com largura fixa própria
       — é isso que resolve o corte de texto que existia antes, quando a
       nota dividia espaço com "tradução" numa grade de 5 colunas
       apertadas). Em telas estreitas vira 1 coluna só (mobile/janela
       pequena).

       Correção de contraste (2ª rodada, reportada pelo usuário): a
       primeira versão usava --bg-panel-raised (fundo ESCURO, cor de painel
       de navegação) só de hábito — mas .original-text/.translation-area
       usam --ink, uma tinta ESCURA calibrada pra ficar legível em cima do
       --card-bg CLARO do cartão normal de tradução (#F5F1E4). Tinta escura
       em cima de fundo escuro = quase ilegível, exatamente o que a captura
       de tela mostrou. Fix: .qa-card usa o MESMO fundo claro do cartão
       normal (--card-bg/--card-border/--ink) — o que também cumpre melhor
       o pedido original de "parecido com os cards de tradução", já que
       agora bate visualmente, não só no layout. */
    .qa-card {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      align-items: start;
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      box-shadow: 0 6px 14px rgba(0,0,0,0.28);
      padding: 14px 16px;
    }
    .qa-card-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-meta);
      color: var(--ink-soft);
      padding-bottom: 8px;
      border-bottom: 1px dotted var(--card-border);
    }
    .qa-card-head .ref { font-weight: 600; color: var(--ink); }
    .qa-card-main .original-text,
    .qa-card-main .translation-area { max-width: none; } /* a coluna já limita a largura sozinha */
    .qa-card-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0; /* permite a caixa de texto quebrar linha em vez de estourar a coluna */
    }
    /* Mesmas cores de .warn-note (calibradas pro fundo claro do cartão) —
       texto mais escuro que o fundo âmbar/vermelho translúcido garante
       contraste, diferente da versão anterior que herdava tom pensado pra
       fundo escuro. */
    .qa-issue-box {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-body);
      line-height: 1.55;
      color: #8A4A34;
      background: rgba(190,106,75,0.14);
      border: 1px solid rgba(190,106,75,0.35);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .qa-issue-box.critical {
      color: #A6242E;
      background: rgba(166,36,46,0.12);
      border-color: rgba(166,36,46,0.4);
      font-weight: 600;
    }
    .qa-issue-box-detail {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      white-space: normal; /* era nowrap+ellipsis no layout antigo — a causa do corte */
      word-break: break-word;
    }
    .qa-issue-box-detail svg { flex-shrink: 0; margin-top: 2px; }
    .qa-issue-box-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 760px) {
      .qa-card { grid-template-columns: 1fr; }
    }

    /* .btn e .file-tab-project foram desenhados pro fundo ESCURO do resto
       do app (cor de texto var(--text-onDark), clara) — dentro do
       .qa-card, que agora usa o fundo CLARO do cartão de tradução, essa
       mesma cor clara vira texto quase invisível em cima de fundo claro.
       Escopado só dentro de .qa-card pra não mexer em nenhum botão do
       resto do app (que continuam certos no fundo escuro deles). */
    .qa-card .btn {
      color: var(--ink-soft);
      border-color: var(--card-border);
    }
    .qa-card .btn:hover {
      color: #8A5A1E;
      border-color: var(--accent-amber);
    }
    .qa-card .btn.danger { color: #A6242E; }
    .qa-card .btn.danger:hover { color: #8C1D26; border-color: var(--accent-brick); }
    .qa-card .btn:disabled { color: var(--ink-soft); }
    .qa-card .file-tab-project {
      color: #8A5A1E; /* mesmo tom de .auto-badge — já calibrado pro fundo claro do cartão */
      border-color: rgba(138,90,30,0.4);
    }

    .similar-panel {
      margin: 8px 0;
      padding: 8px;
      background: rgba(0,0,0,0.03);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .similar-item {
      display: grid;
      grid-template-columns: auto 1fr auto;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useMemo, useEffect, useCallback, useDeferredValue } = React;

    // ---------------------------------------------------------------------------
    // Armazenamento: IndexedDB (em vez de localStorage)
    // ---------------------------------------------------------------------------
    // Por quê: localStorage tem limite baixo (~5-10MB, aperta rápido com
    // muitos projetos + memória de tradução grande) e é SÍNCRONO — escritas
    // grandes travam a aba por um instante. IndexedDB não tem esse teto e é
    // assíncrono de verdade. A interface (get/set/delete) continua igual, só
    // trocou o motor por baixo — o resto do app não precisa saber disso.
    const IDB_NAME = "tloh_translator_db";
    const IDB_STORE = "kv";
    let idbPromise = null;

    function openIDB() {
      if (idbPromise) return idbPromise;
      idbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error("IndexedDB indisponível neste navegador")); return; }
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(IDB_STORE)) {
            req.result.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return idbPromise;
    }

    async function idbGet(key) {
      try {
        const db = await openIDB();
        return await new Promise((resolve) => {
          const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(undefined);
        });
      } catch (e) {
        return undefined;
      }
    }

    // Auditoria #2 C1: antes esta função convertia QUALQUER falha em `false`
    // — cota do navegador estourada, aba anônima, base corrompida — e quem
    // chamava não tinha como distinguir "não salvou" de "salvou". Como
    // ninguém lia o retorno, uma falha de gravação era completamente
    // silenciosa e o tradutor só descobria ao recarregar a página, com
    // horas de trabalho perdidas. Agora ela devolve o erro real pra ser
    // propagado até a interface.
    async function idbSet(key, value) {
      try {
        const db = await openIDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).put(value, key);
          tx.oncomplete = () => resolve({ ok: true });
          tx.onerror = () => resolve({ ok: false, error: tx.error || new Error("transação de escrita rejeitada") });
          tx.onabort = () => resolve({ ok: false, error: tx.error || new Error("transação de escrita abortada") });
        });
      } catch (e) {
        return { ok: false, error: e };
      }
    }

    async function idbDelete(key) {
      try {
        const db = await openIDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).delete(key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }

    // migração automática, uma vez só: copia o que já existia no localStorage
    // (de sessões anteriores do app, antes dessa mudança) pro IndexedDB. Não
    // apaga o localStorage original — só não usa mais ele daqui pra frente.
    const LEGACY_KEY_PREFIXES = ["cs3progress:"];
    const LEGACY_EXACT_KEYS = ["cs3settings", "cs3_translation_memory", "cs3_proper_nouns", "cs3_active_project", "cs3_projects_list"];

    async function migrateLegacyLocalStorage() {
      try {
        const already = await idbGet("__migrated_from_localstorage__");
        if (already) return;
        const keysToCopy = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k) continue;
          if (LEGACY_EXACT_KEYS.includes(k) || LEGACY_KEY_PREFIXES.some((p) => k.startsWith(p))) {
            keysToCopy.push(k);
          }
        }
        for (const k of keysToCopy) {
          const v = localStorage.getItem(k);
          if (v !== null) await idbSet(k, v); // migração: falha aqui não é fatal, o dado legado continua no localStorage
        }
        await idbSet("__migrated_from_localstorage__", true);
      } catch (e) {
        console.error("Falha ao migrar dados antigos do localStorage:", e);
      }
    }

    const migrationPromise = migrateLegacyLocalStorage();

    // auditoria 3.4: os 3 métodos esperam a migração do localStorage — antes
    // só `get` esperava, o que abria uma janela estreita (só nos primeiros
    // instantes de vida da aba) onde um `set`/`delete` disparado antes da
    // migração terminar podia ser sobrescrito pelo dado legado migrado
    // logo em seguida, pra uma mesma chave.
    // Fila de avisos de falha de gravação. É module-level (e não estado do
    // React) porque quem grava são callbacks e effects espalhados; o
    // componente só se INSCREVE pra exibir. Auditoria #2 C1.
    // Por padrão o armazenamento do navegador é "best-effort": sob pressão
    // de espaço ele pode DESCARTAR o IndexedDB de um site sem avisar. Como
    // aqui mora horas de tradução, vale pedir o modo persistente logo no
    // boot. É um pedido — o navegador concede sozinho quando o site tem
    // sinal de engajamento (instalado, muito visitado) e pode recusar; a
    // falha é silenciosa de propósito, é só uma camada extra de proteção.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted()
        .then((already) => (already ? true : navigator.storage.persist()))
        .catch(() => false);
    }

    // Barramento de avisos não-bloqueantes (B3). Module-level, como
    // storageFailure: quem emite são callbacks espalhados; o componente só
    // se inscreve. `notify` é intencionalmente uma função global simples pra
    // que a troca dos 36 window.alert fosse mecânica — mesmo lugar de
    // chamada, mesma mensagem, só sem travar a aba.
    const toastBus = {
      listeners: new Set(),
      seq: 0,
      push(message, kind) {
        const toast = { id: ++this.seq, message: String(message), kind: kind || "info" };
        for (const fn of this.listeners) {
          try { fn(toast); } catch (e) {}
        }
        return toast.id;
      },
      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      },
    };

    function notify(message, kind) {
      toastBus.push(message, kind);
    }

    const storageFailure = {
      listeners: new Set(),
      last: null,
      report(key, error) {
        this.last = { key, error, at: Date.now() };
        for (const fn of this.listeners) {
          try { fn(this.last); } catch (e) { /* um listener quebrado não pode derrubar os outros */ }
        }
      },
      clear() {
        this.last = null;
        for (const fn of this.listeners) {
          try { fn(null); } catch (e) {}
        }
      },
      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      },
    };

    // "Grava e segue a vida" — usado por quem não pode/não quer esperar o
    // await (effects de settings, glossário, memória...). A diferença pro
    // `window.storage.set(...)` solto de antes é que a falha agora é
    // REGISTRADA e chega na interface, em vez de virar uma promessa
    // rejeitada que ninguém trata.
    function storageSetAndForget(key, value) {
      window.storage.set(key, value).then(
        () => storageFailure.clear(),
        (e) => {
          console.error(`Falha ao gravar "${key}":`, e);
          storageFailure.report(key, e);
        }
      );
    }

    window.storage = {
      get: async (key) => {
        await migrationPromise;
        const val = await idbGet(key);
        return val !== undefined ? { value: val } : null;
      },
      // Lança em vez de devolver null: um `null` ignorado foi exatamente o
      // que deixava a falha de gravação passar despercebida (auditoria #2 C1).
      set: async (key, value) => {
        await migrationPromise;
        const r = await idbSet(key, value);
        if (!r.ok) throw r.error || new Error("não foi possível gravar no armazenamento do navegador");
        return { key, value };
      },
      delete: async (key) => {
        await migrationPromise;
        const ok = await idbDelete(key);
        return ok ? { key, deleted: true } : null;
      },
    };

    // --- Ícones (Mock do Lucide React usando SVG Embutido) ---
    const Icon = ({ paths, size = 24, color = "currentColor", strokeWidth = 2, style, className, title }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
        {title && <title>{title}</title>}
        {paths}

    const PT_WORDS = new Set(["de","da","do","que","não","para","com","uma","um","os","as","dos","das","você","está","são","ele","ela","isso","esse","essa","muito","já","também","mas","se","na","no","pela","pelo","foi","ser","ter","como","seu","sua","nos","nas","eu","nós","meu","minha","aqui","ali","onde","quando","porque","então","até","depois","antes","sobre","entre","cada","todos","toda","todo","nenhum","nada","alguém","algo","obrigado","obrigada","olá","adeus","sim","não","por","favor",

    const EN_WORDS = new Set(["the","and","you","is","are","to","of","in","this","that","was","were","with","for","not","have","has","will","would","can","on","at","it","be","as","but","they","we","my","your","i","me","him","her","them","what","when","where","why","how","who","which","there","here","from","into","about","before","after","because","then","than","just","only","all","some","any","none","thanks","hello","goodbye","yes","no","please","get","got","let","its","don't","didn't","can't","i'm","you're",

    // ---------------------------------------------------------------------------
    // Fallback por trigrama de caracteres — mesma ideia clássica de Cavnar &

    const LANG_SAMPLE_PT =
      "Bem-vindo à academia. Hoje é um novo dia e todos os alunos precisam se preparar para o exame. " +
      "Rean caminhou até a sala e cumprimentou seus amigos com um sorriso. Ele sabia que não seria fácil, " +

    const LANG_SAMPLE_EN =
      "Welcome to the academy. Today is a new day and all the students need to prepare for the exam. Rean " +
      "walked to the classroom and greeted his friends with a smile. He knew it would not be easy, but he " +
      "was determined to do his best. The teacher explained that the mission would be dangerous and that " +
      "everyone should trust the other members of the team. We cannot give up now, she said, looking at the " +
      "group gathered in the courtyard. The sun shone over the campus while the students talked about their " +
      "plans for the weekend. Some wanted to visit the city, others preferred to rest and study a little " +
      "more before the next class. Suddenly, a strange noise caught everyone's attention. Could it be an " +
      "attack? someone asked, their voice full of worry. We need to check immediately, the instructor " +
      "replied, grabbing his sword and running toward the main gate. The tension in the air was palpable, " +
      "but nobody wanted to show fear in front of their classmates. Together, they would face whatever " +
      "challenge came their way, because that was the true strength of our class.";

    function buildTrigramCounts(text) {
      const counts = new Map();
      const words = text.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
      for (const w of words) {
        const padded = `_${w}_`;
        for (let i = 0; i < padded.length - 2; i++) {
          const tri = padded.slice(i, i + 3);
          counts.set(tri, (counts.get(tri) || 0) + 1);
        }
      }
      return counts;
    }

    function rankTrigrams(counts, limit) {
      const ranked = new Map();
      Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, limit)
        .forEach(([tri], idx) => ranked.set(tri, idx));
      return ranked;
    }

    const TRIGRAM_PROFILE_SIZE = 300;
    const TRIGRAM_OUT_OF_PLACE = TRIGRAM_PROFILE_SIZE; // penalidade pra trigrama ausente do perfil de referência
    const PT_TRIGRAM_PROFILE = rankTrigrams(buildTrigramCounts(LANG_SAMPLE_PT), TRIGRAM_PROFILE_SIZE);
    const EN_TRIGRAM_PROFILE = rankTrigrams(buildTrigramCounts(LANG_SAMPLE_EN), TRIGRAM_PROFILE_SIZE);

    // "out-of-place distance": soma, pra cada trigrama do texto de entrada, a
    // diferença entre a posição dele no ranking do texto e a posição dele no
    // perfil de referência (ou uma penalidade fixa se nem aparece no
    // perfil) — quanto menor a distância total, mais parecido o texto é
    // daquele idioma. Mesma técnica usada por classificadores clássicos de
    // idioma (Cavnar & Trenkle, 1994), só que com um perfil de referência
    // pequeno e embutido em vez de baixado de algum lugar.
    function trigramDistance(inputRanked, profile) {
      let distance = 0;
      for (const [tri, inputRank] of inputRanked) {
        const refRank = profile.has(tri) ? profile.get(tri) : TRIGRAM_OUT_OF_PLACE;
        distance += Math.abs(inputRank - refRank);
      }
      return distance;
    }

    // Margem mínima de confiança pra aceitar o veredito do trigrama.
    // Medido com frases reais dos dois idiomas e com linhas dominadas por
    // nome próprio (que era a origem do falso positivo relatado):
    //   português real ....... 40% a 78% de margem relativa
    //   inglês real .......... 30% a 72%
    //   nome próprio/ambíguo .. 9% a 28%   <- "Oh, Instrutor Schwarzer..."
    // 25% separa os dois grupos com folga dos dois lados.
    const TRIGRAM_MIN_MARGIN = 0.25;

    function detectLanguageByTrigram(text) {
      const counts = buildTrigramCounts(text);
      if (counts.size === 0) return null;
      const ranked = Array.from(rankTrigrams(counts, TRIGRAM_PROFILE_SIZE).entries());
      const ptDist = trigramDistance(ranked, PT_TRIGRAM_PROFILE);
      const enDist = trigramDistance(ranked, EN_TRIGRAM_PROFILE);
      if (ptDist === enDist) return null;

      // O trigrama SEMPRE devolve um vencedor, mesmo quando os dois perfis
      // estão praticamente empatados — e aí o "vencedor" é ruído. Numa linha
      // como "Oh, Instrutor Schwarzer...", que é quase só nome próprio, não
      // existe evidência de idioma nenhum: os dois perfis ficam a 9% um do
      // outro e o desempate vira sorteio. Era exatamente isso que marcava
      // linha em PORTUGUÊS como inglês no QA.
      const menor = Math.min(ptDist, enDist);
      const margemRelativa = menor > 0 ? Math.abs(ptDist - enDist) / menor : 0;
      if (margemRelativa < TRIGRAM_MIN_MARGIN) return null;

      return ptDist < enDist ? "pt" : "en";
    }

    function detectLanguage(text) {
      // remove códigos de controle do script e quebras de linha antes de analisar
      const stripped = text.replace(/#[A-Za-z0-9_\[\]]+/g, " ").replace(/[\r\n]+/g, " ");
      const lower = stripped.toLowerCase();
      const ptChars = (lower.match(/[ãõçáéíóúâêôàü]/g) || []).length;
      const tokens = lower.match(/[a-zà-ÿ']+/g) || [];
      let wordPtScore = 0;
      let wordEnScore = 0;
      for (const t of tokens) {
        const ehPt = PT_WORDS.has(t);
        const ehEn = EN_WORDS.has(t);
        // Palavra que existe nos DOIS idiomas ("as", "no", "do"...) não é
        // evidência de nenhum: contá-la pros dois lados só cria empate
        // artificial e joga a linha pra "unknown" à toa.
        if (ehPt && ehEn) continue;
        if (ehPt) wordPtScore += 1;
        if (ehEn) wordEnScore += 1;
      }

      // Evidência de PALAVRA reconhecida (artigo, pronome, preposição etc.)
      // é muito mais confiável que um acento sozinho — nome próprio
      // estilizado ou empréstimo em inglês (ex.: "café", "Beatriz") pode ter
      // acento sem a frase ser português. Por isso: se achou pelo menos uma
      // palavra reconhecida de um idioma e NENHUMA do outro, esse idioma
      // vence — mesmo que o texto tenha 1-2 acentos perdidos no meio.
      if (wordEnScore > 0 && wordPtScore === 0) return "en";
      if (wordPtScore > 0 && wordEnScore === 0) return "pt";
      if (wordPtScore > wordEnScore) return "pt";
      if (wordEnScore > wordPtScore) return "en";

      // Chegou aqui só quando NENHUMA palavra da lista foi reconhecida de
      // nenhum dos dois lados (empate 0-0) OU as duas listas empataram com
      // sinal real dos dois lados (frase mista/ambígua) — nesse segundo caso
      // é mais seguro devolver "unknown" (nunca é pulado do lote automático)
      // do que arriscar marcar como "pt" com base em pouca certeza.
      if (wordPtScore > 0 && wordPtScore === wordEnScore) return "unknown";

      // sinal fraco de verdade (0 palavras reconhecidas dos dois lados): usa
      // acento de verdade como pista de pt. O perfil de trigramas NÃO decide
      // mais "pt" sozinho nesse ponto — nome próprio/interjeição curta ("Alisa!",
      // "Fie...") pode compartilhar trigrama com palavras em português só por
      // coincidência estatística, e isso gerava falso positivo "pt" pra linha
      // que é claramente inglês (o motivo original desse bug reportado). O
      // trigrama só serve aqui pra puxar pra "en" quando há sinal disso;
      // fora isso, "unknown" é a resposta mais honesta (nunca é pulado do
      // lote automático).
      if (ptChars > 0) return "pt";

      // Guarda de COMPRIMENTO (a causa real dos falsos positivos "ainda em
      // inglês"): o perfil de trigramas precisa de amostra pra significar
      // alguma coisa. Em "Certo." são 4 trigramas — qualquer coincidência
      // vira "sinal", e o resultado é praticamente sorteio. Foi medido: das
      // traduções curtas corretas em português, 10% eram marcadas como
      // inglês por causa disso. Abaixo do mínimo, a resposta honesta é
      // "não sei" — e "unknown" nunca gera aviso nem é pulado do lote.
      const TRIGRAM_MIN_CHARS = 20;
      if (stripped.trim().length < TRIGRAM_MIN_CHARS) return "unknown";

      const byTrigram = detectLanguageByTrigram(stripped);
      return byTrigram === "en" ? "en" : "unknown";
    }

    // Coluna B de cada bloco é o "OP Code". Dois critérios juntos definem o
    // que é extraído (sem duplicar se um cair nos dois ao mesmo tempo):
    //  1) qualquer célula tipada "dialog" no cabeçalho, em QUALQUER linha —
    //     esse tipo já indica texto de diálogo, independente do OP Code.
    //  2) células tipadas "dialog" ou "string" especificamente nas linhas
    //     onde o OP Code vale 39 (confirmado na planilha como o opcode que
    //     imprime a string de diálogo).
    const DIALOG_OP_CODE = 39;
    const OP_CODE_COL = 1; // coluna B (índice 1, já que A=0)

    function parseWorkbook(workbook) {
      const sheetName = workbook.SheetNames[0];
      const ws = workbook.Sheets[sheetName];
      if (!ws) return { sheetName, entries: [] };

      const cellKeys = Object.keys(ws).filter((k) => k[0] !== "!");
      const byRow = new Map();
      for (const key of cellKeys) {
        const addr = XLSX.utils.decode_cell(key);
        if (!byRow.has(addr.r)) byRow.set(addr.r, []);
        byRow.get(addr.r).push({ c: addr.c, v: ws[key].v, ref: key });
      }
      const rowIndices = Array.from(byRow.keys()).sort((a, b) => a - b);

      let header = null;
      let currentLocation = null;
      const entries = [];
      let idCounter = 0;

      for (const r of rowIndices) {
        const cells = byRow.get(r).sort((a, b) => a.c - b.c);
        const colA = cells.find((c) => c.c === 0);

        if (colA && colA.v === "Location") {
          header = new Map();
          for (const cell of cells) {
            if (cell.v !== null && cell.v !== undefined && cell.v !== "") {
              header.set(cell.c, cell.v);
            }
          }
        } else if (header && colA && typeof colA.v === "number") {
          currentLocation = colA.v;
          const opCodeCell = cells.find((c) => c.c === OP_CODE_COL);
          const isDialogOp = !!opCodeCell && opCodeCell.v === DIALOG_OP_CODE;

          for (const cell of cells) {
            const t = header.get(cell.c);
            if (cell.v === null || cell.v === undefined || cell.v === "") continue;

            const byType = t === "dialog"; // tipo "dialog" sempre entra, seja qual for o OP Code
            const byOpCode = isDialogOp && (t === "dialog" || t === "string"); // OP 39 pega dialog OU string
            if (!byType && !byOpCode) continue;

            idCounter += 1;
            const original = String(cell.v);
            entries.push({
              id: idCounter,
              ref: cell.ref,
              row: r + 1,
              col: cell.c,
              type: t,
              location: currentLocation,
              original,
              lineCount: original.split(/\r\n|\r|\n/).length,
              lang: detectLanguage(original),
              codes: extractCodes(original),
            });
          }
        }
      }

      return { sheetName, entries };
    }

// ---------------------------------------------------------------------------
// Editor de Cenas (Fase 2 do app Windows) -- mesmas funções puras do
// core.js (parseSceneSheet/applySceneEditsToWorksheet/etc), mirror exato
// pra manter a mesma disciplina de testes: a lógica é testada contra dados
// reais em core.test.js, aqui é só a cópia que roda no navegador/WebView.
    const SCENE_NON_EDITABLE_PARAM_TYPES = new Set(["fill", "pointer", "Start", "End", "OP Code"]);
    function isEditableSceneParamType(type) {
      return typeof type === "string" && type !== "" && !SCENE_NON_EDITABLE_PARAM_TYPES.has(type);
    }

    const SCENE_OP_LABELS = {
      2: "Início de evento / sub-rotina",
      5: "Condição (branch)",
      22: "Espera (delay)",
      29: "Criar personagem",
      36: "Diálogo — texto",
      38: "Diálogo — fechar/continuar",
      39: "Diálogo — nome do interlocutor",
      41: "Opção de menu / ARCUS (variantes por sub-tipo)",
      47: "Atribuir animação",
      54: "Câmera (variantes por sub-tipo)",
      55: "Posição/orientação",
      60: "Expressão facial",
      172: "Encadear evento",
    };
    function sceneOpLabel(opCode) {
      return SCENE_OP_LABELS[opCode] || null;
    }

    function parseScenePointerTarget(rawValue) {
      if (typeof rawValue !== "string") return null;
      const m = /^=([A-Z]+)(\d+)$/.exec(rawValue);
      if (!m) return null;
      return { col: m[1], row: Number(m[2]) };
    }

    function parseSceneSheet(ws, XLSX) {
      const cellKeys = Object.keys(ws).filter((k) => k[0] !== "!");
      const byRow = new Map();
      for (const key of cellKeys) {
        const addr = XLSX.utils.decode_cell(key);
        if (!byRow.has(addr.r)) byRow.set(addr.r, []);
        byRow.get(addr.r).push({ c: addr.c, v: ws[key].v, f: ws[key].f, ref: key });
      }
      const rowIndices = Array.from(byRow.keys()).sort((a, b) => a - b);

      const functions = [];
      const orphanInstructions = [];
      let currentFunction = null;
      let headerTypes = null;

      const cellDisplayValue = (cell) =>
        cell === undefined ? null : cell.f !== undefined && cell.f !== null ? "=" + cell.f : cell.v;

      for (const r of rowIndices) {
        const cells = byRow.get(r).sort((a, b) => a.c - b.c);
        const colA = cells.find((c) => c.c === 0);
        const colB = cells.find((c) => c.c === 1);

        if (colA && colA.v === "FUNCTION") {
          currentFunction = { name: (colB && colB.v) || "", row: r + 1, instructions: [] };
          functions.push(currentFunction);
          continue;
        }
        if (colA && colA.v === "Location") {
          headerTypes = new Map();
          for (const cell of cells) {
            if (cell.c >= 2 && cell.v !== null && cell.v !== undefined && cell.v !== "") {
              headerTypes.set(cell.c, cell.v);
            }
          }
          continue;
        }
        if (colA && typeof colA.v === "number" && headerTypes) {
          const location = colA.v;
          const opCode = colB ? colB.v : null;
          const params = [];
          for (const [col0, type] of headerTypes) {
            const cell = cells.find((c) => c.c === col0);
            params.push({ col: col0 + 1, type, value: cellDisplayValue(cell) });
          }
          const instruction = { row: r + 1, location, opCode, params, label: sceneOpLabel(opCode) };
          if (currentFunction) currentFunction.instructions.push(instruction);
          else orphanInstructions.push(instruction);
        }
      }

      return { functions, orphanInstructions };
    }

    function findSceneParam(instruction, col) {
      return instruction.params.find((p) => p.col === col) || null;
    }

    function validateSceneEdit(instruction, col) {
      const param = findSceneParam(instruction, col);
      if (!param) return { ok: false, reason: "coluna não faz parte dos parâmetros desta instrução" };
      if (!isEditableSceneParamType(param.type)) {
        return { ok: false, reason: `coluna do tipo "${param.type}" não é editável (estrutura/fórmula, não dado)` };
      }
      return { ok: true };
    }

    function applySceneEditsToWorksheet(ws, XLSX, edits) {
      const next = Object.assign({}, ws);
      for (const e of edits) {
        const addr = XLSX.utils.encode_cell({ r: e.row - 1, c: e.col - 1 });
        const existing = next[addr] || {};
        const isNumber = typeof e.value === "number";
        const cell = Object.assign({}, existing, { v: e.value, t: isNumber ? "n" : "s" });
        delete cell.f;
        next[addr] = cell;
      }
      return next;
    }

    function baseName(fileName) {
      return fileName.replace(/\.xlsx$/i, "");
    }

    function safeForFilename(name) {
      return name.replace(/[\\/:*?"<>|]+/g, "-").trim() || "Projeto";
    }

    // ---------------------------------------------------------------------------
    // Onde salvar os arquivos baixados
    // ---------------------------------------------------------------------------
    // `savedDirHandle` é a pasta que o usuário escolheu (se o navegador
    // suportar a File System Access API — Chrome/Edge). Enquanto ela existir,
    // TODOS os downloads vão direto pra lá sem perguntar de novo. Sem pasta
    // escolhida, cai pro seletor "Salvar como" nativo (se suportado) ou, por
    // último, pro link de download clássico do navegador.
    let savedDirHandle = null;

    // ---------------------------------------------------------------------------
    // Criptografia opcional da chave de API em repouso (auditoria 1.3) — não
    // elimina o risco de rede (a chave sempre viaja em texto puro pro
    // provedor de IA escolhido, isso é inerente a qualquer app sem backend
    // no meio) — protege especificamente contra "alguém com acesso ao
    // IndexedDB deste navegador" (outra pessoa na mesma máquina, extensão
    // maliciosa etc.). A frase-senha NUNCA é salva em disco — só vive no
    // estado React desta aba, uma sessão de cada vez; fechar/recarregar a
    // aba exige digitar ela de novo pra desbloquear.
    // ---------------------------------------------------------------------------
    function bytesToBase64(bytes) {
      let bin = "";
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    }
    function base64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    async function deriveAesKey(passphrase, saltBytes, usages) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: saltBytes, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        usages
      );
    }
    async function encryptApiKey(plainKey, passphrase) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveAesKey(passphrase, salt, ["encrypt"]);
      const cipherBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(plainKey));
      return {
        cipher: bytesToBase64(new Uint8Array(cipherBuf)),
        iv: bytesToBase64(iv),
        salt: bytesToBase64(salt),
      };
    }
    async function decryptApiKey(encrypted, passphrase) {
      const salt = base64ToBytes(encrypted.salt);
      const iv = base64ToBytes(encrypted.iv);
      const cipher = base64ToBytes(encrypted.cipher);
      const key = await deriveAesKey(passphrase, salt, ["decrypt"]);
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
      return new TextDecoder().decode(plainBuf);
    }

    async function saveBlobToDisk(blob, filename, description, mimeType, extensions) {
      if (savedDirHandle) {
        try {
          const fileHandle = await savedDirHandle.getFileHandle(filename, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (e) {
          console.error("Falha ao salvar na pasta escolhida, tentando outro jeito:", e);
        }
      }
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: mimeType ? [{ description, accept: { [mimeType]: extensions } }] : undefined,
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (e) {
          if (e && e.name === "AbortError") return false; // usuário cancelou o diálogo
          console.error("Falha ao usar o seletor de local, caindo pro download padrão:", e);
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    }

    async function downloadWorkbook(wb, filename) {
      const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/octet-stream" });
      await saveBlobToDisk(
        blob,
        filename,
        "Planilha Excel",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        [".xlsx"]
      );
    }

    async function downloadTextFile(content, filename) {
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      await saveBlobToDisk(blob, filename, "Arquivo de texto", "text/plain", [".txt"]);
    }

    async function downloadTmxFile(content, filename) {
      const blob = new Blob([content], { type: "application/x-tmx+xml;charset=utf-8" });
      await saveBlobToDisk(blob, filename, "Memória de tradução (TMX)", "application/xml", [".tmx"]);
    }

    function escapeXml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function tmxTimestamp(ms) {
      const d = ms ? new Date(ms) : new Date();
      return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    }

    // ---------------------------------------------------------------------------
    // Códigos de controle do script (formato usado pelo SenScriptsDecompiler)
    // ---------------------------------------------------------------------------
    // Regex único usado tanto pra proteger os códigos na tradução automática
    // quanto pra exibir/catalogar quais códigos aparecem em cada linha.
    //
    // IMPORTANTE: baseado no código-fonte real do decompilador (função
    // reading_dialog), cada tipo de código tem um tamanho EXATO — não é
    // "# seguido de qualquer letra/número até acabar". Antes esse regex era
    // largo demais e "comia" o começo da frase junto (ex: "#B_0Let's..."
    // virava um código só, grudando o "Let" nele). Agora cada alternativa
    // tem um limite certo:
    //   #X[...]   -> letra do grupo retrato + colchetes (ex: #E[12])
    //   #X_c      -> letra do grupo retrato + underscore + 1 caractere (#B_0)
    //   #X        -> letra do grupo "simples", sozinha (ex: #C)
    //   #123X     -> dígito(s) + 1 letra, padrão de formatação observado (#0C)
    // Quebra de linha NÃO entra mais aqui — agora é tratada à parte (contamos
    // quantas linhas o original tem e reformatamos a tradução pra bater,
    // sem cortar palavra no meio; ver wrapToLineCount mais abaixo).
    // O trecho "#X[...]" aceita UM nível de colchete aninhado:
    // \[(?:[^\[\]]|\[[^\[\]]*\])*\]  em vez do antigo  \[[^\]]*\].
    //
    // Motivo real, achado num diagnóstico de QA de 66 mil linhas:
    //   #E[99999999999999999999999999999[autoE8]]
    // O padrão antigo parava no PRIMEIRO "]", então casava só
    // "#E[99999999999999999999999999999[autoE8]" e deixava um "]" solto no
    // texto. Esse "]" órfão ia pro modelo junto com a frase e, na volta, o
    // "#M_A#B_0" que vinha logo depois se perdia — o único problema CRÍTICO
    // do relatório inteiro.
    //
    // A alternância não é gulosa a ponto de atravessar códigos vizinhos:
    // [^\[\]] exclui os dois colchetes, então "#E[1]#M_0" nunca vira um
    // casamento só.
    const CODE_REGEX_SOURCE = /#[EeMBHVKkF]\[(?:[^\[\]]|\[[^\[\]]*\])*\]|#[EeMBHVKkF]_.|#[EeMBHVKkF]|#[IiPTWSsCcxyGDUR]|#\d+[A-Za-z]/;

    // Auditoria 5.2: em vez de expor um regex /g mutável compartilhado no
    // escopo do módulo (cujo `lastIndex` cada call site precisava lembrar
    // de resetar manualmente), matchAllCodes cria um regex novo por
    // chamada e devolve os matches com posição — nenhum estado global pra
    // esquecer de limpar.
    function matchAllCodes(text) {
      const re = new RegExp(CODE_REGEX_SOURCE.source, "g");
      const matches = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        matches.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
        if (m[0].length === 0) re.lastIndex++;
      }
      return matches;
    }

    // Baseado no código-fonte real do decompilador (TwnKey/SenScriptsDecompiler,
    // função reading_dialog): depois de "#", só um conjunto específico de letras
    // é tratado como início de código de controle — as demais viram texto normal.
    // Letras confirmadas pela fonte: E e M B H V K k F (formato #X[n] ou #X_c)
    // e I i P T W S s C c x y G D U R (formato #X simples).
    // O SIGNIFICADO de cada uma não vem comentado no código-fonte, então aqui
    // vai o que dá pra inferir com razoável confiança (E/M/B quase sempre andam
    // juntos, no padrão clássico de expressão facial de visual novel) e o que
    // ainda é desconhecido — marcado como tal, sem inventar.
    const CODE_GLOSSARY = [
      { key: "E", re: /^#[Ee]\[?/, label: "Expressão (retrato)", confidence: "inferido", note: "Troca a expressão do retrato do personagem. Aparece quase sempre junto com #M_ e #B_." },
      { key: "M", re: /^#M_/, label: "Boca (fala)", confidence: "inferido", note: "Controla a forma/animação da boca durante a fala." },
      { key: "B", re: /^#B_/, label: "Piscar (olhos)", confidence: "inferido", note: "Controla o estado de piscar dos olhos do retrato." },
      { key: "H", re: /^#H/, label: "Desconhecido (grupo retrato)", confidence: "desconhecido", note: "Faz parte do mesmo grupo estrutural de E/M/B/V/K/F, mas função exata não confirmada." },
      { key: "V", re: /^#V/, label: "Desconhecido (possível voz)", confidence: "desconhecido", note: "Estrutura sugere referência a algum recurso (talvez clipe de voz), não confirmado." },
      { key: "K", re: /^#[Kk]/, label: "Desconhecido", confidence: "desconhecido", note: "Função exata não documentada." },
